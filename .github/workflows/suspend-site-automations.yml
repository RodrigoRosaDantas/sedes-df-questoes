name: Suspender automações do site

on:
  push:
    branches: [main]
    paths:
      - 'data/operations/suspend-site-automations-trigger.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: suspend-site-automations
  cancel-in-progress: false

jobs:
  suspend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Remover todos os gatilhos automáticos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import re

          workflow_dir = Path('.github/workflows')
          changed = []
          inspected = []

          def workflow_dispatch_block(lines, start, end):
              block = lines[start + 1:end]
              child_starts = []
              for index, line in enumerate(block):
                  if re.match(r'^  [A-Za-z_][A-Za-z0-9_-]*\s*:', line):
                      child_starts.append(index)
              for pos, child_start in enumerate(child_starts):
                  if re.match(r'^  workflow_dispatch\s*:', block[child_start]):
                      child_end = child_starts[pos + 1] if pos + 1 < len(child_starts) else len(block)
                      return block[child_start:child_end]
              return ['  workflow_dispatch:\n']

          for path in sorted(workflow_dir.glob('*.y*ml')):
              inspected.append(str(path))
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              start = next((i for i, line in enumerate(lines) if re.match(r'^on\s*:', line)), None)
              if start is None:
                  continue
              end = start + 1
              while end < len(lines):
                  line = lines[end]
                  if line.strip() == '' or line.lstrip().startswith('#') or line.startswith((' ', '\t')):
                      end += 1
                      continue
                  break
              kept = workflow_dispatch_block(lines, start, end)
              replacement = ['on:\n', *kept]
              if replacement[-1].strip() != '':
                  replacement.append('\n')
              updated = ''.join(lines[:start] + replacement + lines[end:])
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          trigger = Path('data/operations/suspend-site-automations-trigger.json')
          if trigger.exists():
              trigger.unlink()

          receipt = {
              'schema_version': '1.0',
              'operation': 'SUSPEND-SITE-AUTOMATIONS',
              'suspended_at': datetime.now(timezone.utc).isoformat(),
              'mode': 'manual_only',
              'automatic_triggers_removed': ['push', 'pull_request', 'schedule'],
              'workflows_inspected': inspected,
              'workflows_changed': changed,
              'site_content_changed': False,
              'site_progress_data_changed': False,
              'reversible': True,
          }
          receipt_path = Path('data/operations/site-automations-suspended.json')
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY

      - name: Versionar a suspensão
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-site-control[bot]'
          git config user.email 'sedes-site-control[bot]@users.noreply.github.com'
          git add .github/workflows data/operations
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
          else
            git commit -m 'Suspender monitoramentos e rotinas automáticas do site [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cancelar execuções automáticas ainda abertas
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for cycle in 1 2 3; do
            for status in queued in_progress waiting requested pending; do
              gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
                --jq '.workflow_runs[].id' 2>/dev/null \
                | while read -r run_id; do
                    [ -z "${run_id}" ] && continue
                    [ "${run_id}" = "${SELF_RUN_ID}" ] && continue
                    gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
                    echo "Cancelamento solicitado para o run ${run_id}."
                  done
            done
            sleep 5
          done

      - name: Confirmar modo manual
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          violations = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'^on\s*:\s*\n(?P<body>(?:^[ \t].*\n|^\s*$)*)', text, re.MULTILINE)
              body = match.group('body') if match else ''
              for forbidden in ('push:', 'pull_request:', 'schedule:'):
                  if re.search(rf'^  {re.escape(forbidden)}', body, re.MULTILINE):
                      violations.append(f'{path}: {forbidden}')
          if violations:
              raise SystemExit('Gatilhos automáticos remanescentes:\n' + '\n'.join(violations))
          print('✓ Todos os workflows ficaram somente sob acionamento manual.')
          PY
