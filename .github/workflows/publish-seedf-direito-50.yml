name: Publicar lote SEEDF Direito 71 a 120

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-seedf-direito-50.yml
      - data/operations/publish-seedf-dir-50.json
      - scripts/validate-seedf-dir-50-operation.mjs

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-seedf-direito-50
  cancel-in-progress: false

env:
  PUBLICATION_PLAN_PATH: data/notion/publication-plan.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar main autorizada
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Preservar snapshot anterior
        run: cp data/notion/published.json /tmp/published-before.json

      - name: Consultar a fonte editorial viva
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs

      - name: Gerar plano explícito de publicação
        run: node scripts/create-publication-plan.mjs

      - name: Validar integridade e escopo autorizado
        env:
          SNAPSHOT_BEFORE: /tmp/published-before.json
        run: |
          node scripts/validate-notion-snapshot.mjs
          node scripts/validate-publication-plan.mjs
          node scripts/validate-seedf-dir-50-operation.mjs

      - name: Versionar somente o pacote aprovado
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'

          git rm .github/workflows/publish-seedf-direito-50.yml
          git rm scripts/validate-seedf-dir-50-operation.mjs
          git rm data/operations/publish-seedf-dir-50.json
          git add data/notion/published.json "${PUBLICATION_PLAN_PATH}"

          git commit -m 'Preparar publicação de 50 questões de Direito da SEEDF [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main

          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo '✓ Snapshot e plano versionados; arquivos temporários removidos da main.'

      - name: Acionar e acompanhar o deploy aprovado
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --ref main -f source_sha="${SOURCE_SHA}" -f close_notion=true

          RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=main&per_page=50" > /tmp/pages-runs.json
            RUN_ID=$(jq -r --arg sha "${SOURCE_SHA}" --arg since "${DISPATCHED_AT}" '
              .workflow_runs[]
              | select(.head_sha == $sha)
              | select(.name == "Validar e publicar GitHub Pages")
              | select(.event == "workflow_dispatch")
              | select(.created_at >= $since)
              | .id
            ' /tmp/pages-runs.json | head -n1)
            if [ -n "${RUN_ID}" ]; then break; fi
            sleep 5
          done

          if [ -z "${RUN_ID}" ]; then
            echo 'A execução de Pages não foi criada dentro da janela de segurança.'
            exit 1
          fi

          gh run watch "${RUN_ID}" --exit-status --interval 10
          echo "✓ Publicação concluída para ${SOURCE_SHA}."
