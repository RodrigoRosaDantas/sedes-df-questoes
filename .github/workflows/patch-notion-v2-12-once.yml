name: Corrigir preservação do snapshot Notion uma vez

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/notion-sync-ce-v2-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preservar registros publicados e estabilizar materiais
        run: |
          python3 - <<'PY'
          from pathlib import Path

          exporter_path = Path('scripts/export-notion-snapshot.mjs')
          exporter = exporter_path.read_text()
          old_filter = ".filter(row => row['Pode publicar'] === true)"
          new_filter = ".filter(row => row['Pode publicar'] === true || clean(row['Código GitHub']))"
          if old_filter in exporter:
              exporter = exporter.replace(old_filter, new_filter)
          elif new_filter not in exporter:
              raise SystemExit('Filtro do snapshot não localizado')
          exporter = exporter.replace(
              "publication_rule: 'Pode publicar = true; alternativas A–E vazias = Certo / Errado',",
              "publication_rule: 'Pode publicar = true ou Código GitHub preenchido; alternativas A–E vazias = Certo / Errado',",
          )
          exporter_path.write_text(exporter)

          applier_path = Path('scripts/apply-notion-snapshot.mjs')
          applier = applier_path.read_text()
          old_material = '''function materialIdFor(record, matched) {
            if (matched) return matched.material_id;
            return materialByName.get(key(record.material_name)) || `notion-${slug(record.material_name || record.code)}`;
          }'''.replace('            ', '')
          new_material = '''const assignedMaterialIds = new Map();
          function materialIdFor(record, matched) {
            const materialKey = key(record.material_name);
            if (assignedMaterialIds.has(materialKey)) return assignedMaterialIds.get(materialKey);
            const selected = materialByName.get(materialKey) || matched?.material_id || `notion-${slug(record.material_name || record.code)}`;
            assignedMaterialIds.set(materialKey, selected);
            return selected;
          }'''.replace('          ', '')
          if old_material in applier:
              applier = applier.replace(old_material, new_material)
          elif 'const assignedMaterialIds = new Map();' not in applier:
              raise SystemExit('Agrupamento de materiais não localizado')
          applier_path.write_text(applier)
          PY
      - name: Registrar correções
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/export-notion-snapshot.mjs scripts/apply-notion-snapshot.mjs
          if git diff --cached --quiet; then
            echo 'Correções já aplicadas.'
          else
            git commit -m 'Preserva questões já publicadas no snapshot do Notion'
            git push origin HEAD:${{ github.head_ref }}
          fi
