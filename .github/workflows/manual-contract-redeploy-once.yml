name: Redeploy manual do contrato público reconciliado

on:
  push:
    branches: [main]
    paths:
      - data/operations/manual-contract-redeploy-trigger.json

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: manual-contract-redeploy-20260805
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.61.1
  BASE_SNAPSHOT_COMMIT: c060ed9a6d4c46c637a5215b3a2738b28a8d405e
  PUBLICATION_PLAN_PATH: data/notion/publication-plan.json

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Confirmar escopo e suspensão
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.operation' data/operations/manual-contract-redeploy-trigger.json)" = 'REDEPLOY-RECONCILED-PUBLIC-CONTRACT'
          test "$(jq -r '.mode' data/operations/site-automations-suspended.json)" = 'manual_only'
          test "$(head -n 1 .github/workflows/pages.yml)" = 'name: Validar e publicar GitHub Pages — SUSPENSO'
          test "$(head -n 1 .github/workflows/notion-sync.yml)" = 'name: Sincronizar Banco Mestre do Notion — SUSPENSO'
          rm -f .github/workflows/manual-contract-redeploy-once.yml
          rm -f .github/workflows/record-manual-contract-run.yml

      - name: Exportar saneamentos editoriais autorizados
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-editorial-platform-sync.mjs
          node scripts/export-pedagogia-editorial-sync.mjs

      - name: Preservar lote corrente e restaurar snapshot-base
        shell: bash
        run: |
          set -euo pipefail
          cp data/notion/published.json /tmp/current-publication-snapshot.json
          cp data/notion/publication-plan.json /tmp/current-publication-plan.json
          git fetch origin "${BASE_SNAPSHOT_COMMIT}" --depth=1
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/published.json" > data/notion/published.json
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/publication-plan.json" > data/notion/publication-plan.json

      - name: Executar validação integral da base
        run: npm run check

      - name: Restaurar snapshot e plano do lote corrente
        run: |
          cp /tmp/current-publication-snapshot.json data/notion/published.json
          cp /tmp/current-publication-plan.json data/notion/publication-plan.json

      - name: Instalar Chromium e auditar dependências
        run: |
          AUDIT_DIR=$(mktemp -d)
          printf '{"name":"sedes-contract-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          npm install --prefix "$AUDIT_DIR" --package-lock-only --ignore-scripts --save-dev "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --prefix "$AUDIT_DIR" --audit-level=high
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Testar plataforma-base como usuário real
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/sedes-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test --grep-invert "publica somente as 50 questões autorizadas de Direito"

      - name: Aplicar e testar Direito
        run: |
          node scripts/apply-publication-additions.mjs
          npx playwright test tests/publication-additions.spec.js

      - name: Aplicar e testar Biologia
        run: |
          node scripts/apply-seedf-bio-24-addition.mjs
          npx playwright test tests/seedf-bio-24-publication.spec.js

      - name: Aplicar e testar Biomedicina
        run: |
          node scripts/apply-seedf-biomed-50-addition.mjs
          npx playwright test tests/seedf-biomed-50-publication.spec.js

      - name: Aplicar e testar Eletrotécnica
        run: |
          node scripts/apply-seedf-eletrot-43-addition.mjs
          npx playwright test tests/seedf-eletrot-43-publication.spec.js

      - name: Aplicar e testar Orientador Social
        run: |
          node scripts/apply-alto-paraiso-orientador-37-addition.mjs
          npx playwright test tests/alto-paraiso-orientador-37-publication.spec.js

      - name: Aplicar e testar Agente Fiscal
        run: |
          node scripts/apply-crefito17-agentefiscal-62-addition.mjs
          npx playwright test tests/crefito17-agentefiscal-62-publication.spec.js

      - name: Aplicar e testar Contador
        run: |
          test -f data/notion/publication-additions/crbm6-contador-70.json
          test -f data/notion/publication-additions/crbm6-contador-70-plan.json
          node scripts/apply-crbm6-contador-70-addition.mjs
          npx playwright test tests/crbm6-contador-70-publication.spec.js

      - name: Reconciliar e confirmar contrato final
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-public-metadata.mjs
          node scripts/validate-public-metadata-consistency.mjs
          test "$(jq -r '.banco_mestre' dist/data/release/release-meta.json)" = '2946'
          test "$(jq -r '.questions' dist/data/release/release-meta.json)" = '2871'
          test "$(jq -r '.awaiting_audit' dist/data/release/release-meta.json)" = '75'
          test "$(jq -r '.materials' dist/data/release/release-meta.json)" = '67'

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verificar arquivos públicos
        id: static_verify
        continue-on-error: true
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"

      - name: Confirmar os três metadados públicos
        id: metadata_verify
        continue-on-error: true
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${DEPLOYED_URL%/}"
          TOKEN="$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/data/release/release-meta.json?audit=$TOKEN" -o /tmp/release-meta.json
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/data/release/catalogo.json?audit=$TOKEN" -o /tmp/catalogo.json
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/data/release/manifest.json?audit=$TOKEN" -o /tmp/manifest.json
          for FILE in /tmp/release-meta.json /tmp/catalogo.json /tmp/manifest.json; do jq empty "$FILE"; done
          for FILE in /tmp/catalogo.json /tmp/manifest.json; do
            test "$(jq -r '.summary.banco_mestre' "$FILE")" = '2946'
            test "$(jq -r '.summary.questoes' "$FILE")" = '2871'
            test "$(jq -r '.summary.aguardando_auditoria' "$FILE")" = '75'
            test "$(jq -r '.summary.materiais' "$FILE")" = '67'
          done
          test "$(jq -r '.banco_mestre' /tmp/release-meta.json)" = '2946'
          test "$(jq -r '.questions' /tmp/release-meta.json)" = '2871'
          test "$(jq -r '.awaiting_audit' /tmp/release-meta.json)" = '75'
          test "$(jq -r '.materials' /tmp/release-meta.json)" = '67'
          test "$(sha256sum /tmp/catalogo.json | awk '{print $1}')" = "$(jq -r '.catalog_sha256' /tmp/manifest.json)"

      - name: Executar suíte pública
        id: browser_verify
        if: steps.static_verify.outcome == 'success' && steps.metadata_verify.outcome == 'success'
        continue-on-error: true
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npx playwright test --config=playwright.public.config.js

      - name: Reverter publicação inconsistente
        if: steps.static_verify.outcome == 'failure' || steps.metadata_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rollback-deployment.mjs

      - name: Reprovar inconsistência pública
        if: steps.static_verify.outcome == 'failure' || steps.metadata_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure'
        run: exit 1

      - name: Confirmar sucesso
        run: |
          echo "✓ Contrato público reconciliado e publicado."
          echo "✓ Banco Mestre 2.946 · site 2.871 · auditoria 75 · materiais 67."
