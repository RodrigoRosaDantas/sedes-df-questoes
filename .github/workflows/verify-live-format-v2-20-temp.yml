name: Verificar público estável v2.20

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live:
    if: github.event.pull_request.head.ref == 'agent/verificar-publico-estavel-v2-20'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main canônica
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar SHA e formatos já servidos
        run: |
          curl -fsSL --retry 8 --retry-delay 2 "https://rodrigorosadantas.github.io/sedes-df-questoes/data/release/build-info.json?v220stable=${GITHUB_RUN_ID}" -o /tmp/public-build.json
          curl -fsSL --retry 8 --retry-delay 2 "https://rodrigorosadantas.github.io/sedes-df-questoes/data/release/release-meta.json?v220stable=${GITHUB_RUN_ID}" -o /tmp/public-meta.json
          curl -fsSL --retry 8 --retry-delay 2 "https://rodrigorosadantas.github.io/sedes-df-questoes/data/release/question-format-index.json?v220stable=${GITHUB_RUN_ID}" -o /tmp/public-format.json
          node - <<'NODE'
          const fs=require('fs');
          const build=JSON.parse(fs.readFileSync('/tmp/public-build.json','utf8'));
          const meta=JSON.parse(fs.readFileSync('/tmp/public-meta.json','utf8'));
          const format=JSON.parse(fs.readFileSync('/tmp/public-format.json','utf8'));
          const expected='e3f35f6dd0c0e88b1a158ac05e67ca7b2201a6d0';
          if(build.source_sha!==expected) throw new Error(`SHA público ${build.source_sha} != ${expected}`);
          if(Number(build.questions)!==3447 || Number(build.materials)!==75 || Number(meta.banco_mestre)!==3449 || Number(meta.awaiting_audit)!==0) throw new Error('Totais públicos divergentes');
          if(Number(format.question_count)!==3447 || Number(format.summary?.['true-false'])!==2538 || Number(format.summary?.['multiple-choice'])!==909) throw new Error('Formatos públicos divergentes');
          console.log(`PUBLIC_SOURCE_SHA=${build.source_sha}`);
          console.log('PUBLIC_FORMATS=2538 C/E | 909 múltipla escolha | total 3447');
          console.log('PUBLIC_RELEASE=3447 questões | 75 materiais | Banco 3449 | 0 auditoria');
          NODE

      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Executar suíte pública sem novo deploy
        env:
          PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes/
          EXPECTED_SHA: e3f35f6dd0c0e88b1a158ac05e67ca7b2201a6d0
        run: npx playwright test --config=playwright.public.config.js
