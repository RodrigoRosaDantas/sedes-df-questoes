name: Redeploy manual do contrato público reconciliado

on:
  push:
    branches: [main]
    paths:
      - data/operations/manual-contract-redeploy-trigger.json

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: manual-contract-redeploy-20260805
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.61.1

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Confirmar escopo e suspensão
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.operation' data/operations/manual-contract-redeploy-trigger.json)" = 'REDEPLOY-RECONCILED-PUBLIC-CONTRACT'
          test "$(jq -r '.mode' data/operations/site-automations-suspended.json)" = 'manual_only'
          test "$(head -n 1 .github/workflows/pages.yml)" = 'name: Validar e publicar GitHub Pages — SUSPENSO'
          test "$(head -n 1 .github/workflows/notion-sync.yml)" = 'name: Sincronizar Banco Mestre do Notion — SUSPENSO'

      - name: Executar validação integral
        run: npm run check

      - name: Confirmar contrato do artefato
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-public-metadata-consistency.mjs
          test "$(jq -r '.banco_mestre' dist/data/release/release-meta.json)" = '2946'
          test "$(jq -r '.questions' dist/data/release/release-meta.json)" = '2871'
          test "$(jq -r '.awaiting_audit' dist/data/release/release-meta.json)" = '75'
          test "$(jq -r '.materials' dist/data/release/release-meta.json)" = '67'

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verificar arquivos públicos
        id: static_verify
        continue-on-error: true
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"

      - name: Confirmar os três metadados públicos
        id: metadata_verify
        continue-on-error: true
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${DEPLOYED_URL%/}"
          TOKEN="$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/data/release/release-meta.json?audit=$TOKEN" -o /tmp/release-meta.json
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/data/release/catalogo.json?audit=$TOKEN" -o /tmp/catalogo.json
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/data/release/manifest.json?audit=$TOKEN" -o /tmp/manifest.json
          for FILE in /tmp/release-meta.json /tmp/catalogo.json /tmp/manifest.json; do jq empty "$FILE"; done
          for FILE in /tmp/catalogo.json /tmp/manifest.json; do
            test "$(jq -r '.summary.banco_mestre' "$FILE")" = '2946'
            test "$(jq -r '.summary.questoes' "$FILE")" = '2871'
            test "$(jq -r '.summary.aguardando_auditoria' "$FILE")" = '75'
            test "$(jq -r '.summary.materiais' "$FILE")" = '67'
          done
          test "$(jq -r '.banco_mestre' /tmp/release-meta.json)" = '2946'
          test "$(jq -r '.questions' /tmp/release-meta.json)" = '2871'
          test "$(jq -r '.awaiting_audit' /tmp/release-meta.json)" = '75'
          test "$(jq -r '.materials' /tmp/release-meta.json)" = '67'
          test "$(sha256sum /tmp/catalogo.json | awk '{print $1}')" = "$(jq -r '.catalog_sha256' /tmp/manifest.json)"

      - name: Instalar Chromium para auditoria pública
        if: steps.static_verify.outcome == 'success' && steps.metadata_verify.outcome == 'success'
        run: |
          AUDIT_DIR=$(mktemp -d)
          printf '{"name":"sedes-contract-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          npm install --prefix "$AUDIT_DIR" --package-lock-only --ignore-scripts --save-dev "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --prefix "$AUDIT_DIR" --audit-level=high
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Executar suíte pública
        id: browser_verify
        if: steps.static_verify.outcome == 'success' && steps.metadata_verify.outcome == 'success'
        continue-on-error: true
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npx playwright test --config=playwright.public.config.js

      - name: Reverter publicação inconsistente
        if: steps.static_verify.outcome == 'failure' || steps.metadata_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rollback-deployment.mjs

      - name: Reprovar inconsistência pública
        if: steps.static_verify.outcome == 'failure' || steps.metadata_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure'
        run: exit 1

      - name: Confirmar sucesso
        run: |
          echo "✓ Contrato público reconciliado e publicado."
          echo "✓ Banco Mestre 2.946 · site 2.871 · auditoria 75 · materiais 67."
