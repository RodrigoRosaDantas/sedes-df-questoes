name: Repetir publicação CRFa-1 Analista — 115 itens

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-deploy-crfa1-analista-115.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: retry-deploy-crfa1-analista-115
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Recuperar validadores auditados da operação original
        shell: bash
        run: |
          set -euo pipefail
          git show a20b65612f867d4f6b09ea952589cdb4a29f2340:scripts/validate-crfa1-analista-115-deploy.mjs > /tmp/validate-crfa1-analista-115-deploy.mjs
          git show a20b65612f867d4f6b09ea952589cdb4a29f2340:scripts/close-crfa1-analista-115-after-deploy.mjs > /tmp/close-crfa1-analista-115-after-deploy.mjs
          test -s /tmp/validate-crfa1-analista-115-deploy.mjs
          test -s /tmp/close-crfa1-analista-115-after-deploy.mjs

      - name: Revalidar pacote imutável e baseline
        env:
          CRFA_ROOT: ${{ github.workspace }}
        run: node /tmp/validate-crfa1-analista-115-deploy.mjs source

      - name: Criar commit limpo da nova tentativa e auto-remover retry
        id: release_source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/retry-deploy-crfa1-analista-115.yml
          git commit -m 'Repetir publicação de 115 questões do CRFa-1 [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "✓ Commit limpo da nova tentativa: ${RELEASE_SHA}."

      - name: Gerar saneamentos editoriais temporários exigidos pelo build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-editorial-platform-sync.mjs
          node scripts/export-pedagogia-editorial-sync.mjs
          test -s data/editorial-runtime/platform-sync-2026-08-01.json
          test -s data/editorial-runtime/pedagogia-sync-2026-08-02.json
          echo '✓ Saneamentos temporários reconstruídos apenas no workspace do deploy.'

      - name: Construir, testar e validar o artefato 3161/72
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          set -u
          LOG=/tmp/crfa1-deploy-retry-check.log
          echo "Release SHA: ${RELEASE_SHA}" | tee "${LOG}"

          persist_failure() {
            local status="$1"
            local stage="$2"
            echo "FALHA EM ${stage}; status ${status}." | tee -a "${LOG}"
            cp "${LOG}" /tmp/crfa1-deploy-retry-check-preserved.log
            git reset --hard HEAD
            git clean -fd
            mkdir -p data/operations
            cp /tmp/crfa1-deploy-retry-check-preserved.log data/operations/crfa1-analista-115-deploy-retry-failure.log
            git add data/operations/crfa1-analista-115-deploy-retry-failure.log
            git commit -m 'Registrar falha da nova tentativa CRFa-1 [skip ci]'
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
            git push origin HEAD:main
            exit "${status}"
          }

          set +e
          GITHUB_SHA="${RELEASE_SHA}" npm run check 2>&1 | tee -a "${LOG}"
          CHECK_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${CHECK_STATUS}" -ne 0 ]; then persist_failure "${CHECK_STATUS}" 'npm run check'; fi

          set +e
          CRFA_ROOT="${GITHUB_WORKSPACE}" node /tmp/validate-crfa1-analista-115-deploy.mjs dist "${RELEASE_SHA}" 2>&1 | tee -a "${LOG}"
          DIST_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${DIST_STATUS}" -ne 0 ]; then persist_failure "${DIST_STATUS}" 'gate dist CRFa-1'; fi
          echo '✓ Build e gate dist concluídos sem falha.' | tee -a "${LOG}"

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar artefato já validado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirmar metadados estáticos publicados
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${RELEASE_SHA}"

      - name: Confirmar lote CRFa-1 no endereço público
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          node --input-type=module - <<'NODE'
          const base = new URL(process.env.PUBLIC_URL.endsWith('/') ? process.env.PUBLIC_URL : `${process.env.PUBLIC_URL}/`);
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const clean = value => String(value ?? '').trim();
          const blocked = [5, 48, 54, 102, 104];
          const prefix = 'PROVA-QDX-CRFA1-2026-ANALISTA-ADMINISTRATIVO-400-';
          let lastError;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              const stamp = `${Date.now()}-${attempt}`;
              const [buildResponse, catalogResponse] = await Promise.all([
                fetch(new URL(`data/release/build-info.json?audit=${stamp}`, base), {cache: 'no-store'}),
                fetch(new URL(`data/release/catalogo.json?audit=${stamp}`, base), {cache: 'no-store'}),
              ]);
              if (!buildResponse.ok || !catalogResponse.ok) throw new Error(`HTTP ${buildResponse.status}/${catalogResponse.status}`);
              const build = await buildResponse.json();
              const catalog = await catalogResponse.json();
              if (clean(build.source_sha) !== process.env.RELEASE_SHA) throw new Error(`source_sha ${build.source_sha}`);
              if (Number(build.questions) !== 3161 || Number(catalog.summary?.questoes) !== 3161) throw new Error(`total ${build.questions}/${catalog.summary?.questoes}`);
              const meta = (catalog.materials || []).find(item => clean(item.nome) === 'Analista Administrativo — CRFa-1 — Quadrix 2026');
              if (!meta || Number(meta.quantidade_questoes) !== 115) throw new Error('material CRFa-1 ausente ou incompleto');
              const materialUrl = new URL(String(meta.file).replace(/^\.\//, ''), base);
              materialUrl.searchParams.set('audit', stamp);
              const materialResponse = await fetch(materialUrl, {cache: 'no-store'});
              if (!materialResponse.ok) throw new Error(`material HTTP ${materialResponse.status}`);
              const material = await materialResponse.json();
              const questions = material.questoes || [];
              if (questions.length !== 115) throw new Error(`material contém ${questions.length}`);
              const codes = new Set(questions.map(item => clean(item.codigo)));
              for (const number of blocked) if (codes.has(`${prefix}${String(number).padStart(3, '0')}`)) throw new Error(`bloqueio ${number} publicado`);
              const answers = new Map(questions.map(item => [Number(item.numero_original ?? item.numero), clean(item.gabarito)]));
              for (const [number, answer] of [[47,'Certo'],[52,'Errado'],[57,'Errado'],[107,'Errado'],[108,'Errado']]) if (answers.get(number) !== answer) throw new Error(`gabarito ${number}=${answers.get(number)}`);
              console.log(`✓ Produção confirmada: 3161 questões; CRFa-1 115/115; SHA ${process.env.RELEASE_SHA}.`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Tentativa pública ${attempt}/30: ${error.message}`);
              await sleep(5000);
            }
          }
          throw lastError || new Error('Produção não convergiu.');
          NODE

      - name: Fechar rastreabilidade no Notion pelo snapshot imutável
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
          CRFA_ROOT: ${{ github.workspace }}
        run: node /tmp/close-crfa1-analista-115-after-deploy.mjs

      - name: Registrar recibo de sucesso independente do commit da release
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const receipt = {
            schema_version: '1.0',
            operation_id: 'CRFA1-2026-ANALISTA-400-115-20260807',
            status: 'success',
            release_code: `release-2.13.0:${process.env.RELEASE_SHA}`,
            release_sha: process.env.RELEASE_SHA,
            public_url: process.env.PUBLIC_URL,
            public_questions: 3161,
            public_materials: 72,
            master_bank: 3212,
            awaiting_audit: 49,
            published_records: 115,
            blocked_original_numbers: [5, 48, 54, 102, 104],
            snapshot_sha256: 'd1aa0e165dd0b2fb83e78ba75bda550d57f1f23f1ee5366f6fbab9c80c4e4b3d',
            plan_sha256: '2b49c85b2654a1094258385117648a5036f82bd2467279a25a5284a28628ed24',
            notion_closed: true,
            permanent_automations_restored: false,
            previous_failed_release_candidate: 'caa32228a9522f44983b62e20bfaccee58f60551',
          };
          fs.writeFileSync('data/operations/crfa1-analista-115-deployment-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git add data/operations/crfa1-analista-115-deployment-receipt.json
          git commit -m 'Registrar publicação confirmada do CRFa-1 [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main

      - name: Resumo
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          echo "✓ Publicação CRFa-1 concluída."
          echo "Release: release-2.13.0:${RELEASE_SHA}"
          echo "Total público: 3161"
          echo "CRFa-1: 115 publicados; 5 bloqueados preservados."
