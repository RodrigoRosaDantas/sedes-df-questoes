name: Saneamento GPPGADM 2022

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/auditar-gppgadm-2022.mjs'
      - 'scripts/sanear-gppgadm-2022.mjs'
      - '.github/workflows/auditoria-gppgadm-2022.yml'

permissions:
  contents: read

concurrency:
  group: saneamento-gppgadm-2022-20260731
  cancel-in-progress: false

jobs:
  sanear:
    if: github.head_ref == 'agent/auditoria-gppgadm-2022-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validar sintaxe
        run: |
          node --check scripts/auditar-gppgadm-2022.mjs
          node --check scripts/sanear-gppgadm-2022.mjs

      - name: Executar saneamento no Banco Mestre
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sanear-gppgadm-2022.mjs

      - name: Preservar relatório antes e depois
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saneamento-gppgadm-2022-20260731
          path: artifacts/saneamento-gppgadm-2022-20260731.json
          if-no-files-found: error
          retention-days: 90
