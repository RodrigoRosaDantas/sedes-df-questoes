name: Saneamento editorial das questões publicadas

on:
  push:
    branches:
      - agent/editorial-completion-2026-08-01
    paths:
      - data/editorial/editorial-completion-2026-08-01.json

permissions:
  contents: write

concurrency:
  group: sedes-df-editorial-completion
  cancel-in-progress: false

env:
  EDITORIAL_MANIFEST_PATH: data/editorial/editorial-completion-2026-08-01.json
  EDITORIAL_ASSEMBLED_PATH: data/editorial/editorial-completion-assembled.json
  EDITORIAL_RECEIPT_PATH: data/operations/editorial-completion-receipt.json

jobs:
  sanitize-notion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar o lote editorial isolado
        uses: actions/checkout@v6
        with:
          ref: agent/editorial-completion-2026-08-01

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Montar e validar as partes do lote
        id: assemble
        continue-on-error: true
        run: node scripts/assemble-editorial-operation.mjs

      - name: Aplicar correções com preflight e verificação integral
        id: editorial
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EDITORIAL_OPERATION_PATH: data/editorial/editorial-completion-assembled.json
        run: node scripts/apply-editorial-completion.mjs

      - name: Registrar recibo auditável no branch de saneamento
        if: always()
        shell: bash
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          EDITORIAL_OUTCOME: ${{ steps.editorial.outcome }}
        run: |
          set -euo pipefail
          if [ ! -f "${EDITORIAL_RECEIPT_PATH}" ]; then
            mkdir -p "$(dirname "${EDITORIAL_RECEIPT_PATH}")"
            jq -n \
              --arg operation_id 'EDT-2026-08-01-CREFITO17-AGENTE-FISCAL-57' \
              --arg status 'failure' \
              --arg stage 'assembly' \
              --arg assemble_outcome "${ASSEMBLE_OUTCOME:-unknown}" \
              --arg editorial_outcome "${EDITORIAL_OUTCOME:-skipped}" \
              --arg finished_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{schema_version:"1.1",operation_id:$operation_id,status:$status,stage:$stage,assemble_outcome:$assemble_outcome,editorial_outcome:$editorial_outcome,expected_records:57,updated_records:0,site_deployed:false,publication_queue_reopened:false,finished_at:$finished_at}' \
              > "${EDITORIAL_RECEIPT_PATH}"
          fi
          git config user.name 'sedes-df-editorial-sanitizer[bot]'
          git config user.email 'sedes-df-editorial-sanitizer[bot]@users.noreply.github.com'
          git add "${EDITORIAL_RECEIPT_PATH}"
          if ! git diff --cached --quiet; then
            git commit -m 'Registrar saneamento editorial do Agente Fiscal'
            git push origin HEAD:agent/editorial-completion-2026-08-01
          fi

      - name: Reprovar lote não concluído
        if: steps.assemble.outcome != 'success' || steps.editorial.outcome != 'success'
        run: exit 1
