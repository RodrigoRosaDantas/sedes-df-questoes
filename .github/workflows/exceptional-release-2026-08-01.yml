name: Publicar provas pendentes em caráter excepcional

on:
  push:
    branches: [main]
    paths:
      - data/operations/exceptional-release-2026-08-01.json

permissions:
  contents: write
  actions: write

concurrency:
  group: sedes-df-notion-sync
  cancel-in-progress: true

env:
  PUBLICATION_PLAN_PATH: data/notion/publication-plan.json
  EXCEPTION_REPORT_PATH: data/notion/exceptional-release-report.json
  CANDIDATE_BRANCH: ops/exceptional-candidate-2026-08-01
  VALIDATION_STATUS_PATH: data/operations/exceptional-validation-status.json
  VALIDATION_LOG_PATH: data/operations/exceptional-validation.log
  VISUAL_AUDIT_PATH: data/operations/exceptional-visual-audit.json

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar o branch principal
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Preparar autoria da operação
        run: |
          git config user.name 'sedes-df-exceptional-release[bot]'
          git config user.email 'sedes-df-exceptional-release[bot]@users.noreply.github.com'

      - name: Gerar snapshot aditivo conforme a autorização excepcional
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-exceptional-proofs.mjs

      - name: Fixar lote, contagem e códigos da publicação
        run: node scripts/create-publication-plan.mjs

      - name: Registrar candidato em branch isolado de auditoria
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add data/notion/published.json "${PUBLICATION_PLAN_PATH}" "${EXCEPTION_REPORT_PATH}"
          if git diff --cached --quiet; then
            echo 'A operação não produziu mudança semântica.'
          else
            git commit -m 'Preparar candidato da publicação excepcional'
          fi
          CANDIDATE_SHA=$(git rev-parse HEAD)
          git push --force origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
          echo "candidate_sha=${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"
          echo "✓ Candidato auditável registrado em ${CANDIDATE_BRANCH}: ${CANDIDATE_SHA}."

      - name: Construir e validar integralmente a plataforma
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run check > /tmp/exceptional-validation-full.log 2>&1
          EXIT_CODE=$?
          tail -n 600 /tmp/exceptional-validation-full.log > /tmp/exceptional-validation.log
          cat /tmp/exceptional-validation-full.log
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit "${EXIT_CODE}"

      - name: Auditar todos os recursos visuais do candidato
        if: always() && steps.candidate.outcome == 'success'
        shell: bash
        run: node scripts/audit-release-visuals.mjs

      - name: Registrar resultado da validação no branch candidato
        if: always() && steps.candidate.outcome == 'success'
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          cp /tmp/exceptional-validation.log /tmp/exceptional-validation-preserved.log
          if [ -f "${VISUAL_AUDIT_PATH}" ]; then
            cp "${VISUAL_AUDIT_PATH}" /tmp/exceptional-visual-audit-preserved.json
          fi
          git reset --hard "${CANDIDATE_SHA}"
          git clean -fd
          mkdir -p "$(dirname "${VALIDATION_STATUS_PATH}")"
          cp /tmp/exceptional-validation-preserved.log "${VALIDATION_LOG_PATH}"
          if [ -f /tmp/exceptional-visual-audit-preserved.json ]; then
            cp /tmp/exceptional-visual-audit-preserved.json "${VISUAL_AUDIT_PATH}"
          fi
          jq -n \
            --arg operation_id 'EXC-2026-08-01-PROVAS-PENDENTES' \
            --arg candidate_sha "${CANDIDATE_SHA}" \
            --arg outcome "${VALIDATION_OUTCOME}" \
            --argjson exit_code "${VALIDATION_EXIT_CODE:-1}" \
            --arg validated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:"1.0", operation_id:$operation_id, candidate_sha:$candidate_sha, outcome:$outcome, exit_code:$exit_code, validated_at:$validated_at}' \
            > "${VALIDATION_STATUS_PATH}"
          git add "${VALIDATION_STATUS_PATH}" "${VALIDATION_LOG_PATH}"
          if [ -f "${VISUAL_AUDIT_PATH}" ]; then
            git add "${VISUAL_AUDIT_PATH}"
          fi
          git commit -m 'Registrar validação do candidato excepcional'
          git push --force origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"

      - name: Interromper candidato reprovado
        if: steps.validation.outcome != 'success'
        run: |
          echo 'O candidato excepcional foi preservado para auditoria e não será promovido.'
          exit 1

      - name: Limpar artefatos e promover somente o candidato validado
        id: publish_snapshot
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${{ steps.candidate.outputs.candidate_sha }}"
          git clean -fd
          if [ -n "$(git status --porcelain)" ]; then
            echo 'O diretório permaneceu sujo após a limpeza dos artefatos de build.'
            git status --short
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
            npm run check
            git reset --hard HEAD
            git clean -fd
          fi
          git push origin HEAD:main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publicar e fechar a rastreabilidade no Notion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.publish_snapshot.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --ref main -f source_sha="${SOURCE_SHA}" -f close_notion=true

          RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=main&per_page=50" > /tmp/pages-runs.json
            RUN_ID=$(jq -r --arg sha "${SOURCE_SHA}" --arg since "${DISPATCHED_AT}" '
              .workflow_runs[]
              | select(.head_sha == $sha)
              | select(.name == "Validar e publicar GitHub Pages")
              | select(.event == "workflow_dispatch")
              | select(.created_at >= $since)
              | .id
            ' /tmp/pages-runs.json | head -n1)
            if [ -n "${RUN_ID}" ]; then break; fi
            sleep 5
          done

          if [ -z "${RUN_ID}" ]; then
            echo 'A execução de publicação não foi criada dentro da janela de segurança.'
            exit 1
          fi

          gh run watch "${RUN_ID}" --exit-status --interval 10
          echo "✓ Operação excepcional publicada e rastreada no commit ${SOURCE_SHA}."
