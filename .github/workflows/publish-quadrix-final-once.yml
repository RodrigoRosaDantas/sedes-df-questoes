name: Publicar lote Quadrix final — temporário

on:
  push:
    branches: [agent/publish-quadrix-discursive-view-20260805]
    paths: [.github/workflows/publish-quadrix-final-once.yml]

permissions:
  contents: write
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

concurrency:
  group: publish-quadrix-final-20260805
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/publish-quadrix-discursive-view-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Gerar snapshots e insumos exigidos pelo build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-quadrix-objective-additions.mjs
          node scripts/reconcile-quadrix-incremental-snapshot.mjs
          node scripts/export-discursive-display.mjs
          node scripts/create-publication-plan.mjs
          node scripts/export-editorial-platform-sync.mjs
          node scripts/export-pedagogia-editorial-sync.mjs

      - name: Validar escopo final
        run: |
          test "$(jq -r '.schema_version' data/notion/published.json)" = '1.3'
          test "$(jq -r '.scope_mode' data/notion/published.json)" = 'additions'
          test "$(jq '.records | length' data/notion/published.json)" = '100'
          test "$(jq '.publication_scope.annulled_exceptions | length' data/notion/published.json)" = '2'
          test "$(jq '.totals.existing_public' data/notion/published.json)" = '2871'
          test "$(jq '.totals.display_only' data/notion/published.json)" = '2'
          test "$(jq '.totals.pending' data/notion/published.json)" = '75'
          test "$(jq '.totals.all' data/notion/published.json)" = '3048'
          test "$(jq '.total_records' data/notion/publication-plan.json)" = '100'
          test "$(jq '.lots | length' data/notion/publication-plan.json)" = '2'
          test "$(jq '.total' data/notion/discursive-display.json)" = '2'

      - name: Executar validação integral
        run: npm run check

      - name: Testar as discursivas no navegador local
        run: |
          npm install --no-save @playwright/test@1.61.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist >/tmp/quadrix-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test tests/discursive-display.spec.js

      - name: Conferir contrato gerado
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('dist/data/release/release-meta.json', 'utf8'));
          const names = [
            'Analista I — Atendimento e Cobrança — CRA-SP — Quadrix 2025',
            'Assistente Administrativo — CREMAM — Quadrix 2025',
          ];
          let objectives = 0;
          let discursives = 0;
          let annulled = 0;
          for (const name of names) {
            const item = catalog.materials.find(entry => entry.nome === name);
            if (!item) throw new Error(`Material ausente: ${name}`);
            const material = JSON.parse(fs.readFileSync(item.file.replace(/^\.\//, ''), 'utf8'));
            objectives += material.questoes.length;
            discursives += (material.discursivas || []).length;
            annulled += material.questoes.filter(question => question.gabarito === 'Anulada' && question.anulada === true).length;
            if ((material.discursivas || []).some(question => question.somente_visualizacao !== true || question.pontuada !== false || question.gabarito || question.alternativas)) {
              throw new Error(`${name}: contrato de visualização da discursiva inválido.`);
            }
          }
          if (objectives !== 100 || discursives !== 2 || annulled !== 2) throw new Error(`Escopo ${objectives}/${discursives}/${annulled}.`);
          if (Number(meta.banco_mestre) !== 3048 || Number(meta.questions) !== 2971 || Number(meta.discursive_display_items) !== 2 || Number(meta.awaiting_audit) !== 75 || Number(meta.materials) !== 69) {
            throw new Error(`Metadados finais divergentes: ${JSON.stringify(meta)}`);
          }
          NODE

      - name: Versionar pacote e remover mecanismos temporários
        id: publish
        run: |
          mkdir -p data/operations
          rm -f data/operations/qdx-crasp-cremam-preparation-status.json
          jq -n --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "$GITHUB_RUN_ID" --arg snapshot_sha "$(sha256sum data/notion/published.json | awk '{print $1}')" --arg plan_sha "$(sha256sum data/notion/publication-plan.json | awk '{print $1}')" --arg disc_sha "$(sha256sum data/notion/discursive-display.json | awk '{print $1}')" '{schema_version:"1.0",operation:"PUBLISH-QDX-CRASP-CREMAM-20260805",status:"validated_for_deploy",completed_at:$completed_at,workflow_run_id:$run_id,existing_public_preserved:2871,objective_questions_added:100,annulled_objectives:2,discursive_display_items:2,awaiting_audit:75,banco_mestre:3048,total_questions_after_build:2971,total_materials_after_build:69,lots:["QDX-2025-CRASP-ANACOB-001-050-20260805","QDX-2025-CREMAM-ASSADM-001-050-20260805"],hashes:{notion_snapshot_sha256:$snapshot_sha,publication_plan_sha256:$plan_sha,discursive_display_sha256:$disc_sha},validation:{full_check:"success",browser_test:"success",discursive_mode:"display_only"}}' > data/operations/qdx-crasp-cremam-publication-receipt.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/notion/published.json data/notion/publication-plan.json data/notion/discursive-display.json data/release data/operations/qdx-crasp-cremam-publication-receipt.json
          git add -u data/operations/qdx-crasp-cremam-preparation-status.json || true
          git diff --cached --quiet || git commit -m 'Versionar lote Quadrix de 100 questões e 2 discursivas [skip ci]'
          rm -f .github/workflows/prepare-quadrix-crasp-cremam-v*-once.yml
          rm -f .github/workflows/publish-quadrix-final-once.yml
          git add -A .github/workflows
          git diff --cached --quiet || git commit -m 'Remover rotinas temporárias do lote Quadrix [skip ci]'
          CONTENT_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validar site público
        run: |
          URL='https://rodrigorosadantas.github.io/sedes-df-questoes'
          for i in $(seq 1 30); do
            curl -fsS "$URL/data/release/release-meta.json?run=$GITHUB_RUN_ID-$i" -o /tmp/release-meta.json || true
            if jq -e '.questions == 2971 and .banco_mestre == 3048 and .discursive_display_items == 2 and .materials == 69' /tmp/release-meta.json >/dev/null 2>&1; then break; fi
            sleep 10
          done
          jq -e '.questions == 2971 and .banco_mestre == 3048 and .discursive_display_items == 2 and .awaiting_audit == 75 and .materials == 69' /tmp/release-meta.json
          curl -fsS "$URL/?run=$GITHUB_RUN_ID" | grep -q 'discursive-display-v2-13.js'

      - name: Fechar rastreabilidade no Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ steps.publish.outputs.sha }}
        run: |
          node scripts/mark-quadrix-objectives-published.mjs
          node scripts/mark-discursive-display-published.mjs

      - name: Registrar deploy confirmado na main
        env:
          CONTENT_SHA: ${{ steps.publish.outputs.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          jq -n --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "$GITHUB_RUN_ID" --arg source_sha "$CONTENT_SHA" --arg public_url "$PAGE_URL" '{schema_version:"1.0",operation:"PUBLISH-QDX-CRASP-CREMAM-20260805",status:"success",confirmed_at:$confirmed_at,workflow_run_id:$run_id,source_sha:$source_sha,public_url:$public_url,questions:2971,discursive_display_items:2,banco_mestre:3048,awaiting_audit:75,materials:69,notion_traceability:"success",public_validation:"success"}' > data/operations/qdx-crasp-cremam-deployment-receipt.json
          git add data/operations/qdx-crasp-cremam-deployment-receipt.json
          git commit -m 'Registrar publicação pública do lote Quadrix [skip ci]'
          git push origin HEAD:main
