name: Auditar integração do Banco Mestre

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'integration/notion-bank-master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/notion-bank-master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar leitura integral do Banco Mestre
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/audit-notion-source.mjs
      - name: Validar release pública atual
        run: npm run check
      - name: Guardar relatório da auditoria
        uses: actions/upload-artifact@v4
        with:
          name: notion-bank-master-audit
          path: /tmp/notion-audit.json
          retention-days: 7
