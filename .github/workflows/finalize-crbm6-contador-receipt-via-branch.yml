name: Finalizar comprovante CRBM-6 Contador via branch
# Segundo push intencional: o workflow já está registrado na main.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-crbm6-contador-receipt-via-branch.yml

permissions:
  contents: write

concurrency:
  group: finalize-crbm6-contador-receipt-via-branch
  cancel-in-progress: false

env:
  CONTADOR_OPERATION: CRBM6-2026-CONTADOR-402-001-070-20260803
  CONTADOR_SNAPSHOT_PATH: data/notion/publication-additions/crbm6-contador-70.json
  CONTADOR_PLAN_PATH: data/notion/publication-additions/crbm6-contador-70-plan.json
  DEPLOYMENT_RECEIPT_PATH: data/operations/latest-deployment.json
  TRACEABILITY_RECEIPT_PATH: data/operations/crbm6-contador-70-traceability-receipt.json
  RELEASE_COMMIT: ea20017dd53389bddb357bb89beff717106d788d
  RELEASE_CODE: release-2.13.0:ea20017dd53389bddb357bb89beff717106d788d
  PUBLICATION_DATE: '2026-08-04'

jobs:
  verify-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar a main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verificar deploy e os 70 recibos vivos
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';

          const token = process.env.NOTION_TOKEN;
          const releaseSha = process.env.RELEASE_COMMIT;
          const releaseCode = process.env.RELEASE_CODE;
          const publicationDate = process.env.PUBLICATION_DATE;
          const operation = process.env.CONTADOR_OPERATION;
          const snapshotPath = process.env.CONTADOR_SNAPSHOT_PATH;
          const planPath = process.env.CONTADOR_PLAN_PATH;
          const deploymentPath = process.env.DEPLOYMENT_RECEIPT_PATH;
          const outputPath = process.env.TRACEABILITY_RECEIPT_PATH;
          const api = 'https://api.notion.com/v1';
          const version = '2026-03-11';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const clean = value => String(value ?? '').trim();

          if (!token) throw new Error('NOTION_TOKEN não está disponível.');

          const deployment = JSON.parse(fs.readFileSync(deploymentPath, 'utf8'));
          const verification = deployment.verification || {};
          if (
            Number(deployment.questions) !== 2871
            || Number(deployment.added_questions) !== 70
            || deployment.lot !== operation
            || verification.static_files !== 'success'
            || verification.public_browser !== 'success'
            || verification.public_metadata_refetched !== 'success'
          ) throw new Error('O recibo público versionado não corresponde ao lote autorizado.');
          try {
            execFileSync('git', ['merge-base', '--is-ancestor', releaseSha, deployment.source_sha], {stdio: 'ignore'});
          } catch {
            throw new Error(`O deploy público ${deployment.source_sha} não descende da release ${releaseSha}.`);
          }

          const snapshot = JSON.parse(fs.readFileSync(snapshotPath, 'utf8'));
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const lot = plan.lots?.[0];
          const expectedCodes = lot?.codes || [];
          const byCode = new Map((snapshot.records || []).map(record => [clean(record.code), record]));
          if (plan.total_records !== 70 || expectedCodes.length !== 70 || lot?.lot !== operation) {
            throw new Error('Plano imutável deixou de representar exatamente os 70 itens autorizados.');
          }
          if (byCode.size < 70) throw new Error('Snapshot imutável não contém os 70 registros autorizados.');

          async function request(endpoint, attempt = 1) {
            const response = await fetch(`${api}${endpoint}`, {
              headers: {
                Authorization: `Bearer ${token}`,
                'Notion-Version': version,
                'Content-Type': 'application/json',
              },
            });
            if (response.ok) return response.json();
            const body = await response.text();
            if ((response.status === 429 || response.status >= 500) && attempt < 9) {
              await sleep(Math.max(Number(response.headers.get('retry-after') || 0) * 1000, 500 * 2 ** (attempt - 1)));
              return request(endpoint, attempt + 1);
            }
            throw new Error(`Notion API ${response.status}: ${body.slice(0, 600)}`);
          }

          function plain(property) {
            if (!property) return '';
            if (property.type === 'title') return (property.title || []).map(item => item.plain_text || '').join('');
            if (property.type === 'rich_text') return (property.rich_text || []).map(item => item.plain_text || '').join('');
            return '';
          }

          let verified = 0;
          for (const code of expectedCodes) {
            const record = byCode.get(code);
            if (!record?.notion_id) throw new Error(`${code}: página ausente no snapshot.`);
            const current = await request(`/pages/${record.notion_id}`);
            const properties = current.properties || {};
            const currentCode = clean(plain(properties['Código']));
            const currentLot = clean(plain(properties['Lote de publicação']));
            const currentGithub = clean(plain(properties['Código GitHub']));
            const currentDate = clean(properties['Data da publicação']?.date?.start);
            if (currentCode !== code) throw new Error(`${code}: Código vivo divergiu.`);
            if (currentLot !== operation) throw new Error(`${code}: lote vivo divergiu: ${currentLot || 'vazio'}.`);
            if (currentGithub !== releaseCode) throw new Error(`${code}: Código GitHub divergiu: ${currentGithub || 'vazio'}.`);
            if (currentDate !== publicationDate) throw new Error(`${code}: data divergiu: ${currentDate || 'vazia'}.`);
            verified += 1;
            await sleep(350);
          }

          const receipt = {
            schema_version: '1.2',
            verified_at: new Date().toISOString(),
            operation_id: operation,
            release_commit: releaseSha,
            release_code: releaseCode,
            publication_date: publicationDate,
            public_source_commit: deployment.source_sha,
            public_questions: 2871,
            material_questions: 120,
            expected_count: 70,
            verified_count: verified,
            codes_sha256: lot.codes_sha256,
            codes: expectedCodes,
            source_snapshot: snapshotPath,
            source_plan: planPath,
            source_deployment_receipt: deploymentPath,
            verification: {
              public_deployment: 'success',
              public_source_descends_from_release: 'success',
              immutable_package: 'success',
              live_identity_and_lot: 'success',
              notion_receipts: 'success',
            },
          };
          fs.mkdirSync(path.dirname(outputPath), {recursive: true});
          fs.writeFileSync(outputPath, `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(`✓ Comprovante produzido após releitura direta: ${verified}/70.`);
          NODE

      - name: Enviar somente o comprovante para branch automática
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/crbm6-contador-traceability-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${BRANCH}"
          test -s "${TRACEABILITY_RECEIPT_PATH}"
          git add "${TRACEABILITY_RECEIPT_PATH}"
          git commit -m 'Registrar rastreabilidade 70/70 de Contador [skip ci]'
          git push origin "HEAD:${BRANCH}"
          echo "✓ Branch automática criada: ${BRANCH}"
