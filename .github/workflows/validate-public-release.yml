name: Validar release pública — somente leitura

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-public-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.61.1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o commit sob revisão
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Preparar Java 21 para Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Auditar a release sem credenciais nem escrita externa
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SOURCE_SHA="$(git rev-parse HEAD)" npm run check
          node scripts/validate-cloud-progress-v1.mjs
          node scripts/validate-audit-hardening-v1.mjs
      - name: Instalar navegador e Firebase Emulator isoladamente
        shell: bash
        run: |
          set -euo pipefail
          npm --cache "${RUNNER_TEMP}/npm-cache" install --no-save --package-lock=false "@playwright/test@${PLAYWRIGHT_VERSION}" "firebase@12.16.0" "@firebase/rules-unit-testing" "firebase-tools"
          npx playwright install --with-deps chromium
          java -version
      - name: Executar a suíte pública contra o artefato local
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUBLIC_BASE_URL: http://127.0.0.1:4173/
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >"${RUNNER_TEMP}/sedes-local-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx playwright test --config=playwright.public.config.js --workers=1 --retries=0
      - name: Provar autenticação, dois aparelhos e isolamento por UID no emulador
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory dist >"${RUNNER_TEMP}/sedes-firebase-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
          npx firebase emulators:exec --config firebase.json --project tdas-68014 --only auth,firestore "PUBLIC_BASE_URL=http://127.0.0.1:4174/ npx playwright test --config=playwright.firebase.config.js --workers=1 --retries=0 tests-integration/firebase-two-device-v1.spec.js && node tests-integration/firestore-rules-v1.mjs"
      - name: Sondar regras reais do Firestore em produção e limpar a sonda
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/probe-firestore-production-once'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/probe-firestore-production-once.mjs
