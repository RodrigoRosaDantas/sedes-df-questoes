name: Corrigir contrato final dos 75 registros — temporário

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-remaining-75-release-contract-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Atualizar versão pública e validadores
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          release_key = '3048-3046-71-r3'

          app = Path('assets/app-v4.js')
          text = app.read_text()
          text = re.sub(r'const CATALOG_URL = "\./data/release/catalogo\.json(?:\?release=[^"]+)?";', f'const CATALOG_URL = "./data/release/catalogo.json?release={release_key}";', text, count=1)
          text = re.sub(r'const RELEASE_META_URL = "\./data/release/release-meta\.json(?:\?release=[^"]+)?";', f'const RELEASE_META_URL = "./data/release/release-meta.json?release={release_key}";', text, count=1)
          text = re.sub(r'const STUDY_INDEX_URL = "\./data/release/study-index\.json(?:\?release=[^"]+)?";', f'const STUDY_INDEX_URL = "./data/release/study-index.json?release={release_key}";', text, count=1)
          app.write_text(text)

          index = Path('index.html')
          text = re.sub(r'\./assets/app-v4\.js\?v=\d+', './assets/app-v4.js?v=11', index.read_text(), count=1)
          index.write_text(text)

          worker = Path('service-worker.js')
          text = worker.read_text()
          text = re.sub(r'const CACHE_VERSION = "sedes-questoes-v2-13-0(?:-r\d+)?";', 'const CACHE_VERSION = "sedes-questoes-v2-13-0-r3";', text, count=1)
          text = re.sub(r'\./assets/app-v4\.js\?v=\d+', './assets/app-v4.js?v=11', text)
          text = re.sub(r'release=3048-2971-69-r2', f'release={release_key}', text)
          worker.write_text(text)

          build = Path('scripts/build-public.mjs')
          text = build.read_text()
          text = text.replace('const expectedCacheVersion = `sedes-questoes-v${versionToken}`;', 'const expectedCacheVersion = `sedes-questoes-v${versionToken}-r3`;')
          text = text.replace('"app-v4.js?v=9"', '"app-v4.js?v=11"')
          text = text.replace("'const STUDY_INDEX_URL = \"./data/release/study-index.json\";'", f"'const STUDY_INDEX_URL = \"./data/release/study-index.json?release={release_key}\";'")
          build.write_text(text)
          PY

          node --check assets/app-v4.js
          node --check service-worker.js
          node --check scripts/build-public.mjs
          grep -q 'catalogo.json?release=3048-3046-71-r3' assets/app-v4.js
          grep -q 'study-index.json?release=3048-3046-71-r3' assets/app-v4.js
          grep -q 'app-v4.js?v=11' index.html
          grep -q 'sedes-questoes-v2-13-0-r3' service-worker.js
          grep -q 'app-v4.js?v=11' scripts/build-public.mjs
          grep -q 'study-index.json?release=3048-3046-71-r3' scripts/build-public.mjs

      - name: Versionar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app-v4.js index.html service-worker.js scripts/build-public.mjs
          git commit -m 'Atualizar contrato público para 3.046 questões e 71 materiais'
          git pull --rebase origin main
          git push origin HEAD:main
