name: Sincronizar Banco Mestre do Notion — SUSPENSO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suspended:
    runs-on: ubuntu-latest
    steps:
      - name: Informar suspensão
        run: |
          echo "Workflow suspenso por solicitação do responsável pelo projeto."
          echo "Nenhuma sincronização, publicação ou atualização do Notion será executada."
