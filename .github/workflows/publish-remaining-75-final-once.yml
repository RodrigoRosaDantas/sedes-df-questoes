name: Publicar 75 registros auditados — final temporário

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-remaining-75-final-once.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-remaining-75-final-20260805
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Confirmar base pública anterior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const ids = Object.keys(catalog.question_index || {}).sort();
          if (ids.length !== 2971 || (catalog.materials || []).length !== 69 || Number(catalog.summary?.discursivas_consulta) !== 2) {
            throw new Error(`Base anterior divergente: ${ids.length} questões, ${(catalog.materials || []).length} materiais.`);
          }
          fs.writeFileSync('/tmp/base-question-ids.json', JSON.stringify(ids));
          NODE

      - name: Reconstituir snapshot auditado dos 75 registros
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/audit-export-remaining-75.mjs
          node scripts/create-publication-plan.mjs
          test "$(jq '.records | length' data/notion/published.json)" = '75'
          test "$(jq '.total_records' data/notion/publication-plan.json)" = '75'
          test "$(jq '.publication_scope.lots | length' data/notion/published.json)" = '2'
          test "$(jq '.totals.published' data/notion/published.json)" = '3046'
          test "$(jq '.totals.pending' data/notion/published.json)" = '0'

      - name: Gerar pacote público final
        run: |
          node scripts/apply-notion-snapshot.mjs
          node scripts/apply-discursive-display.mjs
          node scripts/build-study-index.mjs
          node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          rm -rf data/release
          cp -a dist/data/release data/release

      - name: Validar contrato, preservação e hashes
        run: |
          node scripts/validate-discursive-display.mjs
          node scripts/validate-runtime-catalog.mjs
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/release/manifest.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('data/release/release-meta.json', 'utf8'));
          const baseIds = JSON.parse(fs.readFileSync('/tmp/base-question-ids.json', 'utf8'));
          const finalIds = new Set(Object.keys(catalog.question_index || {}));
          const missing = baseIds.filter(id => !finalIds.has(id));
          if (missing.length) throw new Error(`IDs públicos perdidos: ${missing.slice(0, 5).join(', ')}.`);
          if (finalIds.size !== 3046) throw new Error(`Questões finais: ${finalIds.size}; esperado 3046.`);
          if ((catalog.materials || []).length !== 71) throw new Error(`Materiais finais: ${(catalog.materials || []).length}; esperado 71.`);
          if (Number(catalog.summary?.discursivas_consulta) !== 2 || Number(catalog.summary?.aguardando_auditoria) !== 0) throw new Error('Decomposição final divergente.');
          if (meta.questions !== 3046 || meta.banco_mestre !== 3048 || meta.awaiting_audit !== 0 || meta.materials !== 71 || meta.discursive_display_items !== 2 || meta.proofs !== 36 || meta.simulations !== 35) {
            throw new Error(`Release-meta divergente: ${JSON.stringify(meta)}`);
          }
          const expected = new Map([
            ['Professor de Educação Básica — Contabilidade — SEEDF/DF — Quadrix 2025 — Tipo A', 50],
            ['Professor de Educação Básica — Eletrônica — SEEDF/DF — Quadrix 2025 — Tipo A', 25],
          ]);
          for (const metadata of catalog.materials || []) {
            const material = JSON.parse(fs.readFileSync(metadata.file.replace(/^\.\//, ''), 'utf8'));
            if (expected.has(material.nome) && Number(material.quantidade_questoes) !== expected.get(material.nome)) {
              throw new Error(`${material.nome}: ${material.quantidade_questoes}; esperado ${expected.get(material.nome)}.`);
            }
          }
          for (const [name] of expected) if (!(catalog.materials || []).some(item => item.nome === name)) throw new Error(`Material ausente: ${name}.`);
          const catalogBytes = fs.readFileSync('data/release/catalogo.json');
          if (manifest.catalog_sha256 !== sha(catalogBytes)) throw new Error('Hash do catálogo divergente.');
          for (const entry of manifest.materials || []) {
            const bytes = fs.readFileSync(entry.file.replace(/^\.\//, ''));
            if (entry.sha256 !== sha(bytes) || entry.bytes !== bytes.length) throw new Error(`Manifesto divergente: ${entry.id}.`);
          }
          NODE
          grep -q 'app-v4.js?v=11' dist/index.html
          grep -q 'sedes-questoes-v2-13-0-r3' dist/service-worker.js
          grep -q 'catalogo.json?release=3048-3046-71-r3' dist/assets/app-v4.js

      - name: Versionar pacote imutável
        id: version
        run: |
          mkdir -p data/operations
          jq -n \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg snapshot_sha "$(sha256sum data/notion/published.json | awk '{print $1}')" \
            --arg plan_sha "$(sha256sum data/notion/publication-plan.json | awk '{print $1}')" \
            --arg catalog_sha "$(sha256sum data/release/catalogo.json | awk '{print $1}')" \
            '{schema_version:"1.0",operation:"PUBLISH-SEEDF-CONTABILIDADE-ELETRONICA-75-20260805",status:"validated_for_deploy",completed_at:$completed_at,workflow_run_id:$run_id,base_questions_preserved:2971,objective_questions_added:75,questions:3046,discursive_display_items:2,banco_mestre:3048,awaiting_audit:0,materials:71,proofs:36,simulations:35,lots:["SEEDF-2025-CONTABILIDADE-A-071-120-20260805","SEEDF-2025-ELETRONICA-A-071-095-20260805"],audit:{reviewed:75,format:"Certo / Errado",all_required_fields_complete:true},hashes:{snapshot_sha256:$snapshot_sha,publication_plan_sha256:$plan_sha,catalog_sha256:$catalog_sha},validation:{base_ids_preserved:true,sequences_complete:true,manifest_hashes:true}}' \
            > data/operations/remaining-75-publication-receipt.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/notion/published.json data/notion/publication-plan.json data/release data/operations/remaining-75-publication-receipt.json
          git commit -m 'Versionar lote final de 75 registros auditados [skip ci]'
          git pull --rebase origin main
          CONTENT_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar estado público
        run: |
          URL='https://rodrigorosadantas.github.io/sedes-df-questoes'
          for i in $(seq 1 30); do
            curl -fsS "$URL/data/release/release-meta.json?run=$GITHUB_RUN_ID-$i" -o /tmp/release-meta.json || true
            if jq -e '.questions == 3046 and .banco_mestre == 3048 and .discursive_display_items == 2 and .awaiting_audit == 0 and .materials == 71' /tmp/release-meta.json >/dev/null 2>&1; then break; fi
            sleep 10
          done
          jq -e '.questions == 3046 and .banco_mestre == 3048 and .discursive_display_items == 2 and .awaiting_audit == 0 and .materials == 71' /tmp/release-meta.json
          curl -fsS "$URL/data/release/catalogo.json?run=$GITHUB_RUN_ID" -o /tmp/catalogo.json
          test "$(jq '.question_index | length' /tmp/catalogo.json)" = '3046'
          test "$(jq '.materials | length' /tmp/catalogo.json)" = '71'
          test "$(jq '.summary.aguardando_auditoria' /tmp/catalogo.json)" = '0'
          jq -e '[.materials[] | select(.nome == "Professor de Educação Básica — Contabilidade — SEEDF/DF — Quadrix 2025 — Tipo A" and .quantidade_questoes == 50)] | length == 1' /tmp/catalogo.json
          jq -e '[.materials[] | select(.nome == "Professor de Educação Básica — Eletrônica — SEEDF/DF — Quadrix 2025 — Tipo A" and .quantidade_questoes == 25)] | length == 1' /tmp/catalogo.json

      - name: Fechar rastreabilidade no Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ steps.version.outputs.sha }}
        run: node scripts/mark-remaining-75-published.mjs

      - name: Registrar recibo final
        env:
          CONTENT_SHA: ${{ steps.version.outputs.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          jq -n \
            --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$CONTENT_SHA" \
            --arg public_url "$PAGE_URL" \
            '{schema_version:"1.0",operation:"PUBLISH-SEEDF-CONTABILIDADE-ELETRONICA-75-20260805",status:"success",confirmed_at:$confirmed_at,workflow_run_id:$run_id,source_sha:$source_sha,public_url:$public_url,base_questions_preserved:2971,objective_questions_added:75,questions:3046,discursive_display_items:2,banco_mestre:3048,awaiting_audit:0,materials:71,proofs:36,simulations:35,notion_traceability:"success",public_validation:"success"}' \
            > data/operations/remaining-75-deployment-receipt.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/remaining-75-deployment-receipt.json
          git commit -m 'Registrar publicação final dos 75 registros [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
