name: Reconciliar contrato do painel — branch isolada

on:
  push:
    branches: [fix/reconcile-dashboard-contract-20260805]
    paths:
      - data/operations/run-reconcile-dashboard-contract.json

permissions:
  contents: write

concurrency:
  group: reconcile-dashboard-contract-20260805
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reconcile-dashboard-contract-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Aplicar correções internas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # 1. Unificar catalogo.json, manifest.json e release-meta.json no build.
          build_path = root / 'scripts/build-public.mjs'
          build = build_path.read_text(encoding='utf-8')
          needle = 'const awaitingAudit = Math.max(0, activeBancoMestre - questionCount);\n\nconst sourceHashes'
          if needle not in build:
              raise SystemExit('Ponto de reconciliação não encontrado em build-public.mjs')
          replacement = '''const awaitingAudit = Math.max(0, activeBancoMestre - questionCount);

const reconciledSummary = {
  ...(catalog.summary || {}),
  banco_mestre: activeBancoMestre,
  materiais: materialCount,
  questoes: questionCount,
  aguardando_auditoria: awaitingAudit,
  provas: proofCount,
  simulados: simulationCount,
};
catalog.summary = reconciledSummary;
const catalogPath = path.join(dist, "data/release/catalogo.json");
const catalogText = `${JSON.stringify(catalog, null, 2)}\\n`;
fs.writeFileSync(catalogPath, catalogText);

const manifestPath = path.join(dist, "data/release/manifest.json");
if (fs.existsSync(manifestPath)) {
  const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
  manifest.summary = {...(manifest.summary || {}), ...reconciledSummary};
  manifest.catalog_sha256 = sha256(catalogText);
  fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\\n`);
}

const sourceHashes'''
          build_path.write_text(build.replace(needle, replacement, 1), encoding='utf-8')

          # 2. Validador explícito do contrato público.
          validator = r'''import fs from "node:fs";
import crypto from "node:crypto";
import path from "node:path";
import {fileURLToPath} from "node:url";

const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
const dist = path.join(root, "dist", "data", "release");
const read = name => JSON.parse(fs.readFileSync(path.join(dist, name), "utf8"));
const catalogText = fs.readFileSync(path.join(dist, "catalogo.json"), "utf8");
const catalog = JSON.parse(catalogText);
const manifest = read("manifest.json");
const meta = read("release-meta.json");
const expected = {
  banco_mestre: Number(meta.banco_mestre),
  materiais: Number(meta.materials),
  questoes: Number(meta.questions),
  aguardando_auditoria: Number(meta.awaiting_audit),
};
for (const [key, value] of Object.entries(expected)) {
  if (!Number.isInteger(value) || value < 0) throw new Error(`release-meta inválido em ${key}: ${value}`);
  if (Number(catalog.summary?.[key]) !== value) throw new Error(`catalogo.json diverge em ${key}`);
  if (Number(manifest.summary?.[key]) !== value) throw new Error(`manifest.json diverge em ${key}`);
}
const catalogHash = crypto.createHash("sha256").update(catalogText).digest("hex");
if (manifest.catalog_sha256 !== catalogHash) throw new Error("manifest.json contém hash obsoleto do catálogo");
if (expected.banco_mestre - expected.questoes !== expected.aguardando_auditoria) {
  throw new Error("A decomposição Banco Mestre = publicadas + auditoria não fecha");
}
console.log(`✓ Contrato público unificado: ${expected.banco_mestre} / ${expected.questoes} / ${expected.aguardando_auditoria} / ${expected.materiais}.`);
'''
          (root / 'scripts/validate-public-metadata-consistency.mjs').write_text(validator, encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          validator_cmd = 'node scripts/validate-public-metadata-consistency.mjs'
          if validator_cmd not in package['scripts']['test']:
              package['scripts']['test'] += f' && {validator_cmd}'
          syntax_cmd = 'node --check scripts/validate-public-metadata-consistency.mjs'
          if syntax_cmd not in package['scripts']['check']:
              package['scripts']['check'] = package['scripts']['check'].replace(' && npm test', f' && {syntax_cmd} && npm test', 1)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3. Validadores passam a reconhecer legitimamente o modo manual/suspenso.
          vb_path = root / 'scripts/validate-build-v2-11.mjs'
          vb = vb_path.read_text(encoding='utf-8')
          anchor = 'const packageData = JSON.parse(read("package.json"));'
          insertion = anchor + '\nconst suspensionPath = "data/operations/site-automations-suspended.json";\nconst manualOnly = exists(suspensionPath) && JSON.parse(read(suspensionPath)).mode === "manual_only";'
          if 'const manualOnly = exists(suspensionPath)' not in vb:
              if anchor not in vb: raise SystemExit('Âncora do validate-build não encontrada')
              vb = vb.replace(anchor, insertion, 1)
          start_marker = 'const pagesWorkflow = read(".github/workflows/pages.yml");'
          end_marker = 'if (dispatchCount !== 1) fail(`Workflow do Notion deve criar uma única publicação explícita; encontrado: ${dispatchCount}.`);'
          if 'Workflow suspenso contém gatilho automático' not in vb:
              start = vb.find(start_marker)
              end0 = vb.find(end_marker, start)
              if start < 0 or end0 < 0: raise SystemExit('Bloco de workflows do validate-build não encontrado')
              end = end0 + len(end_marker)
              original = vb[start:end]
              manual = '''if (manualOnly) {
  for (const workflowPath of [".github/workflows/pages.yml", ".github/workflows/notion-sync.yml"]) {
    const workflow = read(workflowPath);
    if (!workflow.includes("workflow_dispatch:")) fail(`Workflow suspenso sem acionamento manual: ${workflowPath}`);
    if (/^  (push|pull_request|schedule):/m.test(workflow)) fail(`Workflow suspenso contém gatilho automático: ${workflowPath}`);
  }
} else {
''' + original + '\n}'
              vb = vb[:start] + manual + vb[end:]
          vb_path.write_text(vb, encoding='utf-8')

          vw_path = root / 'scripts/validate-workflows.mjs'
          vw = vw_path.read_text(encoding='utf-8')
          anchor2 = 'const workflowDirectory = path.join(root, ".github", "workflows");'
          insertion2 = 'const suspensionPath = path.join(root, "data", "operations", "site-automations-suspended.json");\nconst manualOnly = fs.existsSync(suspensionPath) && JSON.parse(fs.readFileSync(suspensionPath, "utf8")).mode === "manual_only";\n\n' + anchor2
          if 'const manualOnly = fs.existsSync(suspensionPath)' not in vw:
              if anchor2 not in vw: raise SystemExit('Âncora do validate-workflows não encontrada')
              vw = vw.replace(anchor2, insertion2, 1)
          start_marker2 = 'const pages = read(".github/workflows/pages.yml");'
          suffix_marker = 'const notionExporter = read("scripts/export-notion-snapshot.mjs");'
          if 'Modo suspenso exige workflow_dispatch' not in vw:
              start = vw.find(start_marker2)
              suffix = vw.find(suffix_marker, start)
              if start < 0 or suffix < 0: raise SystemExit('Bloco de workflows do validate-workflows não encontrado')
              original = vw[start:suffix]
              manual = '''if (manualOnly) {
  for (const file of workflowFiles) {
    const workflow = read(path.join(".github", "workflows", file));
    const match = workflow.match(/^on\\s*:\\s*\\n((?:^[ \\t].*\\n|^\\s*$)*)/m);
    const block = match?.[1] || "";
    if (!block.includes("workflow_dispatch:")) fail(`Modo suspenso exige workflow_dispatch: ${file}`);
    if (/^  (push|pull_request|schedule):/m.test(block)) fail(`Modo suspenso contém gatilho automático: ${file}`);
  }
} else {
''' + original.rstrip() + '\n}\n\n'
              vw = vw[:start] + manual + vw[suffix:]
          vw_path.write_text(vw, encoding='utf-8')

          # 4. Recibos passam a representar o resultado real do workflow.
          receipt_path = root / 'data/operations/manual-dashboard-card-deploy-receipt.json'
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt['schema_version'] = '1.1'
          receipt['status'] = 'deployment_success_closure_manual'
          receipt['workflow_conclusion'] = 'failure'
          receipt['closure_status'] = 'completed_manually_after_failure'
          receipt['technical_note'] = 'O deploy e a auditoria pública passaram; a execução falhou apenas na tentativa do token interno de alterar workflows. O fechamento foi reconciliado posteriormente pela conexão GitHub autorizada.'
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          latest_path = root / 'data/operations/latest-deployment.json'
          latest = json.loads(latest_path.read_text(encoding='utf-8'))
          latest['workflow_run_id'] = 31002745526
          latest['workflow_conclusion'] = 'failure'
          latest['deployment_status'] = 'success'
          latest['closure_status'] = 'completed_manually_after_failure'
          latest['metadata_contract'] = 'pending_redeploy'
          latest_path.write_text(json.dumps(latest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          suspension_path = root / 'data/operations/site-automations-suspended.json'
          suspension = json.loads(suspension_path.read_text(encoding='utf-8'))
          suspension['workflow_functionality'] = 'disabled_stubs'
          suspension['manual_execution_note'] = 'Os stubs apenas informam a suspensão; não executam a lógica original. A restauração funcional exige recuperar os workflows pelo histórico do Git e autorização expressa.'
          suspension_path.write_text(json.dumps(suspension, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for relative in [
              'data/operations/manual-dashboard-card-main-run-status.json',
              'data/operations/finalizer-run-status.json',
              'data/editorial/apply-dashboard-card-source-direct-trigger.json',
              'data/editorial/inspect-dashboard-card-fix-trigger-20260805.json',
              'data/editorial/inspect-dashboard-card-fix-trigger.json',
          ]:
              path = root / relative
              if path.exists(): path.unlink()

          prep = {
              'schema_version': '1.0',
              'operation': 'RECONCILE-DASHBOARD-PUBLIC-CONTRACT',
              'status': 'prepared_for_validation',
              'scope': ['catalogo.json', 'manifest.json', 'release-meta.json', 'validators', 'receipts'],
              'expected': {'banco_mestre': 2946, 'questions': 2871, 'awaiting_audit': 75, 'materials': 67},
              'site_changed': False,
              'notion_changed': False,
          }
          (root / 'data/operations/dashboard-contract-reconciliation.json').write_text(json.dumps(prep, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Executar validação integral da branch
        run: npm run check

      - name: Registrar validação e versionar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/operations/dashboard-contract-reconciliation.json')
          d=json.loads(p.read_text())
          d['status']='validated_pending_merge_and_deploy'
          d['validation']='npm run check: success'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          PY
          git config user.name 'sedes-contract-fix[bot]'
          git config user.email 'sedes-contract-fix[bot]@users.noreply.github.com'
          git add scripts package.json data/operations data/editorial
          git commit -m 'Reconciliar contrato público e validadores suspensos'
          git push origin HEAD:fix/reconcile-dashboard-contract-20260805
