name: Capturar recurso visual CRTR-12 questão 35

on:
  push:
    branches:
      - fix/recurso-visual-crtr12-q35
    paths:
      - .github/workflows/capture-crtr12-q35.yml
      - data/operations/crtr12-q35-visual-source.md

permissions:
  contents: write

concurrency:
  group: capture-crtr12-q35
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/recurso-visual-crtr12-q35

      - name: Baixar imagem vinculada à questão pública
        run: |
          set -euo pipefail
          mkdir -p assets/question-images data/operations
          curl --fail --location --retry 5 --retry-all-errors \
            'https://qcon-assets-production.s3.amazonaws.com/images/provas/149919/q35.jpg' \
            --output assets/question-images/crtr12-2026-q35-original.jpg
          file assets/question-images/crtr12-2026-q35-original.jpg
          sha256sum assets/question-images/crtr12-2026-q35-original.jpg

      - name: Ler o rótulo gráfico para auditoria
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr imagemagick
          identify assets/question-images/crtr12-2026-q35-original.jpg > data/operations/crtr12-q35-image-identify.txt
          tesseract assets/question-images/crtr12-2026-q35-original.jpg stdout --psm 7 -l eng 2>/dev/null \
            | tee data/operations/crtr12-q35-ocr.txt
          sha256sum assets/question-images/crtr12-2026-q35-original.jpg \
            > data/operations/crtr12-q35-image-sha256.txt

      - name: Versionar evidência visual
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-visual-recovery[bot]'
          git config user.email 'sedes-df-visual-recovery[bot]@users.noreply.github.com'
          git add assets/question-images/crtr12-2026-q35-original.jpg data/operations/crtr12-q35-*.txt
          if git diff --cached --quiet; then
            echo 'Imagem já capturada.'
          else
            git commit -m 'Restaurar imagem original da questão CRTR-12 35'
            git push origin HEAD:fix/recurso-visual-crtr12-q35
          fi
