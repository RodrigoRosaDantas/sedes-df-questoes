name: Validar lote Quadrix final — temporário

on:
  push:
    branches: [agent/publish-quadrix-discursive-view-20260805]
    paths: [.github/workflows/validate-quadrix-final-once.yml]

permissions:
  contents: write

concurrency:
  group: validate-quadrix-final-20260805
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/publish-quadrix-discursive-view-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Registrar início
        run: |
          mkdir -p data/operations
          jq -n --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "$GITHUB_RUN_ID" '{operation:"VALIDATE-QDX-CRASP-CREMAM-20260805",status:"running",started_at:$started_at,workflow_run_id:$run_id}' > data/operations/qdx-crasp-cremam-validation-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/qdx-crasp-cremam-validation-status.json
          git commit -m 'Registrar início da validação Quadrix [skip ci]'
          git push origin HEAD:agent/publish-quadrix-discursive-view-20260805

      - name: Gerar snapshots e insumos do build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-quadrix-objective-additions.mjs
          node scripts/reconcile-quadrix-incremental-snapshot.mjs
          node scripts/export-discursive-display.mjs
          node scripts/create-publication-plan.mjs
          node scripts/export-editorial-platform-sync.mjs
          node scripts/export-pedagogia-editorial-sync.mjs

      - name: Confirmar escopo final
        run: |
          test "$(jq -r '.schema_version' data/notion/published.json)" = '1.3'
          test "$(jq '.records | length' data/notion/published.json)" = '100'
          test "$(jq '.publication_scope.annulled_exceptions | length' data/notion/published.json)" = '2'
          test "$(jq '.totals.existing_public' data/notion/published.json)" = '2871'
          test "$(jq '.totals.display_only' data/notion/published.json)" = '2'
          test "$(jq '.totals.pending' data/notion/published.json)" = '75'
          test "$(jq '.totals.all' data/notion/published.json)" = '3048'
          test "$(jq '.total_records' data/notion/publication-plan.json)" = '100'
          test "$(jq '.lots | length' data/notion/publication-plan.json)" = '2'
          test "$(jq '.total' data/notion/discursive-display.json)" = '2'

      - name: Executar validação integral
        run: npm run check

      - name: Testar as discursivas no navegador local
        run: |
          npm install --no-save @playwright/test@1.61.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist >/tmp/quadrix-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test tests/discursive-display.spec.js

      - name: Conferir contrato gerado
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('dist/data/release/release-meta.json', 'utf8'));
          const names = ['Analista I — Atendimento e Cobrança — CRA-SP — Quadrix 2025','Assistente Administrativo — CREMAM — Quadrix 2025'];
          let objectives = 0, discursives = 0, annulled = 0;
          for (const name of names) {
            const item = catalog.materials.find(entry => entry.nome === name);
            if (!item) throw new Error(`Material ausente: ${name}`);
            const material = JSON.parse(fs.readFileSync(item.file.replace(/^\.\//, ''), 'utf8'));
            objectives += material.questoes.length;
            discursives += (material.discursivas || []).length;
            annulled += material.questoes.filter(question => question.gabarito === 'Anulada' && question.anulada === true).length;
            if ((material.discursivas || []).some(question => question.somente_visualizacao !== true || question.pontuada !== false || question.gabarito || question.alternativas)) throw new Error(`${name}: discursiva inválida.`);
          }
          if (objectives !== 100 || discursives !== 2 || annulled !== 2) throw new Error(`Escopo ${objectives}/${discursives}/${annulled}.`);
          if (Number(meta.banco_mestre) !== 3048 || Number(meta.questions) !== 2971 || Number(meta.discursive_display_items) !== 2 || Number(meta.awaiting_audit) !== 75 || Number(meta.materials) !== 69) throw new Error(`Metadados divergentes: ${JSON.stringify(meta)}`);
          NODE

      - name: Versionar pacote validado e limpar rotinas da branch
        run: |
          rm -f data/operations/qdx-crasp-cremam-preparation-status.json
          rm -f data/operations/qdx-crasp-cremam-validation-status.json
          jq -n --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "$GITHUB_RUN_ID" --arg snapshot_sha "$(sha256sum data/notion/published.json | awk '{print $1}')" --arg plan_sha "$(sha256sum data/notion/publication-plan.json | awk '{print $1}')" --arg disc_sha "$(sha256sum data/notion/discursive-display.json | awk '{print $1}')" '{schema_version:"1.0",operation:"VALIDATE-QDX-CRASP-CREMAM-20260805",status:"success",completed_at:$completed_at,workflow_run_id:$run_id,existing_public_preserved:2871,objective_questions_added:100,annulled_objectives:2,discursive_display_items:2,awaiting_audit:75,banco_mestre:3048,total_questions_after_build:2971,total_materials_after_build:69,lots:["QDX-2025-CRASP-ANACOB-001-050-20260805","QDX-2025-CREMAM-ASSADM-001-050-20260805"],hashes:{notion_snapshot_sha256:$snapshot_sha,publication_plan_sha256:$plan_sha,discursive_display_sha256:$disc_sha},validation:{full_check:"success",browser_test:"success",discursive_mode:"display_only"}}' > data/operations/qdx-crasp-cremam-validation-receipt.json
          git add data/notion/published.json data/notion/publication-plan.json data/notion/discursive-display.json data/release data/operations/qdx-crasp-cremam-validation-receipt.json
          git add -u data/operations/qdx-crasp-cremam-preparation-status.json data/operations/qdx-crasp-cremam-validation-status.json || true
          git commit -m 'Versionar lote Quadrix validado [skip ci]'
          rm -f .github/workflows/prepare-quadrix-crasp-cremam-v*-once.yml
          rm -f .github/workflows/publish-quadrix-final-once.yml
          rm -f .github/workflows/publish-quadrix-final-v2-once.yml
          rm -f .github/workflows/validate-quadrix-final-once.yml
          git add -A .github/workflows
          git commit -m 'Remover validações temporárias do lote Quadrix [skip ci]'
          git push origin HEAD:agent/publish-quadrix-discursive-view-20260805

      - name: Registrar falha
        if: failure()
        run: |
          mkdir -p data/operations
          jq -n --arg failed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "$GITHUB_RUN_ID" '{operation:"VALIDATE-QDX-CRASP-CREMAM-20260805",status:"failure",failed_at:$failed_at,workflow_run_id:$run_id}' > data/operations/qdx-crasp-cremam-validation-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/qdx-crasp-cremam-validation-status.json
          git commit -m 'Registrar falha da validação Quadrix [skip ci]' || true
          git push origin HEAD:agent/publish-quadrix-discursive-view-20260805 || true
