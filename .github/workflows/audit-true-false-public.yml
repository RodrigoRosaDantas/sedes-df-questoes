name: Auditar correção pública Certo e Errado

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/audit-true-false-public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: f4024f6af802c501844ce04202eb4dd8cc2bfd14
      PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes
    steps:
      - name: Acionar e acompanhar a publicação corrigida
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main -f source_sha="${SOURCE_SHA}"

          RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=main&per_page=50" > /tmp/runs.json
            RUN_ID=$(jq -r --arg sha "${SOURCE_SHA}" --arg since "${DISPATCHED_AT}" '
              .workflow_runs[]
              | select(.head_sha == $sha)
              | select(.name == "Validar e publicar GitHub Pages")
              | select(.event == "workflow_dispatch")
              | select(.created_at >= $since)
              | .id
            ' /tmp/runs.json | head -n1)
            if [ -n "${RUN_ID}" ]; then break; fi
            sleep 5
          done

          test -n "${RUN_ID}"
          echo "Execução de Pages: ${RUN_ID}."
          gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 10

      - name: Confirmar ativos e proveniência públicos
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl -fsS -H 'cache-control: no-cache, no-store' \
              "${PUBLIC_BASE_URL}/data/release/build-info.json?audit=${GITHUB_RUN_ID}-${attempt}" > /tmp/build-info.json || true
            PUBLIC_SHA=$(jq -r '.source_sha // empty' /tmp/build-info.json 2>/dev/null || true)
            QUESTIONS=$(jq -r '.questions // empty' /tmp/build-info.json 2>/dev/null || true)
            MATERIALS=$(jq -r '.materials // empty' /tmp/build-info.json 2>/dev/null || true)
            if [ "${PUBLIC_SHA}" = "${SOURCE_SHA}" ] && [ "${QUESTIONS}" = '1498' ] && [ "${MATERIALS}" = '47' ]; then
              break
            fi
            if [ "${attempt}" = '60' ]; then
              echo "Produção divergente: sha=${PUBLIC_SHA:-vazio}, questões=${QUESTIONS:-vazio}, materiais=${MATERIALS:-vazio}."
              exit 1
            fi
            sleep 5
          done

          curl -fsS -H 'cache-control: no-cache, no-store' "${PUBLIC_BASE_URL}/?audit=${GITHUB_RUN_ID}" > /tmp/index.html
          curl -fsS -H 'cache-control: no-cache, no-store' "${PUBLIC_BASE_URL}/assets/app-v4.js?v=8&audit=${GITHUB_RUN_ID}" > /tmp/app.js
          curl -fsS -H 'cache-control: no-cache, no-store' "${PUBLIC_BASE_URL}/assets/true-false.css?v=2&audit=${GITHUB_RUN_ID}" > /tmp/true-false.css

          grep -F 'app-v4.js?v=8' /tmp/index.html
          grep -F 'true-false.css?v=2' /tmp/index.html
          grep -F 'letter === text && (letter === "Certo" || letter === "Errado")' /tmp/app.js
          grep -F '.option > span:not(.letter)' /tmp/true-false.css
          echo "✓ Produção corrigida em ${SOURCE_SHA}; teste público C/E aprovado no workflow de Pages."
