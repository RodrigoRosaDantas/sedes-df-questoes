name: Finalizar CREMAM Administrador — release fe1d

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-cremam-fe1d-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: finalize-cremam-fe1d-20260807
  cancel-in-progress: false

env:
  RELEASE_SHA: fe1dba912a1d841697c3befff70e6dd813258be1
  RELEASE_CODE: release-2.13.0:fe1dba912a1d841697c3befff70e6dd813258be1
  LOT: CREMAM-2025-ADMINISTRADOR-400-49-20260807
  SNAPSHOT: data/notion/publication-additions/cremam-administrador-49.json
  PLAN: data/notion/publication-additions/cremam-administrador-49-plan.json
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes/

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || env.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validar fonte cumulativa e pacote imutável
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json','utf8'));
          const snapshotBytes = fs.readFileSync(process.env.SNAPSHOT);
          const snapshot = JSON.parse(snapshotBytes);
          const planBytes = fs.readFileSync(process.env.PLAN);
          const plan = JSON.parse(planBytes);
          const prep = JSON.parse(fs.readFileSync('data/operations/cremam-administrador-49-preparation-receipt.json','utf8'));
          if (Number(catalog.summary?.questoes) !== 3210 || Number(catalog.summary?.materiais) !== 73 || Number(catalog.summary?.banco_mestre) !== 3212 || Number(catalog.summary?.aguardando_auditoria) !== 0 || Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error(`Fonte divergente: ${JSON.stringify(catalog.summary)}`);
          if (snapshot.schema_version !== '1.3' || snapshot.scope_mode !== 'additions' || snapshot.records?.length !== 49) throw new Error('Snapshot CREMAM inválido.');
          if (plan.total_records !== 49 || plan.lots?.length !== 1 || plan.lots[0].lot !== process.env.LOT || plan.lots[0].codes?.length !== 49) throw new Error('Plano CREMAM inválido.');
          if (sha(snapshotBytes) !== prep.snapshot_sha256 || sha(planBytes) !== prep.plan_sha256) throw new Error('Hash do snapshot/plano diverge do recibo de preparação.');
          const nums = snapshot.records.map(r => Number(r.original_number)).sort((a,b)=>a-b);
          const expected = Array.from({length:50},(_,i)=>i+1).filter(n=>n!==3);
          if (JSON.stringify(nums) !== JSON.stringify(expected)) throw new Error(`Escopo de números divergente: ${nums.join(',')}`);
          console.log('✓ Fonte 3210/73 e pacote imutável 49/49 confirmados.');
          NODE

      - name: Reproduzir dist exatamente para a release fe1d
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          GITHUB_SHA="$RELEASE_SHA" node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          node scripts/validate-runtime-catalog.mjs
          node scripts/validate-public-metadata-consistency.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const clean = value => String(value ?? '').trim();
          const build = JSON.parse(fs.readFileSync('dist/data/release/build-info.json','utf8'));
          const catalog = JSON.parse(fs.readFileSync('dist/data/release/catalogo.json','utf8'));
          if (clean(build.source_sha) !== process.env.RELEASE_SHA || Number(build.questions) !== 3210) throw new Error(`Build divergente: ${build.source_sha}/${build.questions}`);
          if (Number(catalog.summary?.questoes) !== 3210 || Number(catalog.summary?.materiais) !== 73 || Number(catalog.summary?.aguardando_auditoria) !== 0) throw new Error('Catálogo final divergente.');
          const meta = (catalog.materials || []).find(m => clean(m.nome) === 'Administrador — CREMAM — Quadrix 2025');
          if (!meta || Number(meta.quantidade_questoes) !== 49) throw new Error('Material CREMAM ausente/incompleto.');
          const material = JSON.parse(fs.readFileSync(`dist/${String(meta.file).replace(/^\.\//,'')}`,'utf8'));
          const qs = material.questoes || [];
          const nums = qs.map(q=>Number(q.numero_original ?? q.numero));
          if (nums.length !== 49 || nums.includes(3)) throw new Error(`Escopo CREMAM público local divergente: ${nums.join(',')}`);
          const q11 = qs.find(q=>Number(q.numero_original ?? q.numero)===11);
          const q47 = qs.find(q=>Number(q.numero_original ?? q.numero)===47);
          if (!q11?.enunciado?.includes('PREÇO (EM REAIS) | FREQUÊNCIA (%)') || clean(q11.gabarito) !== 'D') throw new Error('Questão 11 divergente.');
          if (clean(q47?.gabarito) !== 'C') throw new Error('Questão 47 divergente.');
          console.log('✓ Dist fe1d reproduzido e validado em 3210/73.');
          NODE

      - name: Detectar se fe1d já está público
        id: public_state
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const clean = v => String(v ?? '').trim();
          let ok = false;
          try {
            const stamp = Date.now();
            const [b,c] = await Promise.all([
              fetch(`${process.env.PUBLIC_BASE_URL}data/release/build-info.json?finalize=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`build HTTP ${r.status}`);return r.json();}),
              fetch(`${process.env.PUBLIC_BASE_URL}data/release/catalogo.json?finalize=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`catalog HTTP ${r.status}`);return r.json();}),
            ]);
            const meta=(c.materials||[]).find(m=>clean(m.nome)==='Administrador — CREMAM — Quadrix 2025');
            ok = clean(b.source_sha)===process.env.RELEASE_SHA && Number(b.questions)===3210 && Number(c.summary?.questoes)===3210 && Number(c.summary?.materiais)===73 && Number(c.summary?.aguardando_auditoria)===0 && Number(meta?.quantidade_questoes)===49;
          } catch (error) { console.log(`Estado público ainda não confirmado: ${error.message}`); }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `already_public=${ok?'true':'false'}\n`);
          console.log(ok ? '✓ fe1d já está público; redeploy será dispensado.' : '• fe1d ainda não confirmado; será publicado exatamente o dist validado.');
          NODE

      - name: Configurar GitHub Pages
        if: steps.public_state.outputs.already_public != 'true'
        uses: actions/configure-pages@v6
      - name: Empacotar artefato fe1d validado
        if: steps.public_state.outputs.already_public != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar fe1d
        if: steps.public_state.outputs.already_public != 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirmar estado público 3210/73 e CREMAM 49/49
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const clean = v => String(v ?? '').trim();
          const sleep = ms => new Promise(resolve=>setTimeout(resolve,ms));
          let last='';
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const stamp=`${Date.now()}-${attempt}`;
              const [b,c]=await Promise.all([
                fetch(`${process.env.PUBLIC_BASE_URL}data/release/build-info.json?verify=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`build ${r.status}`);return r.json();}),
                fetch(`${process.env.PUBLIC_BASE_URL}data/release/catalogo.json?verify=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`catalog ${r.status}`);return r.json();}),
              ]);
              if(clean(b.source_sha)!==process.env.RELEASE_SHA || Number(b.questions)!==3210 || Number(c.summary?.questoes)!==3210 || Number(c.summary?.materiais)!==73 || Number(c.summary?.aguardando_auditoria)!==0) throw new Error(`metadados ${b.source_sha}/${b.questions}/${c.summary?.questoes}`);
              const meta=(c.materials||[]).find(m=>clean(m.nome)==='Administrador — CREMAM — Quadrix 2025');
              if(!meta || Number(meta.quantidade_questoes)!==49) throw new Error('material CREMAM ausente');
              const url=new URL(String(meta.file).replace(/^\.\//,''),process.env.PUBLIC_BASE_URL); url.searchParams.set('verify',stamp);
              const m=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`material ${r.status}`);return r.json();});
              const qs=m.questoes||[]; const nums=qs.map(q=>Number(q.numero_original??q.numero));
              if(nums.length!==49 || nums.includes(3)) throw new Error(`escopo ${nums.join(',')}`);
              const q11=qs.find(q=>Number(q.numero_original??q.numero)===11); const q47=qs.find(q=>Number(q.numero_original??q.numero)===47);
              if(!q11?.enunciado?.includes('PREÇO (EM REAIS) | FREQUÊNCIA (%)') || clean(q11.gabarito)!=='D' || clean(q47?.gabarito)!=='C') throw new Error('questões críticas divergentes');
              console.log('✓ GitHub Pages confirmado: fe1d, 3210/73, CREMAM 49/49, q3 ausente.');
              process.exit(0);
            }catch(error){last=error.message;await sleep(10000);}
          }
          throw new Error(`Estado público não confirmou: ${last}`);
          NODE

      - name: Fechar 49/49 no Notion sem reavaliar Pode publicar
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          if(!process.env.NOTION_TOKEN) throw new Error('NOTION_TOKEN ausente.');
          const snapshot=JSON.parse(fs.readFileSync(process.env.SNAPSHOT,'utf8'));
          const clean=v=>String(v??'').trim();
          const API='https://api.notion.com/v1'; const VERSION='2026-03-11';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const publicationDate=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const plain=p=>p?.type==='title'?(p.title||[]).map(x=>x.plain_text||'').join(''):p?.type==='rich_text'?(p.rich_text||[]).map(x=>x.plain_text||'').join(''):'';
          async function request(endpoint,options={},attempt=1){
            const response=await fetch(`${API}${endpoint}`,{...options,headers:{Authorization:`Bearer ${process.env.NOTION_TOKEN}`,'Notion-Version':VERSION,'Content-Type':'application/json',...(options.headers||{})}});
            if(response.ok)return response.status===204?{}:response.json();
            const body=await response.text(); if((response.status===429||response.status>=500)&&attempt<9){await sleep(Math.max(Number(response.headers.get('retry-after')||0)*1000,400*2**(attempt-1)));return request(endpoint,options,attempt+1);} throw new Error(`Notion ${response.status}: ${body.slice(0,600)}`);
          }
          let done=0;
          for(const record of snapshot.records||[]){
            const page=await request(`/pages/${record.notion_id}`); const p=page.properties||{};
            const code=clean(plain(p['Código'])); const lot=clean(plain(p['Lote de publicação'])); const github=clean(plain(p['Código GitHub'])); const date=p['Data da publicação']?.date?.start||''; const released=p['Liberada para exportação']?.checkbox===true;
            if(code!==clean(record.code) || lot!==process.env.LOT || !released) throw new Error(`${record.code}: identidade/lote/liberação divergente.`);
            if(github && github!==process.env.RELEASE_CODE) throw new Error(`${record.code}: Código GitHub conflitante ${github}.`);
            if(date && date!==publicationDate) throw new Error(`${record.code}: data conflitante ${date}.`);
            if(github!==process.env.RELEASE_CODE || date!==publicationDate){
              await request(`/pages/${record.notion_id}`,{method:'PATCH',body:JSON.stringify({properties:{'Código GitHub':{rich_text:[{type:'text',text:{content:process.env.RELEASE_CODE}}]},'Data da publicação':{date:{start:publicationDate}}}})});
            }
            done++; if(done%10===0)console.log(`${done}/49 fechadas.`);
          }
          for(const record of snapshot.records||[]){
            const page=await request(`/pages/${record.notion_id}`); const p=page.properties||{};
            if(clean(plain(p['Código GitHub']))!==process.env.RELEASE_CODE || (p['Data da publicação']?.date?.start||'')!==publicationDate) throw new Error(`${record.code}: fechamento não persistiu.`);
          }
          console.log(`✓ Notion fechado 49/49 em ${publicationDate}; fórmula viva Pode publicar não foi consultada.`);
          NODE

      - name: Persistir recibo e auto-remover finalizador
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operations
          SNAP_SHA=$(sha256sum "$SNAPSHOT" | awk '{print $1}')
          PLAN_SHA=$(sha256sum "$PLAN" | awk '{print $1}')
          jq -n --arg release "$RELEASE_SHA" --arg release_code "$RELEASE_CODE" --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg snapshot "$SNAP_SHA" --arg plan "$PLAN_SHA" --argjson redeployed "${{ steps.public_state.outputs.already_public != 'true' }}" '{schema_version:"1.1",operation_id:"CREMAM-2025-ADMINISTRADOR-400-49-20260807",status:"success",release_sha:$release,release_code:$release_code,public_url:"https://rodrigorosadantas.github.io/sedes-df-questoes/",confirmed_at:$confirmed_at,baseline_questions:3161,published_records:49,public_questions:3210,public_materials:73,master_bank:3212,awaiting_audit:0,discursive_display_items:2,excluded_original_numbers:[3],snapshot_sha256:$snapshot,plan_sha256:$plan,notion_closed:true,public_validation:true,live_publish_formula_rechecked_after_deploy:false,redeployed_by_finalizer:$redeployed,permanent_automations_restored:false}' > data/operations/cremam-administrador-49-deployment-receipt.json
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-cremam-fe1d-once.yml
          git add data/operations/cremam-administrador-49-deployment-receipt.json
          git commit -m 'Registrar publicação confirmada do CREMAM 49/49 [skip ci]'
          git push origin HEAD:main
