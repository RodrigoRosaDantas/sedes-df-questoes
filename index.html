<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08131f">
  <meta name="description" content="Plataforma independente de provas e simulados da SEDES/DF, com contador regressivo para a prova de 6 de setembro de 2026.">
  <title>SEDES/DF Questões</title>
  <link rel="stylesheet" href="./assets/styles.css?v=2">
  <link rel="stylesheet" href="./assets/home-enhancements.css?v=4">
</head>
<body>
  <a class="skip" href="#app">Pular para o conteúdo</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="SEDES/DF Questões — início">
      <span class="brand-mark">SQ</span>
      <span><strong>SEDES/DF Questões</strong><small>Banco editorial independente</small></span>
    </a>
    <div class="top-actions">
      <span class="sync-pill"><i></i><span id="sync-label">Carregando catálogo</span></span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema">◐</button>
    </div>
  </header>

  <main id="app" class="page" tabindex="-1">
    <section class="card loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Preparando a plataforma…</h1>
      <p>Carregando o catálogo validado do Banco Mestre.</p>
    </section>
  </main>

  <template id="error-template">
    <section class="card error-state">
      <p class="eyebrow">Falha de carregamento</p>
      <h1>Não foi possível abrir o catálogo.</h1>
      <p>Atualize a página. Caso o erro persista, consulte o status da publicação no repositório.</p>
      <button class="btn primary" onclick="location.reload()">Tentar novamente</button>
    </section>
  </template>

  <footer class="footer">
    <span>SEDES/DF Questões</span>
    <span>Notion → validação → GitHub Pages</span>
  </footer>
  <script src="./assets/bundle-fetch.js?v=2"></script>
  <script src="./assets/home-enhancements.js?v=4" defer></script>
  <script type="module" src="./assets/app.js?v=2"></script>
</body>
</html>
