name: Ajustar teste da versão 2.12 uma vez

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/notion-sync-ce-v2-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Alinhar teste ao pacote 2.12
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/reports-v2-10.spec.js')
          text = path.read_text()
          old = 'expect(build.version).toBe("2.11.1");'
          new = 'expect(build.version).toBe("2.12.0");'
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('Marcador da versão não localizado')
          PY
      - name: Registrar ajuste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/reports-v2-10.spec.js
          if git diff --cached --quiet; then
            echo 'Teste já alinhado.'
          else
            git commit -m 'Alinha teste do build à versão 2.12'
            git push origin HEAD:${{ github.head_ref }}
          fi
