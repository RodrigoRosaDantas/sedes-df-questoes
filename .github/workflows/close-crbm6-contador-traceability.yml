name: Fechar rastreabilidade CRBM-6 Contador — 70 itens

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-crbm6-contador-traceability.yml

permissions:
  contents: write

concurrency:
  group: close-crbm6-contador-traceability
  cancel-in-progress: false

env:
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes
  BASE_SNAPSHOT_COMMIT: c060ed9a6d4c46c637a5215b3a2738b28a8d405e
  CONTADOR_OPERATION: CRBM6-2026-CONTADOR-402-001-070-20260803
  CONTADOR_SNAPSHOT_PATH: data/notion/publication-additions/crbm6-contador-70.json
  CONTADOR_PLAN_PATH: data/notion/publication-additions/crbm6-contador-70-plan.json
  DEPLOYMENT_RECEIPT_PATH: data/operations/latest-deployment.json
  TRACEABILITY_RECEIPT_PATH: data/operations/crbm6-contador-70-traceability-receipt.json

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar a main vigente
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Resolver o deploy público já confirmado
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.DEPLOYMENT_RECEIPT_PATH;
          const operation = process.env.CONTADOR_OPERATION;
          if (!fs.existsSync(file)) throw new Error('Recibo do deploy público ausente.');
          const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
          const sha = String(receipt.source_sha || '').trim();
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Commit do deploy confirmado é inválido.');
          if (Number(receipt.questions) !== 2871 || Number(receipt.added_questions) !== 70) {
            throw new Error('Recibo público não confirma 2.871 questões e 70 adições.');
          }
          if (String(receipt.lot || '').trim() !== operation) throw new Error('Recibo público pertence a outro lote.');
          const verification = receipt.verification || {};
          if (verification.static_files !== 'success' || verification.public_browser !== 'success' || verification.public_metadata_refetched !== 'success') {
            throw new Error('Recibo público não contém as três verificações aprovadas.');
          }
          process.stdout.write(sha);
          NODE
          )
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "✓ Deploy confirmado selecionado para a rastreabilidade: ${RELEASE_SHA}."

      - name: Revalidar o pacote imutável de 70 questões
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const operation = process.env.CONTADOR_OPERATION;
          const snapshotPath = process.env.CONTADOR_SNAPSHOT_PATH;
          const planPath = process.env.CONTADOR_PLAN_PATH;
          const prefix = 'PROVA-QDX-CRBM6-2026-CONTADOR-402-';
          const expected = Array.from({length: 70}, (_, index) => `${prefix}${String(index + 1).padStart(3, '0')}`);
          const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
          const clean = value => String(value ?? '').trim();
          const fail = message => { throw new Error(message); };

          if (!fs.existsSync(snapshotPath) || !fs.existsSync(planPath)) fail('Pacote imutável de Contador ausente.');
          const snapshotBytes = fs.readFileSync(snapshotPath);
          const snapshot = JSON.parse(snapshotBytes);
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const lot = plan.lots?.[0];

          if (plan.total_records !== 70 || plan.lots?.length !== 1) fail('Plano não contém exatamente 70 registros em um lote.');
          if (lot?.lot !== operation || lot?.expected_count !== 70 || JSON.stringify(lot?.codes) !== JSON.stringify(expected)) {
            fail('Plano imutável diverge da operação autorizada 001–070.');
          }
          if (sha256(snapshotBytes) !== plan.snapshot_sha256) fail('Hash do snapshot imutável diverge do plano.');
          if (sha256(expected.join('\n')) !== lot.codes_sha256) fail('Hash dos códigos 001–070 diverge do plano.');

          const pending = (snapshot.records || []).filter(record => !clean(record.github_id));
          const codes = pending.map(record => clean(record.code)).sort((a, b) => a.localeCompare(b, 'pt-BR'));
          if (pending.length !== 70 || JSON.stringify(codes) !== JSON.stringify(expected)) {
            fail('Snapshot imutável não contém exatamente os 70 códigos autorizados.');
          }
          for (const record of pending) {
            if (record.released_for_export !== true || clean(record.publication_lot) !== operation) {
              fail(`${record.code}: liberação ou lote divergente.`);
            }
          }
          console.log('✓ Pacote imutável reconfirmado: 70 códigos, sequência 001–070 e hashes íntegros.');
          NODE

      - name: Reconfirmar o deploy e a sequência pública 001–120
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.deployment.outputs.release_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.PUBLIC_BASE_URL.replace(/\/+$/, '');
          const expectedSha = process.env.EXPECTED_SHA;
          const operation = process.env.CONTADOR_OPERATION;
          const prefix = 'PROVA-QDX-CRBM6-2026-CONTADOR-402-';
          const expectedCodes = Array.from({length: 120}, (_, index) => `${prefix}${String(index + 1).padStart(3, '0')}`);
          const fetchJSON = async relative => {
            const response = await fetch(`${base}/${relative}?trace=${Date.now()}`, {
              cache: 'no-store',
              headers: {'cache-control': 'no-cache, no-store', pragma: 'no-cache'},
            });
            if (!response.ok) throw new Error(`${relative}: HTTP ${response.status}`);
            return response.json();
          };

          const [build, catalog, receipt] = await Promise.all([
            fetchJSON('data/release/build-info.json'),
            fetchJSON('data/release/catalogo.json'),
            fetchJSON('data/release/crbm6-contador-70-publication-receipt.json'),
          ]);
          const questions = Object.keys(catalog.question_index || {}).length;
          const metadata = (catalog.materials || []).find(item => String(item.id) === 'notion-contador-crbm-6-quadrix-2026');
          if (!metadata) throw new Error('Material público de Contador ausente.');
          const material = await fetchJSON(String(metadata.file).replace(/^\.\//, ''));
          const codes = (material.questoes || []).map(question => String(question.codigo || ''));

          if (build.source_sha !== expectedSha || Number(build.questions) !== 2871 || questions !== 2871) {
            throw new Error(`Produção diverge do recibo confirmado: sha=${build.source_sha}; questões=${questions}.`);
          }
          if (Number(metadata.quantidade_questoes) !== 120 || codes.length !== 120 || JSON.stringify(codes) !== JSON.stringify(expectedCodes)) {
            throw new Error('Material público de Contador não contém a sequência exata 001–120.');
          }
          if (
            receipt.operation_id !== operation
            || Number(receipt.baseline_questions) !== 2801
            || Number(receipt.added_questions) !== 70
            || Number(receipt.final_questions) !== 2871
          ) {
            throw new Error('Recibo público do lote de Contador é divergente.');
          }
          console.log(`✓ Produção reconfirmada no commit ${expectedSha}: 2.871 questões e Contador 001–120.`);
          NODE
          node scripts/verify-deployment.mjs "${PUBLIC_BASE_URL}" "${EXPECTED_SHA}"

      - name: Reconstruir localmente o catálogo público confirmado
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BASE_SNAPSHOT_COMMIT}" --depth=1
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/published.json" > data/notion/published.json
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/publication-plan.json" > data/notion/publication-plan.json
          npm run build
          node scripts/apply-publication-additions.mjs
          node scripts/apply-seedf-bio-24-addition.mjs
          node scripts/apply-seedf-biomed-50-addition.mjs
          node scripts/apply-seedf-eletrot-43-addition.mjs
          node scripts/apply-alto-paraiso-orientador-37-addition.mjs
          node scripts/apply-crefito17-agentefiscal-62-addition.mjs
          node scripts/apply-crbm6-contador-70-addition.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const metadata = (catalog.materials || []).find(item => item.id === 'notion-contador-crbm-6-quadrix-2026');
          if (Number(catalog.summary?.questoes) !== 2871) throw new Error('Catálogo local reconstruído não contém 2.871 questões.');
          if (Number(metadata?.quantidade_questoes) !== 120) throw new Error('Material local de Contador não contém 120 questões.');
          console.log('✓ Catálogo local reconstruído: 2.871 questões e 120 itens de Contador.');
          NODE

      - name: Registrar Código GitHub somente nos 70 itens publicados
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ steps.deployment.outputs.release_sha }}
          NOTION_SNAPSHOT_PATH: ${{ env.CONTADOR_SNAPSHOT_PATH }}
          PUBLICATION_PLAN_PATH: ${{ env.CONTADOR_PLAN_PATH }}
        run: node scripts/mark-notion-published.mjs

      - name: Reverificar os 70 recibos e gerar comprovante
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ steps.deployment.outputs.release_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {fileURLToPath} from 'node:url';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)));
          const token = process.env.NOTION_TOKEN;
          const releaseSha = String(process.env.RELEASE_COMMIT || '').trim();
          const operation = process.env.CONTADOR_OPERATION;
          const snapshotPath = process.env.CONTADOR_SNAPSHOT_PATH;
          const planPath = process.env.CONTADOR_PLAN_PATH;
          const outputPath = process.env.TRACEABILITY_RECEIPT_PATH;
          const api = 'https://api.notion.com/v1';
          const version = '2026-03-11';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const clean = value => String(value ?? '').trim();
          const publicationDate = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit',
          }).format(new Date());
          const appVersion = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8')).version;
          const releaseCode = `release-${appVersion}:${releaseSha}`;

          async function request(endpoint, attempt = 1) {
            const response = await fetch(`${api}${endpoint}`, {
              headers: {Authorization: `Bearer ${token}`, 'Notion-Version': version},
            });
            if (response.ok) return response.json();
            const body = await response.text();
            if ((response.status === 429 || response.status >= 500) && attempt < 9) {
              await sleep(Math.max(Number(response.headers.get('retry-after') || 0) * 1000, 400 * 2 ** (attempt - 1)));
              return request(endpoint, attempt + 1);
            }
            throw new Error(`Notion API ${response.status}: ${body.slice(0, 600)}`);
          }
          function plain(property) {
            if (!property) return '';
            if (property.type === 'title') return (property.title || []).map(item => item.plain_text || '').join('');
            if (property.type === 'rich_text') return (property.rich_text || []).map(item => item.plain_text || '').join('');
            return '';
          }

          const snapshot = JSON.parse(fs.readFileSync(snapshotPath, 'utf8'));
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const lot = plan.lots?.[0];
          const expectedCodes = lot?.codes || [];
          if (plan.total_records !== 70 || expectedCodes.length !== 70 || lot?.lot !== operation) {
            throw new Error('Plano de rastreabilidade deixou de representar o lote de 70 itens.');
          }
          const byCode = new Map((snapshot.records || []).map(record => [clean(record.code), record]));
          let verified = 0;
          for (const code of expectedCodes) {
            const record = byCode.get(code);
            if (!record?.notion_id) throw new Error(`${code}: página do Notion ausente no snapshot.`);
            const current = await request(`/pages/${record.notion_id}`);
            const properties = current.properties || {};
            const currentCode = clean(plain(properties['Código']));
            const currentGithub = clean(plain(properties['Código GitHub']));
            const currentDate = clean(properties['Data da publicação']?.date?.start);
            if (currentCode !== code) throw new Error(`${code}: código atual divergiu no Notion.`);
            if (currentGithub !== releaseCode) throw new Error(`${code}: Código GitHub divergente: ${currentGithub || 'vazio'}.`);
            if (currentDate !== publicationDate) throw new Error(`${code}: Data da publicação divergente: ${currentDate || 'vazia'}.`);
            verified += 1;
          }

          const receipt = {
            schema_version: '1.0',
            verified_at: new Date().toISOString(),
            public_url: process.env.PUBLIC_BASE_URL,
            operation_id: operation,
            release_commit: releaseSha,
            release_code: releaseCode,
            publication_date: publicationDate,
            public_questions: 2871,
            material_questions: 120,
            expected_count: 70,
            verified_count: verified,
            codes_sha256: lot.codes_sha256,
            codes: expectedCodes,
            source_snapshot: snapshotPath,
            source_plan: planPath,
            verification: {
              public_deployment: 'success',
              immutable_package: 'success',
              local_catalog_reconstruction: 'success',
              notion_receipts: 'success',
            },
          };
          fs.mkdirSync(path.dirname(outputPath), {recursive: true});
          fs.writeFileSync(outputPath, `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(`✓ Recibo de rastreabilidade preparado: ${verified}/70 registros confirmados com ${releaseCode}.`);
          NODE

      - name: Versionar somente o recibo de rastreabilidade confirmado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-traceability[bot]'
          git config user.email 'sedes-df-traceability[bot]@users.noreply.github.com'
          git add "${TRACEABILITY_RECEIPT_PATH}"
          if git diff --cached --quiet; then
            echo 'O recibo de rastreabilidade já está atualizado.'
            exit 0
          fi
          git commit -m 'Registrar rastreabilidade confirmada de Contador [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main
