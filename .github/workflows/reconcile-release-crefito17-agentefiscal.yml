name: Reconciliar e liberar Agente Fiscal CREFITO-17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-release-crefito17-agentefiscal.yml
      - scripts/reconcile-release-crefito17-agentefiscal.mjs
      - data/operations/run-crefito17-agentefiscal-reconcile.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-release-crefito17-agentefiscal
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Preparar regras corrigidas de reconciliação
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/reconcile-release-crefito17-agentefiscal.mjs')
          text = source.read_text(encoding='utf-8')

          old_historical = """for (const row of livePublic) {
            const p = row.properties || {};
            const code = plain(p['Código']);
            if (plain(p['Código GitHub']) !== HISTORICAL_RECEIPT) fail(`${code}: recibo atual diverge do catálogo.`);
            validateEditorialGates(row);
          }
          """
          new_historical = """for (const row of livePublic) {
            const p = row.properties || {};
            const code = plain(p['Código']);
            if (plain(p['Código GitHub']) !== HISTORICAL_RECEIPT) fail(`${code}: recibo atual diverge do catálogo.`);
          }
          """
          if old_historical not in text:
              raise SystemExit('Trecho histórico esperado não foi encontrado no script.')
          text = text.replace(old_historical, new_historical, 1)

          old_gabarito = "if (!checked(p['Gabarito conferido - registro manual anterior'])) fail(`${code}: gabarito definitivo não confirmado.`);"
          new_gabarito = "if (!checked(p['Gabarito conferido']) && !checked(p['Gabarito conferido - registro manual anterior'])) fail(`${code}: gabarito definitivo não confirmado.`);"
          if old_gabarito not in text:
              raise SystemExit('Gate de gabarito esperado não foi encontrado no script.')
          text = text.replace(old_gabarito, new_gabarito, 1)

          old_lot = "const NEW_LOT = 'CREFITO17-2026-AGENTE-FISCAL-PENDENTES-63-20260803';"
          new_lot = "const NEW_LOT = 'CREFITO17-2026-AGENTE-FISCAL-APTOS-62-20260803';"
          if old_lot not in text:
              raise SystemExit('Identificador do lote original não foi encontrado.')
          text = text.replace(old_lot, new_lot, 1)

          old_pending_validation = """for (const row of pending) {
            const p = row.properties || {};
            const code = plain(p['Código']);
            if (publicCodes.has(code)) fail(`${code}: código público classificado como pendente.`);
            if (plain(p['Lote de publicação'])) fail(`${code}: lote prévio inesperado.`);
            validateEditorialGates(row);
          }
          """
          new_pending_validation = """const blockedPendingCodes = new Set([`${PREFIX}046`]);
          const releasable = pending.filter(row => !blockedPendingCodes.has(plain(row.properties?.['Código'])));
          const blockedPending = pending.filter(row => blockedPendingCodes.has(plain(row.properties?.['Código'])));
          if (releasable.length !== 62 || blockedPending.length !== 1) {
            fail(`Esperados 62 inéditos aptos e um bloqueado; encontrados ${releasable.length} aptos e ${blockedPending.length} bloqueado(s).`);
          }
          for (const row of blockedPending) {
            const p = row.properties || {};
            const code = plain(p['Código']);
            if (!checked(p['Bloqueio manual de publicação'])) fail(`${code}: bloqueio técnico esperado não está ativo.`);
            if (checked(p['Liberada para exportação']) || plain(p['Lote de publicação']) || plain(p['Código GitHub'])) {
              fail(`${code}: item bloqueado possui estado incompatível com exclusão do lote.`);
            }
          }
          for (const row of releasable) {
            const p = row.properties || {};
            const code = plain(p['Código']);
            if (publicCodes.has(code)) fail(`${code}: código público classificado como pendente.`);
            if (plain(p['Lote de publicação'])) fail(`${code}: lote prévio inesperado.`);
            validateEditorialGates(row);
          }
          """
          if old_pending_validation not in text:
              raise SystemExit('Bloco de validação dos pendentes não foi encontrado.')
          text = text.replace(old_pending_validation, new_pending_validation, 1)

          old_release = """let released = 0;
          for (const row of pending) {
            await request(`/pages/${row.id}`, {
              method: 'PATCH',
              body: JSON.stringify({properties: {
                'Lote de publicação': rich(NEW_LOT),
                'Liberada para exportação': {checkbox: true},
                'Data da publicação': {date: null},
              }}),
            });
            released += 1;
            if (released % 20 === 0) console.log(`${released}/63 inéditos liberados.`);
          }
          """
          new_release = """let released = 0;
          for (const row of releasable) {
            await request(`/pages/${row.id}`, {
              method: 'PATCH',
              body: JSON.stringify({properties: {
                'Lote de publicação': rich(NEW_LOT),
                'Liberada para exportação': {checkbox: true},
                'Data da publicação': {date: null},
              }}),
            });
            released += 1;
            if (released % 20 === 0) console.log(`${released}/62 inéditos aptos liberados.`);
          }
          """
          if old_release not in text:
              raise SystemExit('Bloco de liberação original não foi encontrado.')
          text = text.replace(old_release, new_release, 1)

          old_after = """rows = await readLiveRows();
          const afterPublic = rows.filter(row => publicCodes.has(plain(row.properties?.['Código'])));
          const afterPending = rows.filter(row => !publicCodes.has(plain(row.properties?.['Código'])));
          for (const row of afterPublic) {
            const p = row.properties || {};
            if (plain(p['Código GitHub']) !== HISTORICAL_RECEIPT || plain(p['Lote de publicação']) !== HISTORICAL_LOT || !checked(p['Liberada para exportação'])) {
              fail(`${plain(p['Código'])}: reconciliação histórica não persistiu.`);
            }
          }
          for (const row of afterPending) {
            const p = row.properties || {};
            if (plain(p['Código GitHub']) || plain(p['Lote de publicação']) !== NEW_LOT || !checked(p['Liberada para exportação'])) {
              fail(`${plain(p['Código'])}: liberação do lote novo não persistiu.`);
            }
          }
          """
          new_after = """rows = await readLiveRows();
          const releasableCodes = new Set(releasable.map(row => plain(row.properties?.['Código'])));
          const afterPublic = rows.filter(row => publicCodes.has(plain(row.properties?.['Código'])));
          const afterReleasable = rows.filter(row => releasableCodes.has(plain(row.properties?.['Código'])));
          const afterBlocked = rows.filter(row => blockedPendingCodes.has(plain(row.properties?.['Código'])));
          for (const row of afterPublic) {
            const p = row.properties || {};
            if (plain(p['Código GitHub']) !== HISTORICAL_RECEIPT || plain(p['Lote de publicação']) !== HISTORICAL_LOT || !checked(p['Liberada para exportação'])) {
              fail(`${plain(p['Código'])}: reconciliação histórica não persistiu.`);
            }
          }
          for (const row of afterReleasable) {
            const p = row.properties || {};
            if (plain(p['Código GitHub']) || plain(p['Lote de publicação']) !== NEW_LOT || !checked(p['Liberada para exportação'])) {
              fail(`${plain(p['Código'])}: liberação do lote novo não persistiu.`);
            }
          }
          for (const row of afterBlocked) {
            const p = row.properties || {};
            if (plain(p['Código GitHub']) || plain(p['Lote de publicação']) || checked(p['Liberada para exportação']) || !checked(p['Bloqueio manual de publicação'])) {
              fail(`${plain(p['Código'])}: preservação do bloqueio técnico não persistiu.`);
            }
          }
          """
          if old_after not in text:
              raise SystemExit('Bloco de validação pós-gravação não foi encontrado.')
          text = text.replace(old_after, new_after, 1)

          Path('/tmp/reconcile-release-crefito17-agentefiscal.mjs').write_text(text, encoding='utf-8')
          PY
      - name: Executar reconciliação com diagnóstico persistente
        id: reconcile
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set +e
          mkdir -p data/operations
          node /tmp/reconcile-release-crefito17-agentefiscal.mjs 2>&1 | tee data/operations/crefito17-agentefiscal-reconcile.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Registrar diagnóstico quando houver falha
        if: steps.reconcile.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git add data/operations/crefito17-agentefiscal-reconcile.log
          if git diff --cached --quiet; then
            echo 'O diagnóstico não mudou; nenhuma nova gravação necessária.'
            exit 0
          fi
          git commit -m 'Registrar falha da reconciliação do Agente Fiscal [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main
      - name: Remover operação temporária após sucesso
        if: steps.reconcile.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile-release-crefito17-agentefiscal.yml
          git rm scripts/reconcile-release-crefito17-agentefiscal.mjs
          git rm data/operations/run-crefito17-agentefiscal-reconcile.json
          git rm -f data/operations/crefito17-agentefiscal-reconcile.log || true
          git commit -m 'Concluir reconciliação do Agente Fiscal CREFITO-17 [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main
      - name: Encerrar com falha após registrar o diagnóstico
        if: steps.reconcile.outputs.exit_code != '0'
        run: exit 1
