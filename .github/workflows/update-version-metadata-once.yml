name: Atualizar metadados da versão uma vez

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'hotfix/consolidacao-real-v2-11-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-version-metadata-once.mjs
      - name: Registrar metadados alinhados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reports-v2-10.js tests/reports-v2-10.spec.js
          if git diff --cached --quiet; then
            echo "Metadados já alinhados."
          else
            git commit -m "Alinha metadados e testes à versão 2.11.1"
            git push origin HEAD:${{ github.head_ref }}
          fi
