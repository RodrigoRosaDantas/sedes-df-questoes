<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08131f">
  <meta name="description" content="Plataforma compartilhada de questões da SEDES/DF para os níveis médio e superior, com perfis, revisão e acompanhamento de desempenho.">
  <title>SEDES/DF Questões</title>
  <link rel="stylesheet" href="./assets/styles.css?v=2">
  <link rel="stylesheet" href="./assets/dashboard.css?v=1">
</head>
<body>
  <a class="skip" href="#app">Pular para o conteúdo</a>
  <header class="topbar">
    <a class="brand" href="#/inicio" aria-label="SEDES/DF Questões — início">
      <span class="brand-mark">SQ</span>
      <span><strong>SEDES/DF Questões</strong><small>Preparação compartilhada</small></span>
    </a>
    <nav class="desktop-nav" aria-label="Navegação principal">
      <a href="#/inicio" data-route="inicio">Início</a>
      <a href="#/estudar" data-route="estudar">Estudar</a>
      <a href="#/revisar" data-route="revisar">Revisar</a>
      <a href="#/desempenho" data-route="desempenho">Desempenho</a>
    </nav>
    <div class="top-actions">
      <span class="sync-pill"><i></i><span id="sync-label">Carregando catálogo</span></span>
      <button id="profile-button" class="profile-button" type="button" aria-label="Trocar perfil"><i>●</i><span id="profile-button-label">Perfil</span></button>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema">◐</button>
    </div>
  </header>

  <main id="app" class="page" tabindex="-1">
    <section class="card loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Preparando a plataforma…</h1>
      <p>Carregando perfis, catálogo e progresso local.</p>
    </section>
  </main>

  <nav class="mobile-nav" aria-label="Navegação móvel">
    <a href="#/inicio" data-route="inicio"><b>⌂</b><span>Início</span></a>
    <a href="#/estudar" data-route="estudar"><b>▣</b><span>Estudar</span></a>
    <a href="#/revisar" data-route="revisar"><b>◎</b><span>Revisar</span></a>
    <a href="#/desempenho" data-route="desempenho"><b>◔</b><span>Desempenho</span></a>
  </nav>

  <template id="error-template">
    <section class="card error-state">
      <p class="eyebrow">Falha de carregamento</p>
      <h1>Não foi possível abrir a plataforma.</h1>
      <p>Atualize a página. Caso o erro persista, consulte o status da publicação no repositório.</p>
      <button class="btn primary" onclick="location.reload()">Tentar novamente</button>
    </section>
  </template>

  <footer class="footer">
    <span>SEDES/DF Questões</span>
    <span>Notion → validação → GitHub Pages</span>
  </footer>
  <script src="./assets/bundle-fetch.js?v=2"></script>
  <script src="./assets/data-updates.js?v=1"></script>
  <script type="module" src="./assets/app-v3.js?v=1"></script>
</body>
</html>
