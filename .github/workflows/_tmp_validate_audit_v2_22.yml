name: Gate temporário — auditoria v2.22

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/fix-auditoria-edital-pwa-proveniencia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correção funcional
        uses: actions/checkout@v4
        with:
          ref: agent/fix-auditoria-edital-pwa-proveniencia
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Congelar release editorial
        run: |
          sha256sum data/release/catalogo.json > /tmp/catalog.sha256
          sha256sum data/release/study-index.json > /tmp/study.sha256
          find data/release/materials -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > /tmp/materials.sha256
      - name: Validar sintaxe e relevância antes do build
        run: |
          node --check assets/home-study-edital-v2-18.js
          node --check service-worker.js
          node --check scripts/reconcile-public-metadata.mjs
          node --check scripts/validate-edital-relevance-v2-22.mjs
          node --check scripts/validate-audit-fixes-v2-22.mjs
          node scripts/validate-edital-relevance-v2-22.mjs
          node scripts/validate-audit-fixes-v2-22.mjs
      - name: Gerar pacote público sem rebuild editorial
        run: |
          node scripts/build-question-search-index.mjs
          node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          sha256sum -c /tmp/catalog.sha256
          sha256sum -c /tmp/study.sha256
          sha256sum -c /tmp/materials.sha256
      - name: Validar contratos pós-build
        run: |
          node scripts/validate-edital-relevance-v2-22.mjs
          node scripts/validate-audit-fixes-v2-22.mjs
          node scripts/validate-home-study-v2-16.mjs
          node scripts/validate-home-question-format-v2-20.mjs
          node scripts/validate-home-question-format-v2-20-gate.mjs
          node scripts/validate-resolver-context-v2-19.mjs
          node scripts/validate-runtime-catalog.mjs
          node scripts/validate-platform-v2-13.mjs
          node scripts/validate-navigation-v2-15.mjs
          node scripts/validate-dist-v2-10.mjs
          node scripts/validate-public-metadata-consistency.mjs
          node - <<'NODE'
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync('dist/data/release/catalogo.json','utf8'));
          const meta=JSON.parse(fs.readFileSync('dist/data/release/release-meta.json','utf8'));
          const build=JSON.parse(fs.readFileSync('dist/data/release/build-info.json','utf8'));
          const format=JSON.parse(fs.readFileSync('dist/data/release/question-format-index.json','utf8'));
          if(Object.keys(catalog.question_index||{}).length!==3447) throw new Error('Questões divergentes');
          if((catalog.materials||[]).length!==75) throw new Error('Materiais divergentes');
          if(Number(meta.banco_mestre)!==3449 || Number(meta.awaiting_audit)!==0) throw new Error('Release-meta divergente');
          if(Number(format.summary?.['true-false'])!==2538 || Number(format.summary?.['multiple-choice'])!==909) throw new Error('Formatos divergentes');
          if(meta.provenance_contract_version!=='2.22' || build.provenance_contract_version!=='2.22') throw new Error('Proveniência v2.22 ausente');
          console.log('Release preservada: Banco 3449 | 3447 objetivas | 75 materiais | 0 auditoria | 2538 C/E + 909 múltipla.');
          NODE
      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Subir dist local
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sedes-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sedes-http.log
          exit 1
      - name: Relevância, matérias e offline
        run: timeout 480s npx playwright test tests/home-study-today-v2-16.spec.js tests/home-study-subjects-v2-17.spec.js tests/pwa-offline-v2-22.spec.js --config=playwright.config.js --workers=1 --retries=0
      - name: Formato e resolver
        run: timeout 420s npx playwright test tests/home-question-format-v2-20.spec.js tests/home-question-format-v2-21.spec.js tests/resolver-context-v2-19.spec.js --config=playwright.config.js --workers=1 --retries=0
      - name: Suíte local completa sem retries
        run: timeout 900s npx playwright test --config=playwright.config.js --retries=0
