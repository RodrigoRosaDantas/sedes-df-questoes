name: Consultar execução manual do cartão

on:
  push:
    branches: [main]
    paths:
      - 'data/operations/query-manual-dashboard-run.json'

permissions:
  contents: write
  actions: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Localizar execução da branch manual
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=manual-dashboard-card-deploy-final&per_page=50" > /tmp/runs.json
          RUN=$(jq -c '[.workflow_runs[] | select(.name == "Publicar manualmente correção do cartão Banco Mestre")] | sort_by(.created_at) | reverse | .[0] // {}' /tmp/runs.json)
          mkdir -p data/operations
          jq -n \
            --arg queried_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson run "${RUN}" \
            '{queried_at:$queried_at,run:{id:($run.id // null),status:($run.status // null),conclusion:($run.conclusion // null),head_sha:($run.head_sha // null),created_at:($run.created_at // null),updated_at:($run.updated_at // null),html_url:($run.html_url // null)}}' \
            > data/operations/manual-dashboard-card-deploy-run-status.json
          rm -f .github/workflows/query-manual-dashboard-run.yml
          rm -f data/operations/query-manual-dashboard-run.json
          git config user.name 'sedes-df-run-query[bot]'
          git config user.email 'sedes-df-run-query[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Registrar status do deploy manual [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
