name: Deploy Quadrix no Pages — temporário

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-quadrix-pages-once.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-quadrix-pages-20260805
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Gerar insumos temporários e validar novamente
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-editorial-platform-sync.mjs
          node scripts/export-pedagogia-editorial-sync.mjs
          npm run check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validar site público
        run: |
          URL='https://rodrigorosadantas.github.io/sedes-df-questoes'
          for i in $(seq 1 30); do
            curl -fsS "$URL/data/release/release-meta.json?run=$GITHUB_RUN_ID-$i" -o /tmp/release-meta.json || true
            if jq -e '.questions == 2971 and .banco_mestre == 3048 and .discursive_display_items == 2 and .materials == 69' /tmp/release-meta.json >/dev/null 2>&1; then break; fi
            sleep 10
          done
          jq -e '.questions == 2971 and .banco_mestre == 3048 and .discursive_display_items == 2 and .awaiting_audit == 75 and .materials == 69' /tmp/release-meta.json
          curl -fsS "$URL/?run=$GITHUB_RUN_ID" | grep -q 'discursive-display-v2-13.js'

      - name: Fechar rastreabilidade no Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/mark-quadrix-objectives-published.mjs
          node scripts/mark-discursive-display-published.mjs

      - name: Registrar recibo e remover workflow temporário
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          jq -n --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "$GITHUB_RUN_ID" --arg source_sha "$GITHUB_SHA" --arg public_url "$PAGE_URL" '{schema_version:"1.0",operation:"PUBLISH-QDX-CRASP-CREMAM-20260805",status:"success",confirmed_at:$confirmed_at,workflow_run_id:$run_id,source_sha:$source_sha,public_url:$public_url,questions:2971,discursive_display_items:2,banco_mestre:3048,awaiting_audit:75,materials:69,notion_traceability:"success",public_validation:"success"}' > data/operations/qdx-crasp-cremam-deployment-receipt.json
          rm -f .github/workflows/deploy-quadrix-pages-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/qdx-crasp-cremam-deployment-receipt.json .github/workflows/deploy-quadrix-pages-once.yml
          git commit -m 'Registrar publicação Quadrix e remover deploy temporário [skip ci]'
          git push origin HEAD:main
