name: Publicar hotfix de cache CREMAM — temporário

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-cremam-cache-hotfix-once.yml]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-cremam-cache-hotfix-20260805
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restaurar artefato público validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/RodrigoRosaDantas/sedes-df-questoes/actions/artifacts/8939443207/zip" \
            -o /tmp/pages.zip
          rm -rf /tmp/pages dist
          mkdir -p /tmp/pages dist
          unzip -q /tmp/pages.zip -d /tmp/pages
          tar -xf /tmp/pages/artifact.tar -C dist
          cp index.html service-worker.js dist/
          cp assets/app-v4.js dist/assets/app-v4.js

      - name: Validar catálogo e renovação do cache
        run: |
          node --check dist/assets/app-v4.js
          node --check dist/service-worker.js
          grep -q 'app-v4.js?v=10' dist/index.html
          grep -q 'catalogo.json?release=3048-2971-69-r2' dist/assets/app-v4.js
          grep -q 'sedes-questoes-v2-13-0-r2' dist/service-worker.js
          test "$(jq '[.materials[] | select(.id == "notion-analista-i-atendimento-e-cobranca-cra-sp-quadrix-2025" and .quantidade_questoes == 50)] | length' dist/data/release/catalogo.json)" = 1
          test "$(jq '[.materials[] | select(.id == "notion-assistente-administrativo-cremam-quadrix-2025" and .quantidade_questoes == 50)] | length' dist/data/release/catalogo.json)" = 1
          test "$(jq '.question_index | length' dist/data/release/catalogo.json)" = 2971

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar as duas provas no site
        run: |
          URL='https://rodrigorosadantas.github.io/sedes-df-questoes'
          for i in $(seq 1 30); do
            curl -fsS "$URL/?hotfix=$GITHUB_RUN_ID-$i" -o /tmp/index.html || true
            curl -fsS "$URL/service-worker.js?hotfix=$GITHUB_RUN_ID-$i" -o /tmp/service-worker.js || true
            curl -fsS "$URL/data/release/catalogo.json?hotfix=$GITHUB_RUN_ID-$i" -o /tmp/catalogo.json || true
            if grep -q 'app-v4.js?v=10' /tmp/index.html 2>/dev/null \
              && grep -q 'sedes-questoes-v2-13-0-r2' /tmp/service-worker.js 2>/dev/null \
              && jq -e '[.materials[] | select(.id == "notion-analista-i-atendimento-e-cobranca-cra-sp-quadrix-2025")] | length == 1' /tmp/catalogo.json >/dev/null 2>&1 \
              && jq -e '[.materials[] | select(.id == "notion-assistente-administrativo-cremam-quadrix-2025")] | length == 1' /tmp/catalogo.json >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          grep -q 'app-v4.js?v=10' /tmp/index.html
          grep -q 'sedes-questoes-v2-13-0-r2' /tmp/service-worker.js
          jq -e '[.materials[] | select(.id == "notion-analista-i-atendimento-e-cobranca-cra-sp-quadrix-2025" and .quantidade_questoes == 50)] | length == 1' /tmp/catalogo.json
          jq -e '[.materials[] | select(.id == "notion-assistente-administrativo-cremam-quadrix-2025" and .quantidade_questoes == 50)] | length == 1' /tmp/catalogo.json

      - name: Registrar recibo e remover publicador temporário
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p data/operations
          jq -n \
            --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$GITHUB_SHA" \
            --arg public_url "$PAGE_URL" \
            '{schema_version:"1.0",operation:"HOTFIX-CREMAM-CACHE-20260805",status:"success",confirmed_at:$confirmed_at,workflow_run_id:$run_id,source_sha:$source_sha,public_url:$public_url,cache_version:"sedes-questoes-v2-13-0-r2",app_asset:"app-v4.js?v=10",catalog_release_key:"3048-2971-69-r2",cra_sp_questions:50,cremam_questions:50,public_questions:2971,validation:"success"}' \
            > data/operations/cremam-cache-hotfix-deployment-receipt.json
          rm -f .github/workflows/deploy-cremam-cache-hotfix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/cremam-cache-hotfix-deployment-receipt.json .github/workflows/deploy-cremam-cache-hotfix-once.yml
          git commit -m 'Registrar hotfix de cache da prova CREMAM [skip ci]'
          git push origin HEAD:main
