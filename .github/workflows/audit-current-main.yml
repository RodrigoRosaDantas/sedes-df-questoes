name: Auditar estado público atual

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  EXPECTED_SHA: d16f233bf77753613b829f3a461bfd312309210b
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes
  PLAYWRIGHT_VERSION: 1.61.1

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Confirmar execução de produção do commit atual
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=main&per_page=50" > /tmp/runs.json
            run_id=$(jq -r --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha == $sha and .name == "Validar e publicar GitHub Pages") | .id' /tmp/runs.json | head -n1)
            if [ -z "$run_id" ]; then
              echo "Tentativa ${attempt}/90: execução de produção ainda não encontrada."
              sleep 10
              continue
            fi
            status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' /tmp/runs.json)
            conclusion=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")' /tmp/runs.json)
            if [ "$status" != "completed" ]; then
              echo "Tentativa ${attempt}/90: execução ${run_id} em ${status}."
              sleep 10
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "Execução ${run_id} terminou com ${conclusion}."
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" | jq -r '.jobs[] | "JOB \(.name): \(.conclusion // .status)\n" + ((.steps // []) | map("  \(.number). \(.name): \(.conclusion // .status)") | join("\n"))'
              exit 1
            fi
            echo "✓ Execução de produção ${run_id} concluída com sucesso para ${EXPECTED_SHA}."
            echo "RUN_ID=${run_id}" >> "$GITHUB_ENV"
            exit 0
          done
          echo "Execução de produção não encontrada dentro da janela de auditoria."
          exit 1
      - name: Confirmar pacote público, versão, totais e commit
        run: node scripts/verify-deployment.mjs "$PUBLIC_BASE_URL" "$EXPECTED_SHA"
      - name: Instalar Chromium em ambiente auditado
        run: |
          AUDIT_DIR=$(mktemp -d)
          printf '{"name":"sedes-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          npm install --prefix "$AUDIT_DIR" --package-lock-only --ignore-scripts --save-dev "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --prefix "$AUDIT_DIR" --audit-level=high
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Testar aplicação pública e os 245 códigos
        env:
          PUBLIC_BASE_URL: ${{ env.PUBLIC_BASE_URL }}
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        run: npx playwright test --config=playwright.public.config.js
