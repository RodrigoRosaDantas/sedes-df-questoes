name: Estabilizar teste do backup uma vez

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'hotfix/consolidacao-real-v2-11-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stabilize-backup-test-once.mjs
      - name: Registrar teste estabilizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/reports-v2-10.spec.js
          if git diff --cached --quiet; then
            echo "Teste já estabilizado."
          else
            git commit -m "Estabiliza teste do backup com snapshot do estado real"
            git push origin HEAD:${{ github.head_ref }}
          fi
