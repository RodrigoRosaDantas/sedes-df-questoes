<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo do processo orçamentário</title>
  <desc id="desc">Fluxograma cíclico com quatro etapas: elaboração da proposta orçamentária; discussão, votação e aprovação da lei orçamentária; execução orçamentária; controle e avaliação da execução orçamentária. As setas retornam do controle para a elaboração.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#fff"/>
  <g fill="#f7f7f7" stroke="#222" stroke-width="3">
    <rect x="270" y="40" width="360" height="105" rx="18"/>
    <rect x="600" y="255" width="260" height="120" rx="18"/>
    <rect x="270" y="470" width="360" height="105" rx="18"/>
    <rect x="40" y="255" width="260" height="120" rx="18"/>
  </g>
  <g fill="none" stroke="#222" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 630 105 C 770 125 820 175 825 255"/>
    <path d="M 730 375 C 700 455 650 500 630 520"/>
    <path d="M 270 520 C 145 500 85 445 80 375"/>
    <path d="M 170 255 C 190 170 235 125 270 105"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111" text-anchor="middle">
    <text x="450" y="78" font-size="22" font-weight="700">1. Elaboração da proposta</text>
    <text x="450" y="108" font-size="20">orçamentária</text>

    <text x="730" y="290" font-size="21" font-weight="700">2. Discussão, votação</text>
    <text x="730" y="320" font-size="20">e aprovação da lei</text>
    <text x="730" y="350" font-size="20">orçamentária</text>

    <text x="450" y="512" font-size="22" font-weight="700">3. Execução orçamentária</text>
    <text x="450" y="545" font-size="19">receitas e despesas autorizadas</text>

    <text x="170" y="290" font-size="21" font-weight="700">4. Controle e avaliação</text>
    <text x="170" y="320" font-size="20">da execução</text>
    <text x="170" y="350" font-size="20">orçamentária</text>

    <text x="450" y="302" font-size="27" font-weight="700">PROCESSO</text>
    <text x="450" y="338" font-size="27" font-weight="700">ORÇAMENTÁRIO</text>
    <text x="450" y="382" font-size="17">ciclo contínuo</text>
  </g>
</svg>
