name: Preparar lote incremental Quadrix v12 — temporário

on:
  push:
    branches: [agent/publish-quadrix-discursive-view-20260805]
    paths: [.github/workflows/prepare-quadrix-crasp-cremam-v12-once.yml]

permissions:
  contents: write

concurrency:
  group: prepare-quadrix-crasp-cremam-v12-20260805
  cancel-in-progress: false

jobs:
  prepare-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/publish-quadrix-discursive-view-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Exportar adições imutáveis e plano
        id: export
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-quadrix-objective-additions.mjs
          node scripts/export-discursive-display.mjs
          node scripts/create-publication-plan.mjs
      - name: Confirmar escopo, anuladas e decomposição
        id: scope
        run: |
          test "$(jq '.schema_version' data/notion/published.json)" = '1.3'
          test "$(jq '.scope_mode' data/notion/published.json)" = 'additions'
          test "$(jq '.records | length' data/notion/published.json)" = '100'
          test "$(jq '.publication_scope.codes | length' data/notion/published.json)" = '100'
          test "$(jq '.publication_scope.annulled_exceptions | length' data/notion/published.json)" = '2'
          test "$(jq '[.records[] | select(.annulled == true and .answer == "Anulada")] | length' data/notion/published.json)" = '2'
          test "$(jq '.totals.existing_public' data/notion/published.json)" = '2871'
          test "$(jq '.totals.display_only' data/notion/published.json)" = '2'
          test "$(jq '.totals.pending' data/notion/published.json)" = '75'
          test "$(jq '.totals.all' data/notion/published.json)" = '3048'
          test "$(jq '.total_records' data/notion/publication-plan.json)" = '100'
          test "$(jq '.lots | length' data/notion/publication-plan.json)" = '2'
          test "$(jq '.total' data/notion/discursive-display.json)" = '2'
          test "$(jq '[.records[] | select(.display_only != true or (.guidance | length) == 0)] | length' data/notion/discursive-display.json)" = '0'
      - name: Executar validação integral
        id: check
        run: npm run check
      - name: Testar visualização no navegador
        id: browser
        run: |
          npm install --no-save @playwright/test@1.61.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist >/tmp/sedes-discursive-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test tests/discursive-display.spec.js
      - name: Confirmar contrato final
        id: contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const releaseMeta = JSON.parse(fs.readFileSync('dist/data/release/release-meta.json', 'utf8'));
          const expected = ['Analista I — Atendimento e Cobrança — CRA-SP — Quadrix 2025','Assistente Administrativo — CREMAM — Quadrix 2025'];
          let annulled = 0;
          for (const name of expected) {
            const meta = catalog.materials.find(item => item.nome === name);
            if (!meta) throw new Error(`Material ausente: ${name}`);
            const material = JSON.parse(fs.readFileSync(meta.file.replace(/^\.\//, ''), 'utf8'));
            if (material.questoes.length !== 50 || (material.discursivas || []).length !== 1) throw new Error(`${name}: contrato divergente.`);
            annulled += material.questoes.filter(item => item.gabarito === 'Anulada' && item.anulada === true).length;
            if (material.discursivas.some(item => item.somente_visualizacao !== true || item.pontuada !== false || item.gabarito || item.alternativas)) throw new Error(`${name}: discursiva não está somente leitura.`);
          }
          if (annulled !== 2) throw new Error(`Anuladas no pacote=${annulled}`);
          if (Number(releaseMeta.banco_mestre) !== 3048) throw new Error(`Banco Mestre=${releaseMeta.banco_mestre}`);
          if (Number(releaseMeta.questions) !== 2971) throw new Error(`Questões=${releaseMeta.questions}`);
          if (Number(releaseMeta.discursive_display_items) !== 2) throw new Error(`Discursivas=${releaseMeta.discursive_display_items}`);
          if (Number(releaseMeta.awaiting_audit) !== 75) throw new Error(`Auditoria=${releaseMeta.awaiting_audit}`);
          if (Number(releaseMeta.materials) !== 69) throw new Error(`Materiais=${releaseMeta.materials}`);
          NODE
      - name: Versionar pacote validado
        if: success()
        run: |
          mkdir -p data/operations
          rm -f data/operations/qdx-crasp-cremam-preparation-status.json
          jq -n --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "${GITHUB_RUN_ID}" --arg snapshot_sha "$(sha256sum data/notion/published.json | awk '{print $1}')" --arg plan_sha "$(sha256sum data/notion/publication-plan.json | awk '{print $1}')" --arg disc_sha "$(sha256sum data/notion/discursive-display.json | awk '{print $1}')" '{schema_version:"1.0",operation:"PREPARE-QDX-CRASP-CREMAM-20260805",status:"success",completed_at:$completed_at,workflow_run_id:$run_id,existing_public_preserved:2871,objective_questions_added:100,annulled_objectives:2,discursive_display_items:2,awaiting_audit:75,banco_mestre:3048,total_questions_after_build:2971,total_materials_after_build:69,lots:["QDX-2025-CRASP-ANACOB-001-050-20260805","QDX-2025-CREMAM-ASSADM-001-050-20260805"],hashes:{notion_snapshot_sha256:$snapshot_sha,publication_plan_sha256:$plan_sha,discursive_display_sha256:$disc_sha},validation:{full_check:"success",browser_test:"success",objective_engine:"100 additions",annulled_exception_gate:"success",discursive_mode:"display_only",metadata_decomposition:"success"}}' > data/operations/qdx-crasp-cremam-preparation-receipt.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/notion/published.json data/notion/publication-plan.json data/notion/discursive-display.json data/operations/qdx-crasp-cremam-preparation-receipt.json
          git add -u data/operations/qdx-crasp-cremam-preparation-status.json || true
          git diff --cached --quiet || git commit -m 'Versionar lote incremental Quadrix com discursivas de consulta [skip ci]'
          git push origin HEAD:agent/publish-quadrix-discursive-view-20260805
      - name: Registrar falha auditável
        if: failure()
        run: |
          mkdir -p data/operations
          jq -n --arg failed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "${GITHUB_RUN_ID}" --arg export "${{ steps.export.outcome }}" --arg scope "${{ steps.scope.outcome }}" --arg check "${{ steps.check.outcome }}" --arg browser "${{ steps.browser.outcome }}" --arg contract "${{ steps.contract.outcome }}" '{schema_version:"1.0",operation:"PREPARE-QDX-CRASP-CREMAM-20260805",status:"failure",failed_at:$failed_at,workflow_run_id:$run_id,steps:{export:$export,scope:$scope,check:$check,browser:$browser,contract:$contract}}' > data/operations/qdx-crasp-cremam-preparation-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/qdx-crasp-cremam-preparation-status.json
          git diff --cached --quiet || git commit -m 'Registrar falha da preparação incremental Quadrix [skip ci]'
          git push origin HEAD:agent/publish-quadrix-discursive-view-20260805
