name: Preparar e testar lote Quadrix v6 — temporário

on:
  push:
    branches: [agent/publish-quadrix-discursive-view-20260805]
    paths: [.github/workflows/prepare-quadrix-crasp-cremam-v6-once.yml]

permissions:
  contents: write

concurrency:
  group: prepare-quadrix-crasp-cremam-v6-20260805
  cancel-in-progress: false

jobs:
  prepare-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/publish-quadrix-discursive-view-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Exportar snapshot e plano
        id: export
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-notion-snapshot.mjs
          node scripts/export-discursive-display.mjs
          node scripts/create-publication-plan.mjs

      - name: Confirmar escopo de 100 mais 2
        id: scope
        run: |
          test "$(jq '[.records[] | select(.code | startswith("PROVA-QDX-CRASP-2025-ANACOB-400-")) | select(.code | contains("-DISC-") | not)] | length' data/notion/published.json)" = '50'
          test "$(jq '[.records[] | select(.code | startswith("PROVA-QDX-CREMAM-2025-ASSADM-200-")) | select(.code | contains("-DISC-") | not)] | length' data/notion/published.json)" = '50'
          test "$(jq '[.lots[] | select(.lot == "QDX-2025-CRASP-ANACOB-001-050-20260805") | .codes[]] | length' data/notion/publication-plan.json)" = '50'
          test "$(jq '[.lots[] | select(.lot == "QDX-2025-CREMAM-ASSADM-001-050-20260805") | .codes[]] | length' data/notion/publication-plan.json)" = '50'
          test "$(jq '.total' data/notion/discursive-display.json)" = '2'
          test "$(jq '[.records[] | select(.display_only != true or (.guidance | length) == 0)] | length' data/notion/discursive-display.json)" = '0'

      - name: Executar validação integral
        id: check
        run: npm run check

      - name: Testar visualização no navegador
        id: browser
        run: |
          npm install --no-save @playwright/test@1.61.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist >/tmp/sedes-discursive-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test tests/discursive-display.spec.js

      - name: Confirmar contrato gerado
        id: contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const releaseMeta = JSON.parse(fs.readFileSync('dist/data/release/release-meta.json', 'utf8'));
          for (const name of ['Analista I — Atendimento e Cobrança — CRA-SP — Quadrix 2025','Assistente Administrativo — CREMAM — Quadrix 2025']) {
            const meta = catalog.materials.find(item => item.nome === name);
            if (!meta) throw new Error(`Material ausente: ${name}`);
            const material = JSON.parse(fs.readFileSync(meta.file.replace(/^\.\//, ''), 'utf8'));
            if (material.questoes.length !== 50) throw new Error(`${name}: objetivas=${material.questoes.length}`);
            if ((material.discursivas || []).length !== 1) throw new Error(`${name}: discursivas=${(material.discursivas || []).length}`);
            if ((material.discursivas || []).some(item => item.somente_visualizacao !== true || item.pontuada !== false || item.gabarito || item.alternativas)) throw new Error(`${name}: contrato de consulta inválido.`);
          }
          if (Number(catalog.summary.discursivas_consulta) !== 2) throw new Error('Catálogo sem as duas discursivas.');
          if (Number(releaseMeta.discursive_display_items) !== 2) throw new Error('Release-meta sem as duas discursivas.');
          if (Number(releaseMeta.banco_mestre) - Number(releaseMeta.questions) - 2 !== Number(releaseMeta.awaiting_audit)) throw new Error('Decomposição pública divergente.');
          NODE

      - name: Versionar pacote validado
        if: success()
        run: |
          mkdir -p data/operations
          jq -n --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "${GITHUB_RUN_ID}" --arg snapshot_sha "$(sha256sum data/notion/published.json | awk '{print $1}')" --arg plan_sha "$(sha256sum data/notion/publication-plan.json | awk '{print $1}')" --arg disc_sha "$(sha256sum data/notion/discursive-display.json | awk '{print $1}')" '{schema_version:"1.0",operation:"PREPARE-QDX-CRASP-CREMAM-20260805",status:"success",completed_at:$completed_at,workflow_run_id:$run_id,objective_questions:100,discursive_display_items:2,materials:2,lots:["QDX-2025-CRASP-ANACOB-001-050-20260805","QDX-2025-CREMAM-ASSADM-001-050-20260805"],hashes:{notion_snapshot_sha256:$snapshot_sha,publication_plan_sha256:$plan_sha,discursive_display_sha256:$disc_sha},validation:{full_check:"success",browser_test:"success",objective_engine:"100 items",discursive_mode:"display_only",metadata_decomposition:"success"}}' > data/operations/qdx-crasp-cremam-preparation-receipt.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/notion/published.json data/notion/publication-plan.json data/notion/discursive-display.json data/operations/qdx-crasp-cremam-preparation-receipt.json
          git diff --cached --quiet || git commit -m 'Versionar lote Quadrix com discursivas de consulta [skip ci]'
          git push origin HEAD:agent/publish-quadrix-discursive-view-20260805

      - name: Registrar falha auditável
        if: failure()
        run: |
          mkdir -p data/operations
          jq -n --arg failed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "${GITHUB_RUN_ID}" --arg export "${{ steps.export.outcome }}" --arg scope "${{ steps.scope.outcome }}" --arg check "${{ steps.check.outcome }}" --arg browser "${{ steps.browser.outcome }}" --arg contract "${{ steps.contract.outcome }}" '{schema_version:"1.0",operation:"PREPARE-QDX-CRASP-CREMAM-20260805",status:"failure",failed_at:$failed_at,workflow_run_id:$run_id,steps:{export:$export,scope:$scope,check:$check,browser:$browser,contract:$contract}}' > data/operations/qdx-crasp-cremam-preparation-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/qdx-crasp-cremam-preparation-status.json
          git diff --cached --quiet || git commit -m 'Registrar falha da preparação Quadrix [skip ci]'
          git push origin HEAD:agent/publish-quadrix-discursive-view-20260805
