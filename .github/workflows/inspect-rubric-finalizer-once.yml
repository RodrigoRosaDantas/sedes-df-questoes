name: Inspecionar finalização da rubrica — temporário

on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-rubric-finalizer-once.yml]

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Consultar finalizador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/operations
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.name == "Finalizar rubrica pedagógica dos 75 registros — temporário")][0] | {id,name,status,conclusion,head_sha,created_at,updated_at,html_url}' \
            > data/operations/rubric-finalizer-diagnostic.json
          RUN_ID=$(jq -r '.id' data/operations/rubric-finalizer-diagnostic.json)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '{run_id:'"$RUN_ID"',jobs:[.jobs[]|{id,name,status,conclusion,steps:[.steps[]|{name,status,conclusion,number}]}]}' \
            > data/operations/rubric-finalizer-jobs.json
      - name: Registrar e remover inspetor
        run: |
          rm -f .github/workflows/inspect-rubric-finalizer-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/rubric-finalizer-diagnostic.json data/operations/rubric-finalizer-jobs.json .github/workflows/inspect-rubric-finalizer-once.yml
          git commit -m 'Registrar diagnóstico do finalizador da rubrica [skip ci]'
          git push origin HEAD:main
