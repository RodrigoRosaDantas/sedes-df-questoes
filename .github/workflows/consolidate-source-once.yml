name: Consolidar fontes públicas uma vez

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.head_ref == 'hotfix/consolidacao-real-v2-11-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materializar aplicação pública nas fontes
        run: node scripts/consolidate-source-once.mjs
      - name: Registrar fontes consolidadas na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-v4.js index.html
          if git diff --cached --quiet; then
            echo "Fontes já consolidadas."
          else
            git commit -m "Consolida HTML e JavaScript públicos nas fontes"
            git push origin HEAD:${{ github.head_ref }}
          fi
