name: Publicar lote CRFa-1 Analista — 115 itens

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-crfa1-analista-115.yml
      - data/operations/publish-crfa1-analista-115.json
      - scripts/validate-crfa1-analista-115-deploy.mjs
      - scripts/close-crfa1-analista-115-after-deploy.mjs
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes

concurrency:
  group: deploy-crfa1-analista-115
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validar pacote preparado e baseline pública
        run: node scripts/validate-crfa1-analista-115-deploy.mjs source

      - name: Preservar validadores temporários fora da árvore Git
        run: |
          cp scripts/validate-crfa1-analista-115-deploy.mjs /tmp/validate-crfa1-analista-115-deploy.mjs
          cp scripts/close-crfa1-analista-115-after-deploy.mjs /tmp/close-crfa1-analista-115-after-deploy.mjs

      - name: Reconciliar o validador canônico com o hotfix de cache r5
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/build-public.mjs';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['const expectedCacheVersion = `sedes-questoes-v${versionToken}-r3`;', 'const expectedCacheVersion = `sedes-questoes-v${versionToken}-r5`;'],
            ['"app-v4.js?v=11"', '"app-v4.js?v=13"'],
            ['const STUDY_INDEX_URL = "./data/release/study-index.json?release=3048-3046-71-r3";', 'const STUDY_INDEX_URL = "./data/release/study-index.json?release=3048-3046-71-r5";'],
          ];
          for (const [before, after] of replacements) {
            if (!text.includes(before)) throw new Error(`Marcador legado ausente em build-public.mjs: ${before}`);
            text = text.replace(before, after);
          }
          fs.writeFileSync(file, text);
          console.log('✓ build-public.mjs reconciliado com os arquivos canônicos r5/v13 já presentes na main.');
          NODE

      - name: Criar commit limpo da release e auto-remover o deploy temporário
        id: release_source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/deploy-crfa1-analista-115.yml
          git rm scripts/validate-crfa1-analista-115-deploy.mjs
          git rm scripts/close-crfa1-analista-115-after-deploy.mjs
          git add scripts/build-public.mjs data/operations/publish-crfa1-analista-115.json
          git commit -m 'Publicar 115 questões do CRFa-1 [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "✓ Commit limpo da release: ${RELEASE_SHA}."

      - name: Construir, testar e validar o artefato 3161/72
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          set -u
          LOG=/tmp/crfa1-deploy-check.log
          echo "Release SHA: ${RELEASE_SHA}" | tee "${LOG}"

          persist_failure() {
            local status="$1"
            local stage="$2"
            echo "FALHA EM ${stage}; status ${status}." | tee -a "${LOG}"
            cp "${LOG}" /tmp/crfa1-deploy-check-preserved.log
            git reset --hard HEAD
            git clean -fd
            mkdir -p data/operations
            cp /tmp/crfa1-deploy-check-preserved.log data/operations/crfa1-analista-115-deploy-failure.log
            git add data/operations/crfa1-analista-115-deploy-failure.log
            git commit -m 'Registrar falha de validação do deploy CRFa-1 [skip ci]'
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
            git push origin HEAD:main
            exit "${status}"
          }

          set +e
          GITHUB_SHA="${RELEASE_SHA}" npm run check 2>&1 | tee -a "${LOG}"
          CHECK_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${CHECK_STATUS}" -ne 0 ]; then persist_failure "${CHECK_STATUS}" 'npm run check'; fi

          set +e
          CRFA_ROOT="${GITHUB_WORKSPACE}" node /tmp/validate-crfa1-analista-115-deploy.mjs dist "${RELEASE_SHA}" 2>&1 | tee -a "${LOG}"
          DIST_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${DIST_STATUS}" -ne 0 ]; then persist_failure "${DIST_STATUS}" 'gate dist CRFa-1'; fi
          echo '✓ Build e gate dist concluídos sem falha.' | tee -a "${LOG}"

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar artefato já validado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirmar metadados estáticos publicados
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${RELEASE_SHA}"

      - name: Confirmar lote CRFa-1 no endereço público
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          node --input-type=module - <<'NODE'
          const base = new URL(process.env.PUBLIC_URL.endsWith('/') ? process.env.PUBLIC_URL : `${process.env.PUBLIC_URL}/`);
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const clean = value => String(value ?? '').trim();
          const blocked = [5, 48, 54, 102, 104];
          const prefix = 'PROVA-QDX-CRFA1-2026-ANALISTA-ADMINISTRATIVO-400-';
          let lastError;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              const stamp = `${Date.now()}-${attempt}`;
              const [buildResponse, catalogResponse] = await Promise.all([
                fetch(new URL(`data/release/build-info.json?audit=${stamp}`, base), {cache: 'no-store'}),
                fetch(new URL(`data/release/catalogo.json?audit=${stamp}`, base), {cache: 'no-store'}),
              ]);
              if (!buildResponse.ok || !catalogResponse.ok) throw new Error(`HTTP ${buildResponse.status}/${catalogResponse.status}`);
              const build = await buildResponse.json();
              const catalog = await catalogResponse.json();
              if (clean(build.source_sha) !== process.env.RELEASE_SHA) throw new Error(`source_sha ${build.source_sha}`);
              if (Number(build.questions) !== 3161 || Number(catalog.summary?.questoes) !== 3161) throw new Error(`total ${build.questions}/${catalog.summary?.questoes}`);
              const meta = (catalog.materials || []).find(item => clean(item.nome) === 'Analista Administrativo — CRFa-1 — Quadrix 2026');
              if (!meta || Number(meta.quantidade_questoes) !== 115) throw new Error('material CRFa-1 ausente ou incompleto');
              const materialUrl = new URL(String(meta.file).replace(/^\.\//, ''), base);
              materialUrl.searchParams.set('audit', stamp);
              const materialResponse = await fetch(materialUrl, {cache: 'no-store'});
              if (!materialResponse.ok) throw new Error(`material HTTP ${materialResponse.status}`);
              const material = await materialResponse.json();
              const questions = material.questoes || [];
              if (questions.length !== 115) throw new Error(`material contém ${questions.length}`);
              const codes = new Set(questions.map(item => clean(item.codigo)));
              for (const number of blocked) if (codes.has(`${prefix}${String(number).padStart(3, '0')}`)) throw new Error(`bloqueio ${number} publicado`);
              const answers = new Map(questions.map(item => [Number(item.numero_original ?? item.numero), clean(item.gabarito)]));
              for (const [number, answer] of [[47,'Certo'],[52,'Errado'],[57,'Errado'],[107,'Errado'],[108,'Errado']]) if (answers.get(number) !== answer) throw new Error(`gabarito ${number}=${answers.get(number)}`);
              console.log(`✓ Produção confirmada: 3161 questões; CRFa-1 115/115; SHA ${process.env.RELEASE_SHA}.`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Tentativa pública ${attempt}/30: ${error.message}`);
              await sleep(5000);
            }
          }
          throw lastError || new Error('Produção não convergiu.');
          NODE

      - name: Fechar rastreabilidade no Notion pelo snapshot imutável
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
          CRFA_ROOT: ${{ github.workspace }}
        run: node /tmp/close-crfa1-analista-115-after-deploy.mjs

      - name: Resumo da operação
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          echo "✓ CRFa-1 publicado e fechado no Notion."
          echo "Release: release-2.13.0:${RELEASE_SHA}"
          echo "Total público esperado: 3161"
          echo "Itens publicados: 115"
          echo "Bloqueados preservados: 5, 48, 54, 102, 104"
