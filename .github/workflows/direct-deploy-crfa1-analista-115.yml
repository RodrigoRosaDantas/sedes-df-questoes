name: Publicar CRFa-1 sobre catálogo cumulativo — 115 itens

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-deploy-crfa1-analista-115.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: direct-deploy-crfa1-analista-115
  cancel-in-progress: false

env:
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Recuperar gates auditados do CRFa-1
        shell: bash
        run: |
          set -euo pipefail
          git show a20b65612f867d4f6b09ea952589cdb4a29f2340:scripts/validate-crfa1-analista-115-deploy.mjs > /tmp/validate-crfa1-analista-115-deploy.mjs
          git show a20b65612f867d4f6b09ea952589cdb4a29f2340:scripts/close-crfa1-analista-115-after-deploy.mjs > /tmp/close-crfa1-analista-115-after-deploy.mjs
          test -s /tmp/validate-crfa1-analista-115-deploy.mjs
          test -s /tmp/close-crfa1-analista-115-after-deploy.mjs

      - name: Validar pacote imutável e baseline 3046/71
        env:
          CRFA_ROOT: ${{ github.workspace }}
        run: node /tmp/validate-crfa1-analista-115-deploy.mjs source

      - name: Congelar identidade do catálogo público anterior
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const ids = Object.keys(catalog.question_index || {}).sort();
          if (ids.length !== 3046) throw new Error(`Baseline com ${ids.length} questões; esperado 3046.`);
          if ((catalog.materials || []).length !== 71) throw new Error(`Baseline com ${(catalog.materials || []).length} materiais; esperado 71.`);
          if ((catalog.materials || []).some(item => String(item.nome || '').trim() === 'Analista Administrativo — CRFa-1 — Quadrix 2026')) {
            throw new Error('CRFa-1 já existe no catálogo anterior.');
          }
          fs.writeFileSync('/tmp/crfa1-base-ids.json', JSON.stringify(ids));
          fs.writeFileSync('/tmp/crfa1-base-catalog-sha.txt', `${crypto.createHash('sha256').update(fs.readFileSync('data/release/catalogo.json')).digest('hex')}\n`);
          console.log(`✓ Baseline congelada: 3046 IDs, 71 materiais.`);
          NODE

      - name: Aplicar somente o pacote CRFa-1 sobre o catálogo cumulativo
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-notion-snapshot.mjs
          node scripts/apply-discursive-display.mjs
          node scripts/build-study-index.mjs
          GITHUB_SHA="${GITHUB_SHA}" node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          rm -rf data/release
          cp -a dist/data/release data/release

      - name: Validar preservação dos 3046 IDs e delta exato de 115
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const clean = value => String(value ?? '').trim();
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/release/manifest.json', 'utf8'));
          const baseIds = JSON.parse(fs.readFileSync('/tmp/crfa1-base-ids.json', 'utf8'));
          const finalIds = new Set(Object.keys(catalog.question_index || {}));
          const missing = baseIds.filter(id => !finalIds.has(id));
          if (missing.length) throw new Error(`IDs públicos anteriores perdidos: ${missing.slice(0, 10).join(', ')}.`);
          if (baseIds.length !== 3046 || finalIds.size !== 3161 || finalIds.size - baseIds.length !== 115) {
            throw new Error(`Delta público divergente: ${baseIds.length} → ${finalIds.size}.`);
          }
          if ((catalog.materials || []).length !== 72) throw new Error(`Materiais finais: ${(catalog.materials || []).length}; esperado 72.`);
          if (Number(catalog.summary?.banco_mestre) !== 3212) throw new Error(`Banco Mestre no catálogo: ${catalog.summary?.banco_mestre}; esperado 3212.`);
          if (Number(catalog.summary?.aguardando_auditoria) !== 49) throw new Error(`Pendências no catálogo: ${catalog.summary?.aguardando_auditoria}; esperado 49.`);
          if (Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error(`Discursivas de consulta: ${catalog.summary?.discursivas_consulta}; esperado 2.`);

          const targetMeta = (catalog.materials || []).find(item => clean(item.nome) === 'Analista Administrativo — CRFa-1 — Quadrix 2026');
          if (!targetMeta || Number(targetMeta.quantidade_questoes) !== 115) throw new Error('Material CRFa-1 ausente ou com quantidade divergente.');
          const target = JSON.parse(fs.readFileSync(String(targetMeta.file).replace(/^\.\//, ''), 'utf8'));
          const questions = target.questoes || [];
          if (questions.length !== 115) throw new Error(`CRFa-1 contém ${questions.length}; esperado 115.`);
          const blocked = [5, 48, 54, 102, 104];
          const expectedNumbers = Array.from({length: 120}, (_, i) => i + 1).filter(number => !blocked.includes(number));
          const numbers = questions.map(item => Number(item.numero_original ?? item.numero));
          if (JSON.stringify(numbers) !== JSON.stringify(expectedNumbers)) throw new Error(`Sequência CRFa-1 divergente: ${numbers.join(',')}.`);
          const prefix = 'PROVA-QDX-CRFA1-2026-ANALISTA-ADMINISTRATIVO-400-';
          const codes = new Set(questions.map(item => clean(item.codigo)));
          for (const number of blocked) {
            const code = `${prefix}${String(number).padStart(3, '0')}`;
            if (codes.has(code)) throw new Error(`Questão bloqueada ${number} apareceu no catálogo.`);
          }
          const answers = new Map(questions.map(item => [Number(item.numero_original ?? item.numero), clean(item.gabarito)]));
          for (const [number, answer] of [[47,'Certo'],[52,'Errado'],[57,'Errado'],[107,'Errado'],[108,'Errado']]) {
            if (answers.get(number) !== answer) throw new Error(`Gabarito ${number}: ${answers.get(number)}; esperado ${answer}.`);
          }

          const catalogBytes = fs.readFileSync('data/release/catalogo.json');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          if (manifest.catalog_sha256 !== sha(catalogBytes)) throw new Error('Hash do catálogo diverge do manifesto.');
          for (const entry of manifest.materials || []) {
            const file = String(entry.file).replace(/^\.\//, '');
            const bytes = fs.readFileSync(file);
            if (entry.sha256 !== sha(bytes) || Number(entry.bytes) !== bytes.length) throw new Error(`Manifesto divergente em ${entry.id}.`);
          }
          console.log('✓ Catálogo cumulativo validado: 3046 preservadas + 115 CRFa-1 = 3161; 72 materiais; 49 pendentes; 2 discursivas.');
          NODE

      - name: Criar commit local da release sem publicar ainda
        id: release_source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/direct-deploy-crfa1-analista-115.yml
          git add data/release
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--cached', '--name-only'], {encoding: 'utf8'}).trim().split(/\n/).filter(Boolean);
          const invalid = changed.filter(file => file !== '.github/workflows/direct-deploy-crfa1-analista-115.yml' && !file.startsWith('data/release/'));
          if (invalid.length) throw new Error(`Arquivos fora do escopo do commit de release: ${invalid.join(', ')}`);
          console.log(`✓ Commit restrito a data/release + auto-remoção do workflow (${changed.length} arquivo(s)).`);
          NODE
          git commit -m 'Publicar diretamente 115 questões do CRFa-1 [skip ci]'
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "✓ Commit local candidato: ${RELEASE_SHA}; ainda não enviado à main."

      - name: Regerar dist para o SHA candidato e executar gates finais
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          set -euo pipefail
          rm -rf dist
          GITHUB_SHA="${RELEASE_SHA}" node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          CRFA_ROOT="${GITHUB_WORKSPACE}" node /tmp/validate-crfa1-analista-115-deploy.mjs dist "${RELEASE_SHA}"
          node scripts/validate-runtime-catalog.mjs
          node scripts/validate-public-metadata-consistency.mjs
          node --check assets/app-v4.js
          node --check service-worker.js
          echo '✓ Dist final validado antes de qualquer push da release.'

      - name: Enviar somente a release já validada à main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'A main avançou após o início da operação; release não será enviada.'
            exit 1
          fi
          git push origin HEAD:main
          echo "✓ Release validada enviada: $(git rev-parse HEAD)."

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar artefato validado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirmar metadados estáticos publicados
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${RELEASE_SHA}"

      - name: Confirmar 3161 e CRFa-1 no endereço público
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          node --input-type=module - <<'NODE'
          const base = new URL(process.env.PUBLIC_URL.endsWith('/') ? process.env.PUBLIC_URL : `${process.env.PUBLIC_URL}/`);
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const clean = value => String(value ?? '').trim();
          const blocked = [5,48,54,102,104];
          const prefix = 'PROVA-QDX-CRFA1-2026-ANALISTA-ADMINISTRATIVO-400-';
          let lastError;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              const stamp = `${Date.now()}-${attempt}`;
              const [buildResponse, catalogResponse] = await Promise.all([
                fetch(new URL(`data/release/build-info.json?audit=${stamp}`, base), {cache: 'no-store'}),
                fetch(new URL(`data/release/catalogo.json?audit=${stamp}`, base), {cache: 'no-store'}),
              ]);
              if (!buildResponse.ok || !catalogResponse.ok) throw new Error(`HTTP ${buildResponse.status}/${catalogResponse.status}`);
              const build = await buildResponse.json();
              const catalog = await catalogResponse.json();
              if (clean(build.source_sha) !== process.env.RELEASE_SHA) throw new Error(`source_sha ${build.source_sha}`);
              if (Number(build.questions) !== 3161 || Number(catalog.summary?.questoes) !== 3161) throw new Error(`total ${build.questions}/${catalog.summary?.questoes}`);
              if (Number(catalog.summary?.materiais) !== 72) throw new Error(`materiais ${catalog.summary?.materiais}`);
              const meta = (catalog.materials || []).find(item => clean(item.nome) === 'Analista Administrativo — CRFa-1 — Quadrix 2026');
              if (!meta || Number(meta.quantidade_questoes) !== 115) throw new Error('material CRFa-1 ausente ou incompleto');
              const materialUrl = new URL(String(meta.file).replace(/^\.\//, ''), base);
              materialUrl.searchParams.set('audit', stamp);
              const materialResponse = await fetch(materialUrl, {cache: 'no-store'});
              if (!materialResponse.ok) throw new Error(`material HTTP ${materialResponse.status}`);
              const material = await materialResponse.json();
              const questions = material.questoes || [];
              if (questions.length !== 115) throw new Error(`material contém ${questions.length}`);
              const codes = new Set(questions.map(item => clean(item.codigo)));
              for (const number of blocked) if (codes.has(`${prefix}${String(number).padStart(3,'0')}`)) throw new Error(`bloqueio ${number} publicado`);
              const answers = new Map(questions.map(item => [Number(item.numero_original ?? item.numero), clean(item.gabarito)]));
              for (const [number, answer] of [[47,'Certo'],[52,'Errado'],[57,'Errado'],[107,'Errado'],[108,'Errado']]) if (answers.get(number) !== answer) throw new Error(`gabarito ${number}=${answers.get(number)}`);
              console.log(`✓ Produção confirmada: 3161 questões; 72 materiais; CRFa-1 115/115; SHA ${process.env.RELEASE_SHA}.`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Tentativa pública ${attempt}/30: ${error.message}`);
              await sleep(5000);
            }
          }
          throw lastError || new Error('Produção não convergiu.');
          NODE

      - name: Fechar 115/115 no Notion pelo snapshot imutável
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
          CRFA_ROOT: ${{ github.workspace }}
        run: node /tmp/close-crfa1-analista-115-after-deploy.mjs

      - name: Registrar recibo durável de sucesso
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const receipt = {
            schema_version: '1.0',
            operation_id: 'CRFA1-2026-ANALISTA-400-115-20260807',
            status: 'success',
            release_code: `release-2.13.0:${process.env.RELEASE_SHA}`,
            release_sha: process.env.RELEASE_SHA,
            public_url: process.env.PUBLIC_URL,
            base_questions_preserved: 3046,
            published_records: 115,
            public_questions: 3161,
            public_materials: 72,
            master_bank: 3212,
            awaiting_audit: 49,
            discursive_display_items: 2,
            blocked_original_numbers: [5,48,54,102,104],
            snapshot_sha256: 'd1aa0e165dd0b2fb83e78ba75bda550d57f1f23f1ee5366f6fbab9c80c4e4b3d',
            plan_sha256: '2b49c85b2654a1094258385117648a5036f82bd2467279a25a5284a28628ed24',
            notion_closed: true,
            public_validation: true,
            permanent_automations_restored: false,
            failed_predeploy_candidates: [
              'caa32228a9522f44983b62e20bfaccee58f60551',
              'a74ef3a3a189547d3017ead65f4beeb0b61c1c30'
            ]
          };
          fs.writeFileSync('data/operations/crfa1-analista-115-deployment-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git add data/operations/crfa1-analista-115-deployment-receipt.json
          git commit -m 'Registrar publicação confirmada do CRFa-1 [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main

      - name: Resumo
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          echo "✓ CRFa-1 publicado: release-2.13.0:${RELEASE_SHA}"
          echo '✓ 3046 preservadas + 115 novas = 3161; 72 materiais; 5 bloqueios mantidos; 115/115 fechados no Notion.'
