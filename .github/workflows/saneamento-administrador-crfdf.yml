name: Saneamento Administrador CRF-DF

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/corrigir-faixa-83-120-crfdf.mjs'
      - '.github/workflows/saneamento-administrador-crfdf.yml'

permissions:
  contents: read

concurrency:
  group: saneamento-administrador-crfdf-20260731
  cancel-in-progress: false

jobs:
  saneamento:
    if: github.head_ref == 'agent/saneamento-administrador-crfdf-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validar sintaxe
        run: node --check scripts/corrigir-faixa-83-120-crfdf.mjs

      - name: Corrigir e bloquear o Banco Mestre
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/corrigir-faixa-83-120-crfdf.mjs

      - name: Preservar relatório antes e depois
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saneamento-administrador-crfdf-20260731
          path: artifacts/saneamento-administrador-crfdf-20260731.json
          if-no-files-found: error
          retention-days: 90
