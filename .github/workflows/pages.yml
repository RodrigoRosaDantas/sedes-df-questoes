name: Validar e publicar GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/notion/published.json'
      - 'data/notion/publication-plan.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/editorial-completion-2026-08-01.yml'
      - 'scripts/apply-editorial-completion.mjs'
      - 'scripts/assemble-editorial-operation.mjs'
      - 'data/editorial/**'
      - 'data/operations/editorial-completion-receipt.json'
      - 'data/operations/latest-deployment.json'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit exato do snapshot autorizado que deve ser publicado
        required: false
        type: string
      close_notion:
        description: Fechar a rastreabilidade editorial no Notion após o deploy aprovado
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.61.1
  PUBLICATION_PLAN_PATH: data/notion/publication-plan.json
  VALIDATED_DIST_ARTIFACT: validated-dist-${{ github.sha }}
  BASE_SNAPSHOT_COMMIT: c060ed9a6d4c46c637a5215b3a2738b28a8d405e

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Confirmar commit solicitado pela sincronização
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_SOURCE_SHA}" ] && [ "${REQUESTED_SOURCE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Commit solicitado ${REQUESTED_SOURCE_SHA} diverge do checkout ${GITHUB_SHA}."
            exit 1
          fi
          echo "✓ Build vinculado ao commit ${GITHUB_SHA} e ao snapshot versionado."
      - name: Exportar somente os saneamentos editoriais autorizados
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-editorial-platform-sync.mjs
          node scripts/export-pedagogia-editorial-sync.mjs
      - name: Preservar lote corrente e restaurar snapshot-base
        shell: bash
        run: |
          set -euo pipefail
          cp data/notion/published.json /tmp/current-publication-snapshot.json
          cp data/notion/publication-plan.json /tmp/current-publication-plan.json
          git fetch origin "${BASE_SNAPSHOT_COMMIT}" --depth=1
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/published.json" > data/notion/published.json
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/publication-plan.json" > data/notion/publication-plan.json
          echo '✓ Snapshot-base público restaurado apenas no workspace de validação.'
      - name: Gerar e validar aplicação, banco e base pública
        run: npm run check
      - name: Restaurar snapshot e plano do lote corrente
        run: |
          cp /tmp/current-publication-snapshot.json data/notion/published.json
          cp /tmp/current-publication-plan.json data/notion/publication-plan.json
          echo '✓ Lote corrente restaurado para adição e rastreabilidade.'
      - name: Instalar navegador de teste e auditar dependências
        run: |
          AUDIT_DIR=$(mktemp -d)
          printf '{"name":"sedes-ci-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          npm install --prefix "$AUDIT_DIR" --package-lock-only --ignore-scripts --save-dev "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --prefix "$AUDIT_DIR" --audit-level=high
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Testar a plataforma como usuário real
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/sedes-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test --grep-invert "publica somente as 50 questões autorizadas de Direito"
      - name: Acrescentar somente o lote validado de Direito
        run: node scripts/apply-publication-additions.mjs
      - name: Testar as 50 novas questões no navegador
        run: npx playwright test tests/publication-additions.spec.js
      - name: Acrescentar somente o lote validado de Biologia
        run: node scripts/apply-seedf-bio-24-addition.mjs
      - name: Testar as 24 novas questões de Biologia no navegador
        run: npx playwright test tests/seedf-bio-24-publication.spec.js
      - name: Acrescentar somente o lote validado de Biomedicina
        run: node scripts/apply-seedf-biomed-50-addition.mjs
      - name: Testar as 50 novas questões de Biomedicina no navegador
        run: npx playwright test tests/seedf-biomed-50-publication.spec.js
      - name: Acrescentar somente os 43 itens aptos de Eletrotécnica
        run: node scripts/apply-seedf-eletrot-43-addition.mjs
      - name: Testar as 43 novas questões de Eletrotécnica no navegador
        run: npx playwright test tests/seedf-eletrot-43-publication.spec.js
      - name: Acrescentar somente as 37 questões válidas de Orientador Social
        run: node scripts/apply-alto-paraiso-orientador-37-addition.mjs
      - name: Testar as 37 questões e os sete recursos visuais de Orientador Social
        run: npx playwright test tests/alto-paraiso-orientador-37-publication.spec.js
      - name: Preservar exatamente o pacote aprovado
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VALIDATED_DIST_ARTIFACT }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Recuperar o pacote já validado
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.VALIDATED_DIST_ARTIFACT }}
          path: dist
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Confirmar arquivos efetivamente publicados
        id: static_verify
        continue-on-error: true
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
      - name: Instalar Chromium para auditoria pública
        if: steps.static_verify.outcome == 'success'
        run: |
          AUDIT_DIR=$(mktemp -d)
          printf '{"name":"sedes-ci-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          npm install --prefix "$AUDIT_DIR" --package-lock-only --ignore-scripts --save-dev "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --prefix "$AUDIT_DIR" --audit-level=high
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Abrir e testar o endereço público
        id: browser_verify
        if: steps.static_verify.outcome == 'success'
        continue-on-error: true
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npx playwright test --config=playwright.public.config.js
      - name: Fechar somente os lotes do plano explícito no Notion
        id: traceability
        if: steps.static_verify.outcome == 'success' && steps.browser_verify.outcome == 'success' && inputs.close_notion == true
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
          PUBLICATION_PLAN_PATH: ${{ env.PUBLICATION_PLAN_PATH }}
        run: node scripts/dist-mark-notion-published.mjs
      - name: Solicitar registro independente do deploy
        if: steps.static_verify.outcome == 'success' && steps.browser_verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deployment-receipt.yml --ref main \
            -f source_sha="${SOURCE_SHA}" \
            -f public_url="${PUBLIC_URL}"
      - name: Acionar rollback para a última release aprovada
        if: steps.static_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rollback-deployment.mjs
      - name: Reprovar publicação inconsistente
        if: steps.static_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure' || steps.traceability.outcome == 'failure'
        env:
          STATIC_OUTCOME: ${{ steps.static_verify.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_verify.outcome }}
          TRACEABILITY_OUTCOME: ${{ steps.traceability.outcome }}
        run: |
          if [ "${TRACEABILITY_OUTCOME}" = 'failure' ] && [ "${STATIC_OUTCOME}" = 'success' ] && [ "${BROWSER_OUTCOME}" = 'success' ]; then
            echo "O conteúdo público passou na auditoria e foi preservado; a rastreabilidade idempotente deverá ser concluída no próximo ciclo."
          else
            echo "A publicação pública falhou e o rollback foi acionado."
          fi
          exit 1
