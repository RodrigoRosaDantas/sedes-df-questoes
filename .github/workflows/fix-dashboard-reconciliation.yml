name: Corrigir reconciliação intermediária do painel

on:
  push:
    branches: [main]
    paths:
      - 'data/operations/fix-dashboard-reconciliation-trigger.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: fix-dashboard-reconciliation
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Corrigir a validação das etapas intermediárias
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-public.mjs')
          text = path.read_text()
          old = '''    const reconciledActive = Number(cleanupReceipt.active_after);
              const completePublic = Number(cleanupReceipt.after_counts?.complete_public_records);
              if (cleanupReceipt.status !== "success"
                || Number(cleanupReceipt.target_count) !== 2088
                || Number(cleanupReceipt.remaining_active_count) !== 0
                || !Array.isArray(cleanupReceipt.failures)
                || cleanupReceipt.failures.length !== 0
                || completePublic !== questionCount
                || !Number.isInteger(reconciledActive)
                || reconciledActive < questionCount) {'''
          new = '''    const reconciledActive = Number(cleanupReceipt.active_after);
              const completePublic = Number(cleanupReceipt.after_counts?.complete_public_records);
              const publicCatalog = Number(cleanupReceipt.after_counts?.public_catalog);
              if (cleanupReceipt.status !== "success"
                || Number(cleanupReceipt.target_count) !== 2088
                || Number(cleanupReceipt.remaining_active_count) !== 0
                || !Array.isArray(cleanupReceipt.failures)
                || cleanupReceipt.failures.length !== 0
                || completePublic !== publicCatalog
                || questionCount > completePublic
                || !Number.isInteger(reconciledActive)
                || reconciledActive < questionCount) {'''
          if text.count(old) != 1:
              raise SystemExit(f'Trecho esperado encontrado {text.count(old)} vez(es), não exatamente uma.')
          path.write_text(text.replace(old, new))
          PY
          node --check scripts/build-public.mjs
          grep -F 'completePublic !== publicCatalog' scripts/build-public.mjs
          grep -F 'questionCount > completePublic' scripts/build-public.mjs

      - name: Versionar correção e disparar Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-dashboard-fix[bot]'
          git config user.email 'sedes-df-dashboard-fix[bot]@users.noreply.github.com'
          git add scripts/build-public.mjs
          git commit -m 'Corrigir validação intermediária do painel [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          SOURCE_SHA=$(git rev-parse HEAD)
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --ref main -f source_sha="${SOURCE_SHA}"

          RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=main&per_page=50" > /tmp/runs.json
            RUN_ID=$(jq -r --arg sha "${SOURCE_SHA}" --arg since "${DISPATCHED_AT}" '
              .workflow_runs[]
              | select(.name == "Validar e publicar GitHub Pages")
              | select(.event == "workflow_dispatch")
              | select(.head_sha == $sha)
              | select(.created_at >= $since)
              | .id
            ' /tmp/runs.json | head -n1)
            if [ -n "${RUN_ID}" ]; then break; fi
            sleep 5
          done
          if [ -z "${RUN_ID}" ]; then
            echo 'Execução de Pages não localizada.'
            exit 1
          fi

          mkdir -p data/editorial
          jq -n \
            --arg operation 'REFRESH-BANCO-MESTRE-DASHBOARD-20260804-R5' \
            --arg source_sha "${SOURCE_SHA}" \
            --argjson run_id "${RUN_ID}" \
            --arg dispatched_at "${DISPATCHED_AT}" \
            '{operation:$operation, source_sha:$source_sha, pages_run_id:$run_id, dispatched_at:$dispatched_at, expected:{banco_mestre:2946,questions:2871,awaiting_audit:75,materials:67}}' \
            > data/editorial/dashboard-reconciliation-fix-receipt.json
          git add data/editorial/dashboard-reconciliation-fix-receipt.json
          git commit -m 'Registrar nova execução do painel [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "✓ Correção ${SOURCE_SHA}; Pages run ${RUN_ID}."
