name: Validar e publicar GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.61.1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Ler snapshot atual do Banco Mestre
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs
      - name: Gerar e validar aplicação, banco e informações da prova
        run: npm run check
      - name: Instalar navegador de teste e auditar dependências
        run: |
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Testar a plataforma como usuário real
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/sedes-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Ler snapshot definitivo do Banco Mestre
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs
      - name: Gerar pacote final
        run: npm run build
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Confirmar arquivos efetivamente publicados
        id: static_verify
        continue-on-error: true
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
      - name: Instalar Chromium para auditoria pública
        if: steps.static_verify.outcome == 'success'
        run: |
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Abrir e testar o endereço público
        id: browser_verify
        if: steps.static_verify.outcome == 'success'
        continue-on-error: true
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npx playwright test --config=playwright.public.config.js
      - name: Fechar rastreabilidade dos novos lotes no Notion
        if: steps.static_verify.outcome == 'success' && steps.browser_verify.outcome == 'success'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/mark-notion-published.mjs
      - name: Acionar rollback para a última release aprovada
        if: steps.static_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rollback-deployment.mjs
      - name: Reprovar publicação inconsistente
        if: steps.static_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure'
        run: |
          echo "A publicação não passou na auditoria pública; o rollback foi acionado."
          exit 1
