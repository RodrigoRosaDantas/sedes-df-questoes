name: Diagnosticar coleta CFO e CRMV-GO

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-cfo-crmvgo-scrape-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-cfo-crmvgo-scrape-v2-20260807
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Coletar diagnóstico sem falhar a operação
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, traceback
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          exams = {
            'CFO': 'https://www.qconcursos.com/questoes-de-concursos/provas/quadrix-2025-cfo-tecnico-administrativo/questoes',
            'CRMVGO': 'https://www.qconcursos.com/questoes-de-concursos/provas/quadrix-2025-crmv-go-tecnico-administrativo/questoes',
          }
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'pt-BR,pt;q=0.9'})
          report={'schema_version':'1.0','status':'diagnostic','pages':[]}
          for exam, base in exams.items():
            for page in range(1,7):
              url = base if page == 1 else f'{base}?page={page}'
              row={'exam':exam,'page':page,'url':url}
              try:
                r=s.get(url,timeout=30)
                row['http_status']=r.status_code
                row['bytes']=len(r.content)
                row['content_type']=r.headers.get('content-type','')
                row['final_url']=r.url
                text=r.text
                row['contains_qconcursos']='qconcursos' in text.lower()
                raw_ids=re.findall(r'Q\d{6,9}',text)
                row['raw_unique_ids']=list(dict.fromkeys(raw_ids))[:40]
                row['raw_unique_count']=len(set(raw_ids))
                soup=BeautifulSoup(text,'lxml')
                plain=soup.get_text('\n',strip=True)
                text_ids=re.findall(r'Q\d{6,9}',plain)
                row['text_unique_ids']=list(dict.fromkeys(text_ids))[:40]
                row['text_unique_count']=len(set(text_ids))
                row['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                row['sample_text']=' '.join(plain.split())[:500]
              except Exception as e:
                row['error']=f'{type(e).__name__}: {e}'
                row['traceback']=traceback.format_exc()[-1500:]
              report['pages'].append(row)
          Path('data/operations').mkdir(parents=True,exist_ok=True)
          Path('data/operations/cfo-crmvgo-scrape-diagnostic-20260807.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Persistir diagnóstico e auto-remover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-audit[bot]'
          git config user.email 'sedes-df-audit[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-cfo-crmvgo-scrape-once.yml
          git add data/operations/cfo-crmvgo-scrape-diagnostic-20260807.json
          git commit -m 'Registrar diagnóstico da coleta CFO e CRMV-GO [skip ci]'
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'A main avançou; diagnóstico não será enviado.'; exit 1; }
          git push origin HEAD:main
