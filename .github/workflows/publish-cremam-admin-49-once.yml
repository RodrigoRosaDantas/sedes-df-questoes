name: Publicar Administrador CREMAM — 49 questões

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-cremam-admin-49-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-cremam-admin-49-20260807
  cancel-in-progress: false

env:
  LOT: CREMAM-2025-ADMINISTRADOR-400-49-20260807
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Preservar fechador e congelar baseline
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/close-cremam-admin-49.mjs /tmp/close-cremam-admin-49.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json','utf8'));
          const ids = Object.keys(catalog.question_index || {}).sort();
          if (ids.length !== 3161 || (catalog.materials || []).length !== 72) throw new Error('Baseline pública não é 3161/72.');
          if (Number(catalog.summary?.banco_mestre) !== 3212 || Number(catalog.summary?.aguardando_auditoria) !== 49 || Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error('Resumo da baseline divergente.');
          if ((catalog.materials || []).some(item => String(item.nome || '').trim() === 'Administrador — CREMAM — Quadrix 2025')) throw new Error('Material CREMAM Administrador já existe no catálogo.');
          fs.writeFileSync('/tmp/cremam-base-ids.json', JSON.stringify(ids));
          console.log('✓ Baseline congelada: 3161 questões, 72 materiais, 49 pendentes.');
          NODE

      - name: Preparar 49 registros e pacote imutável
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/prepare-cremam-admin-49.mjs
          node scripts/create-publication-plan.mjs
          cp data/notion/publication-plan.json data/notion/publication-additions/cremam-administrador-49-plan.json
          test "$(jq -r '.schema_version' data/notion/published.json)" = '1.3'
          test "$(jq -r '.scope_mode' data/notion/published.json)" = 'additions'
          test "$(jq '.records | length' data/notion/published.json)" = '49'
          test "$(jq '.total_records' data/notion/publication-plan.json)" = '49'
          test "$(jq '.lots | length' data/notion/publication-plan.json)" = '1'
          test "$(jq -r '.lots[0].lot' data/notion/publication-plan.json)" = "$LOT"
          SNAP=$(sha256sum data/notion/publication-additions/cremam-administrador-49.json | awk '{print $1}')
          PLAN=$(sha256sum data/notion/publication-additions/cremam-administrador-49-plan.json | awk '{print $1}')
          jq --arg snapshot "$SNAP" --arg plan "$PLAN" '.snapshot_sha256=$snapshot | .plan_sha256=$plan' data/operations/cremam-administrador-49-preparation-receipt.json > /tmp/r.json
          mv /tmp/r.json data/operations/cremam-administrador-49-preparation-receipt.json

      - name: Aplicar pacote sobre catálogo cumulativo
        run: |
          set -euo pipefail
          node scripts/apply-notion-snapshot.mjs
          node scripts/apply-discursive-display.mjs
          node scripts/build-study-index.mjs
          GITHUB_SHA="${GITHUB_SHA}" node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          rm -rf data/release
          cp -a dist/data/release data/release

      - name: Validar delta 3161 → 3210 e conteúdo CREMAM
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const clean = value => String(value ?? '').trim();
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/release/manifest.json','utf8'));
          const snapshot = JSON.parse(fs.readFileSync('data/notion/publication-additions/cremam-administrador-49.json','utf8'));
          const base = JSON.parse(fs.readFileSync('/tmp/cremam-base-ids.json','utf8'));
          const finalIds = new Set(Object.keys(catalog.question_index || {}));
          const missing = base.filter(id => !finalIds.has(id));
          if (missing.length) throw new Error(`IDs anteriores perdidos: ${missing.slice(0,5).join(',')}`);
          if (base.length !== 3161 || finalIds.size !== 3210 || finalIds.size - base.length !== 49) throw new Error(`Delta divergente ${base.length}→${finalIds.size}.`);
          if ((catalog.materials || []).length !== 73) throw new Error(`Materiais ${(catalog.materials || []).length}; esperado 73.`);
          if (Number(catalog.summary?.banco_mestre) !== 3212 || Number(catalog.summary?.aguardando_auditoria) !== 0 || Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error(`Resumo divergente: ${JSON.stringify(catalog.summary)}`);
          const meta = (catalog.materials || []).find(item => clean(item.nome) === 'Administrador — CREMAM — Quadrix 2025');
          if (!meta || Number(meta.quantidade_questoes) !== 49) throw new Error('Material CREMAM ausente/incompleto.');
          const material = JSON.parse(fs.readFileSync(String(meta.file).replace(/^\.\//,''),'utf8'));
          const questions = material.questoes || [];
          const expected = Array.from({length:50},(_,i)=>i+1).filter(n=>n!==3);
          const numbers = questions.map(q => Number(q.numero_original ?? q.numero));
          if (JSON.stringify(numbers) !== JSON.stringify(expected)) throw new Error(`Sequência divergente: ${numbers.join(',')}`);
          const byCode = new Map(questions.map(q => [clean(q.codigo), q]));
          for (const record of snapshot.records || []) {
            const q = byCode.get(clean(record.code));
            if (!q || clean(q.gabarito) !== clean(record.answer) || clean(q.enunciado) !== clean(record.prompt)) throw new Error(`${record.code}: publicação divergiu do snapshot.`);
          }
          const q3 = questions.find(q => Number(q.numero_original ?? q.numero) === 3);
          if (q3) throw new Error('Questão 3 anulada entrou no material.');
          const q11 = questions.find(q => Number(q.numero_original ?? q.numero) === 11);
          if (!q11?.enunciado?.includes('PREÇO (EM REAIS) | FREQUÊNCIA (%)') || clean(q11.gabarito) !== 'D') throw new Error('Questão 11 perdeu tabela ou gabarito.');
          const q47 = questions.find(q => Number(q.numero_original ?? q.numero) === 47);
          if (clean(q47?.gabarito) !== 'C') throw new Error('Questão 47 com gabarito divergente.');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const catalogBytes = fs.readFileSync('data/release/catalogo.json');
          if (manifest.catalog_sha256 !== sha(catalogBytes)) throw new Error('Hash do catálogo divergente.');
          for (const entry of manifest.materials || []) {
            const bytes = fs.readFileSync(String(entry.file).replace(/^\.\//,''));
            if (entry.sha256 !== sha(bytes) || Number(entry.bytes) !== bytes.length) throw new Error(`Manifesto divergente: ${entry.id}`);
          }
          console.log('✓ 3161 IDs preservados + 49 CREMAM = 3210; 73 materiais; 0 pendências.');
          NODE

      - name: Criar commit local da release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-cremam-admin-49-once.yml scripts/prepare-cremam-admin-49.mjs scripts/close-cremam-admin-49.mjs
          git add data/notion/published.json data/notion/publication-plan.json data/notion/publication-additions/cremam-administrador-49.json data/notion/publication-additions/cremam-administrador-49-plan.json data/release data/operations/cremam-administrador-49-preparation-receipt.json
          git commit -m 'Publicar 49 questões de Administrador do CREMAM [skip ci]'
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "✓ Candidato local $SHA; ainda não enviado à main."

      - name: Regerar e validar dist para o SHA da release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf dist
          GITHUB_SHA="$RELEASE_SHA" node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          node scripts/validate-runtime-catalog.mjs
          node scripts/validate-public-metadata-consistency.mjs
          test "$(jq '.questions' dist/data/release/build-info.json)" = '3210'
          test "$(jq -r '.source_sha' dist/data/release/build-info.json)" = "$RELEASE_SHA"
          test "$(jq '.summary.questoes' dist/data/release/catalogo.json)" = '3210'
          test "$(jq '.summary.materiais' dist/data/release/catalogo.json)" = '73'
          test "$(jq '.summary.aguardando_auditoria' dist/data/release/catalogo.json)" = '0'
          echo '✓ Dist final validado antes do push.'

      - name: Enviar release validada à main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'A main avançou; abortando.'; exit 1; }
          git push origin HEAD:main

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Validar endereço público
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          node scripts/verify-deployment.mjs "$PUBLIC_URL" "$RELEASE_SHA"
          node --input-type=module - <<'NODE'
          const base = new URL(process.env.PUBLIC_URL.endsWith('/') ? process.env.PUBLIC_URL : `${process.env.PUBLIC_URL}/`);
          const clean = value => String(value ?? '').trim();
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let success = false, last = '';
          for (let attempt=1; attempt<=30; attempt+=1) {
            try {
              const stamp = `${Date.now()}-${attempt}`;
              const [b,c] = await Promise.all([
                fetch(new URL(`data/release/build-info.json?x=${stamp}`,base),{cache:'no-store'}).then(r=>r.json()),
                fetch(new URL(`data/release/catalogo.json?x=${stamp}`,base),{cache:'no-store'}).then(r=>r.json()),
              ]);
              if (clean(b.source_sha) !== process.env.RELEASE_SHA || Number(b.questions) !== 3210 || Number(c.summary?.questoes) !== 3210 || Number(c.summary?.materiais) !== 73 || Number(c.summary?.aguardando_auditoria) !== 0) throw new Error(`metadados ${b.source_sha}/${b.questions}/${c.summary?.questoes}`);
              const meta = (c.materials || []).find(item => clean(item.nome) === 'Administrador — CREMAM — Quadrix 2025');
              if (!meta || Number(meta.quantidade_questoes) !== 49) throw new Error('material CREMAM ausente');
              const u = new URL(String(meta.file).replace(/^\.\//,''),base); u.searchParams.set('x',stamp);
              const m = await fetch(u,{cache:'no-store'}).then(r=>r.json());
              const nums = (m.questoes || []).map(q=>Number(q.numero_original ?? q.numero));
              if (nums.length !== 49 || nums.includes(3) || !nums.includes(11) || !nums.includes(47) || !nums.includes(50)) throw new Error(`sequência pública ${nums.join(',')}`);
              success = true; break;
            } catch (error) { last = error.message; await sleep(10000); }
          }
          if (!success) throw new Error(`Validação pública falhou: ${last}`);
          console.log('✓ Site público confirmado em 3210/73 com CREMAM 49/49.');
          NODE

      - name: Fechar 49/49 no Notion sem fórmula viva
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ steps.release.outputs.sha }}
          NOTION_SNAPSHOT_PATH: data/notion/publication-additions/cremam-administrador-49.json
          PUBLICATION_PLAN_PATH: data/notion/publication-additions/cremam-administrador-49-plan.json
        run: node /tmp/close-cremam-admin-49.mjs

      - name: Gravar recibo final e fechar operação
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          SNAP=$(sha256sum data/notion/publication-additions/cremam-administrador-49.json | awk '{print $1}')
          PLAN=$(sha256sum data/notion/publication-additions/cremam-administrador-49-plan.json | awk '{print $1}')
          jq -n --arg release "$RELEASE_SHA" --arg url "$PUBLIC_URL" --arg snapshot "$SNAP" --arg plan "$PLAN" --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{schema_version:"1.0",operation_id:"CREMAM-2025-ADMINISTRADOR-400-49-20260807",status:"success",release_sha:$release,release_code:("release-2.13.0:"+$release),public_url:$url,confirmed_at:$confirmed_at,baseline_questions:3161,published_records:49,public_questions:3210,public_materials:73,master_bank:3212,awaiting_audit:0,discursive_display_items:2,excluded_original_numbers:[3],snapshot_sha256:$snapshot,plan_sha256:$plan,notion_closed:true,public_validation:true,live_publish_formula_rechecked_after_deploy:false,permanent_automations_restored:false}' > data/operations/cremam-administrador-49-deployment-receipt.json
          git add data/operations/cremam-administrador-49-deployment-receipt.json
          git commit -m 'Registrar publicação confirmada do CREMAM 49/49 [skip ci]'
          git push origin HEAD:main
