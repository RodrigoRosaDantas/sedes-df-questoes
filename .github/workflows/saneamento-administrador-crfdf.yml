name: Saneamento Administrador CRF-DF

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inspecionar-publicacao-administrador-crfdf.mjs'
      - '.github/workflows/saneamento-administrador-crfdf.yml'

permissions:
  contents: read

concurrency:
  group: saneamento-administrador-crfdf-20260731
  cancel-in-progress: false

jobs:
  saneamento:
    if: github.head_ref == 'agent/saneamento-administrador-crfdf-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Inspecionar catálogo público
        run: node scripts/inspecionar-publicacao-administrador-crfdf.mjs
