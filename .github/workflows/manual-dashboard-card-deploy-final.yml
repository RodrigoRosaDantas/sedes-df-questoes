name: Publicar manualmente correção do cartão Banco Mestre

on:
  push:
    branches: [manual-dashboard-card-deploy-final]
    paths:
      - 'data/operations/manual-dashboard-card-deploy-final-trigger.json'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: manual-dashboard-card-deploy-final
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.61.1
  PUBLICATION_PLAN_PATH: data/notion/publication-plan.json
  VALIDATED_DIST_ARTIFACT: validated-dist-${{ github.sha }}
  BASE_SNAPSHOT_COMMIT: c060ed9a6d4c46c637a5215b3a2738b28a8d405e
  PUBLIC_URL: https://rodrigorosadantas.github.io/sedes-df-questoes/

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Confirmar escopo manual e alinhar validadores no workspace
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'manual-dashboard-card-deploy-final'
          test "$(jq -r '.status' data/operations/manual-dashboard-card-deploy-final-trigger.json)" = 'authorized'
          test "$(jq -r '.expected.banco_mestre' data/operations/manual-dashboard-card-deploy-final-trigger.json)" = '2946'
          test "$(jq -r '.expected.questions' data/operations/manual-dashboard-card-deploy-final-trigger.json)" = '2871'
          test "$(jq -r '.expected.awaiting_audit' data/operations/manual-dashboard-card-deploy-final-trigger.json)" = '75'
          rm -f .github/workflows/manual-dashboard-card-deploy-final.yml
          MATCHES=$(git grep -l 'app-v4.js?v=8' || true)
          if [ -n "${MATCHES}" ]; then
            while IFS= read -r file; do
              [ -z "${file}" ] && continue
              sed -i 's/app-v4\.js?v=8/app-v4.js?v=9/g' "${file}"
            done <<< "${MATCHES}"
          fi
          if git grep -n 'app-v4.js?v=8'; then
            echo 'Referência antiga v8 remanescente.'
            exit 1
          fi
          grep -F 'const RELEASE_META_URL = "./data/release/release-meta.json";' assets/app-v4.js
          grep -F 'state.releaseMeta?.banco_mestre' assets/app-v4.js
          grep -F 'app-v4.js?v=9' index.html service-worker.js scripts/build-public.mjs
          echo "✓ Escopo manual e aplicação v9 confirmados no commit ${GITHUB_SHA}."

      - name: Exportar somente saneamentos editoriais autorizados
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node scripts/export-editorial-platform-sync.mjs
          node scripts/export-pedagogia-editorial-sync.mjs

      - name: Preservar lote corrente e restaurar snapshot-base
        shell: bash
        run: |
          set -euo pipefail
          cp data/notion/published.json /tmp/current-publication-snapshot.json
          cp data/notion/publication-plan.json /tmp/current-publication-plan.json
          git fetch origin "${BASE_SNAPSHOT_COMMIT}" --depth=1
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/published.json" > data/notion/published.json
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/publication-plan.json" > data/notion/publication-plan.json
          echo '✓ Snapshot-base restaurado somente no workspace.'

      - name: Gerar e validar aplicação, banco e base pública
        run: npm run check

      - name: Restaurar snapshot e plano do lote corrente
        run: |
          cp /tmp/current-publication-snapshot.json data/notion/published.json
          cp /tmp/current-publication-plan.json data/notion/publication-plan.json
          echo '✓ Lote corrente restaurado para as adições imutáveis.'

      - name: Instalar Chromium e auditar dependências
        run: |
          AUDIT_DIR=$(mktemp -d)
          printf '{"name":"sedes-ci-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          npm install --prefix "$AUDIT_DIR" --package-lock-only --ignore-scripts --save-dev "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --prefix "$AUDIT_DIR" --audit-level=high
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Testar a plataforma como usuário real
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/sedes-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test --grep-invert "publica somente as 50 questões autorizadas de Direito"

      - name: Acrescentar e testar o lote validado de Direito
        run: |
          node scripts/apply-publication-additions.mjs
          npx playwright test tests/publication-additions.spec.js

      - name: Acrescentar e testar o lote validado de Biologia
        run: |
          node scripts/apply-seedf-bio-24-addition.mjs
          npx playwright test tests/seedf-bio-24-publication.spec.js

      - name: Acrescentar e testar o lote validado de Biomedicina
        run: |
          node scripts/apply-seedf-biomed-50-addition.mjs
          npx playwright test tests/seedf-biomed-50-publication.spec.js

      - name: Acrescentar e testar os itens aptos de Eletrotécnica
        run: |
          node scripts/apply-seedf-eletrot-43-addition.mjs
          npx playwright test tests/seedf-eletrot-43-publication.spec.js

      - name: Acrescentar e testar Orientador Social
        run: |
          node scripts/apply-alto-paraiso-orientador-37-addition.mjs
          npx playwright test tests/alto-paraiso-orientador-37-publication.spec.js

      - name: Acrescentar e testar Agente Fiscal
        run: |
          node scripts/apply-crefito17-agentefiscal-62-addition.mjs
          npx playwright test tests/crefito17-agentefiscal-62-publication.spec.js

      - name: Acrescentar e testar Contador
        shell: bash
        run: |
          set -euo pipefail
          test -f data/notion/publication-additions/crbm6-contador-70.json
          test -f data/notion/publication-additions/crbm6-contador-70-plan.json
          node scripts/apply-crbm6-contador-70-addition.mjs
          npx playwright test tests/crbm6-contador-70-publication.spec.js

      - name: Confirmar metadados finais antes do deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.banco_mestre' dist/data/release/release-meta.json)" = '2946'
          test "$(jq -r '.questions' dist/data/release/release-meta.json)" = '2871'
          test "$(jq -r '.awaiting_audit' dist/data/release/release-meta.json)" = '75'
          test "$(jq -r '.materials' dist/data/release/release-meta.json)" = '67'
          test "$(jq -r '.source_sha' dist/data/release/release-meta.json)" = "${GITHUB_SHA}"
          echo '✓ Pacote final: 2.946 / 2.871 / 75 / 67.'

      - name: Preservar exatamente o pacote aprovado
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VALIDATED_DIST_ARTIFACT }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Recuperar pacote validado
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.VALIDATED_DIST_ARTIFACT }}
          path: dist

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirmar arquivos publicados
        id: static_verify
        continue-on-error: true
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"

      - name: Instalar Chromium para auditoria pública
        if: steps.static_verify.outcome == 'success'
        run: |
          AUDIT_DIR=$(mktemp -d)
          printf '{"name":"sedes-public-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          npm install --prefix "$AUDIT_DIR" --package-lock-only --ignore-scripts --save-dev "@playwright/test@${PLAYWRIGHT_VERSION}"
          npm audit --prefix "$AUDIT_DIR" --audit-level=high
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Executar suíte pública oficial
        id: browser_verify
        if: steps.static_verify.outcome == 'success'
        continue-on-error: true
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npx playwright test --config=playwright.public.config.js

      - name: Confirmar cartão Banco Mestre no navegador
        id: card_verify
        if: steps.static_verify.outcome == 'success' && steps.browser_verify.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium} = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({serviceWorkers: 'block'});
            const url = new URL(process.env.DEPLOYED_URL);
            url.searchParams.set('manual_dashboard_card', Date.now().toString());
            await page.goto(url.href, {waitUntil: 'networkidle', timeout: 120000});
            await page.locator('.bank-status strong').first().waitFor({state: 'visible', timeout: 60000});
            const raw = await page.locator('.bank-status strong').allTextContents();
            const values = raw.slice(0, 3).map(value => value.replace(/\D/g, ''));
            const expected = ['2946', '2871', '75'];
            if (JSON.stringify(values) !== JSON.stringify(expected)) {
              throw new Error(`Cartão divergente: ${JSON.stringify(raw)} => ${JSON.stringify(values)}`);
            }
            const metaResponse = await page.request.get(new URL('data/release/release-meta.json', url).href, {headers: {'cache-control':'no-cache, no-store'}});
            if (!metaResponse.ok()) throw new Error(`release-meta HTTP ${metaResponse.status()}`);
            const meta = await metaResponse.json();
            if (meta.banco_mestre !== 2946 || meta.questions !== 2871 || meta.awaiting_audit !== 75 || meta.materials !== 67) {
              throw new Error(`release-meta divergente: ${JSON.stringify(meta)}`);
            }
            console.log(`✓ Cartão público confirmado: ${raw.slice(0, 3).join(' / ')}.`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Acionar rollback em caso de inconsistência
        if: steps.static_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure' || steps.card_verify.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rollback-deployment.mjs

      - name: Reprovar deploy inconsistente
        if: steps.static_verify.outcome == 'failure' || steps.browser_verify.outcome == 'failure' || steps.card_verify.outcome == 'failure'
        run: |
          echo 'A publicação manual falhou na auditoria e o rollback foi acionado.'
          exit 1

      - name: Registrar recibo na main suspensa
        if: steps.static_verify.outcome == 'success' && steps.browser_verify.outcome == 'success' && steps.card_verify.outcome == 'success'
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C manual-receipt origin/main
          test "$(head -n 1 .github/workflows/pages.yml)" = 'name: Validar e publicar GitHub Pages — SUSPENSO'
          mkdir -p data/operations
          CONFIRMED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg operation 'MANUAL-DASHBOARD-CARD-DEPLOY-20260805' \
            --arg status 'success' \
            --arg confirmed_at "${CONFIRMED_AT}" \
            --arg public_url "${DEPLOYED_URL}" \
            --arg source_sha "${GITHUB_SHA}" \
            --argjson workflow_run_id "${GITHUB_RUN_ID}" \
            '{schema_version:"1.0",operation:$operation,status:$status,confirmed_at:$confirmed_at,public_url:$public_url,source_sha:$source_sha,workflow_run_id:$workflow_run_id,dashboard:{banco_mestre:2946,available_on_site:2871,awaiting_editorial_audit:75,materials:67},verification:{build_and_checks:"success",immutable_packages:"success",static_deployment:"success",public_browser_suite:"success",public_dashboard_card:"success"},controls:{notion_write:false,catalog_content_changed:false,main_pages_remained_suspended:true,other_automations_remained_suspended:true}}' \
            > data/operations/manual-dashboard-card-deploy-receipt.json
          if [ -f data/operations/latest-deployment.json ]; then
            jq \
              --arg confirmed_at "${CONFIRMED_AT}" \
              --arg public_url "${DEPLOYED_URL%/}" \
              --arg source_sha "${GITHUB_SHA}" \
              '.schema_version="1.2" | .confirmed_at=$confirmed_at | .public_url=$public_url | .source_sha=$source_sha | .questions=2871 | .materials=67 | .dashboard={banco_mestre:2946,available_on_site:2871,awaiting_editorial_audit:75} | .verification.static_files="success" | .verification.public_browser="success" | .verification.public_dashboard_card="success" | .verification.public_metadata_refetched="success" | .automation_mode="manual_only_suspended"' \
              data/operations/latest-deployment.json > /tmp/latest.json
            mv /tmp/latest.json data/operations/latest-deployment.json
          fi
          git config user.name 'sedes-df-manual-deploy[bot]'
          git config user.email 'sedes-df-manual-deploy[bot]@users.noreply.github.com'
          git add data/operations/manual-dashboard-card-deploy-receipt.json data/operations/latest-deployment.json
          git commit -m 'Registrar deploy manual confirmado do cartão [skip ci]'
          git push origin HEAD:main
          echo '✓ Recibo gravado na main; automações permaneceram suspensas.'
