name: Registrar status do redeploy manual

on:
  push:
    branches: [main]
    paths:
      - data/operations/record-manual-contract-run-trigger.json

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Localizar execução
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: 866a7bb57f53a758c1d9929a224b58dd619c78b1
        shell: bash
        run: |
          set -euo pipefail
          RUN=''
          for i in {1..30}; do
            RUN=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-contract-redeploy-once.yml/runs?branch=main&event=push&per_page=20" \
              | jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha==$sha)' | head -n 1)
            [ -n "$RUN" ] && break
            sleep 5
          done
          [ -n "$RUN" ] || { echo 'Execução não localizada.'; exit 1; }
          mkdir -p data/operations
          jq -n --argjson run "$RUN" '{queried_at:(now|todateiso8601),run:{id:$run.id,status:$run.status,conclusion:$run.conclusion,head_sha:$run.head_sha,created_at:$run.created_at,updated_at:$run.updated_at,html_url:$run.html_url}}' > data/operations/manual-contract-redeploy-run.json
          git config user.name 'sedes-contract-status[bot]'
          git config user.email 'sedes-contract-status[bot]@users.noreply.github.com'
          git add data/operations/manual-contract-redeploy-run.json
          git commit -m 'Registrar execução do redeploy manual [skip ci]'
          git push origin HEAD:main
