name: Publicar GitHub Pages — autorização controlada

on:
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-controlled
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: 1.61.1
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes/
  AUTHORIZED_SOURCE_SHA: ${{ github.sha }}
  AUTHORIZED_REF: ${{ github.ref_name }}

jobs:
  validate-deploy-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       github.event.issue.title == '[deploy-pages]' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar autorização controlada e fixar o commit
        shell: bash
        run: |
          set -euo pipefail
          test "${AUTHORIZED_REF}" = "main"
          [[ "${AUTHORIZED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            ISSUE_BODY_SHA="$(jq -r '.issue.body // ""' "${GITHUB_EVENT_PATH}" | sed -n 's/^authorized_sha=\([0-9a-f]\{40\}\)$/\1/p' | head -n1)"
            test "${ISSUE_BODY_SHA}" = "${AUTHORIZED_SOURCE_SHA}"
          fi
          echo "✓ Publicação autorizada da main ${AUTHORIZED_SOURCE_SHA}."
      - name: Baixar exatamente o commit autorizado
        uses: actions/checkout@v6
        with:
          ref: ${{ env.AUTHORIZED_SOURCE_SHA }}
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Confirmar identidade do checkout
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          test "${CURRENT_SHA}" = "${AUTHORIZED_SOURCE_SHA}"
          echo "✓ Checkout fixado no commit autorizado ${CURRENT_SHA}."
      - name: Gerar e auditar o artefato público sem alterar a release
        env:
          RELEASE_SOURCE_SHA: ${{ env.AUTHORIZED_SOURCE_SHA }}
        run: npm run check
      - name: Instalar navegador de teste isoladamente
        shell: bash
        run: |
          set -euo pipefail
          npm --cache "${RUNNER_TEMP}/npm-cache" install --no-save --package-lock=false "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Executar a suíte pública contra o artefato local
        env:
          EXPECTED_SHA: ${{ env.AUTHORIZED_SOURCE_SHA }}
          PUBLIC_BASE_URL: http://127.0.0.1:4173/
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >"${RUNNER_TEMP}/sedes-local-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx playwright test --config=playwright.public.config.js --workers=1 --retries=0
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Enviar o artefato aprovado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar o artefato aprovado
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Repetir a suíte completa no endereço público
        env:
          EXPECTED_SHA: ${{ env.AUTHORIZED_SOURCE_SHA }}
        run: npx playwright test --config=playwright.public.config.js --workers=1 --retries=0
      - name: Confirmar metadados, PWA, catálogo e commit servidos
        env:
          EXPECTED_SOURCE_SHA: ${{ env.AUTHORIZED_SOURCE_SHA }}
        run: node scripts/verify-deployment.mjs "${PUBLIC_BASE_URL}" "${EXPECTED_SOURCE_SHA}"
