name: Inspecionar segunda execução dos 75 registros — temporário

on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-remaining-75-run-v2-once.yml]

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Consultar execuções
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/operations
          gh api '/repos/RodrigoRosaDantas/sedes-df-questoes/actions/workflows/publish-remaining-75-once.yml/runs?per_page=5' \
            --jq '{checked_at: now|todate, total_count, runs:[.workflow_runs[]|{id,name,status,conclusion,event,head_sha,created_at,updated_at,html_url,run_attempt}]}' \
            > data/operations/remaining-75-run-status-v2.json
      - name: Registrar e remover inspetor
        run: |
          rm -f .github/workflows/inspect-remaining-75-run-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/operations/remaining-75-run-status-v2.json .github/workflows/inspect-remaining-75-run-v2-once.yml
          git commit -m 'Registrar segunda execução dos 75 registros [skip ci]'
          git push origin HEAD:main
