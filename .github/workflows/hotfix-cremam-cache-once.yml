name: Hotfix CREMAM no catálogo — temporário

on:
  push:
    branches: [agent/hotfix-cremam-cache-20260805]
    paths: [.github/workflows/hotfix-cremam-cache-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hotfix-cremam-cache-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Renovar cache do catálogo e do aplicativo
        run: |
          python - <<'PY'
          from pathlib import Path
          token = '3048-2971-69-r2'
          app = Path('assets/app-v4.js')
          text = app.read_text()
          text = text.replace('const CATALOG_URL = "./data/release/catalogo.json";', f'const CATALOG_URL = "./data/release/catalogo.json?release={token}";')
          text = text.replace('const RELEASE_META_URL = "./data/release/release-meta.json";', f'const RELEASE_META_URL = "./data/release/release-meta.json?release={token}";')
          text = text.replace('const STUDY_INDEX_URL = "./data/release/study-index.json";', f'const STUDY_INDEX_URL = "./data/release/study-index.json?release={token}";')
          app.write_text(text)

          index = Path('index.html')
          index.write_text(index.read_text().replace('./assets/app-v4.js?v=9', './assets/app-v4.js?v=10'))

          worker = Path('service-worker.js')
          text = worker.read_text()
          text = text.replace('const CACHE_VERSION = "sedes-questoes-v2-13-0";', 'const CACHE_VERSION = "sedes-questoes-v2-13-0-r2";')
          text = text.replace('./assets/app-v4.js?v=9', './assets/app-v4.js?v=10')
          text = text.replace('"./data/release/catalogo.json", "./data/release/study-index.json", "./data/release/build-info.json", "./data/release/release-meta.json"', f'"./data/release/catalogo.json?release={token}", "./data/release/study-index.json?release={token}", "./data/release/build-info.json?release={token}", "./data/release/release-meta.json?release={token}"')
          worker.write_text(text)
          PY
      - name: Validar as duas provas e a sintaxe
        run: |
          node --check assets/app-v4.js
          node --check service-worker.js
          test "$(jq '[.materials[] | select(.id == "notion-analista-i-atendimento-e-cobranca-cra-sp-quadrix-2025" and .quantidade_questoes == 50)] | length' data/release/catalogo.json)" = 1
          test "$(jq '[.materials[] | select(.id == "notion-assistente-administrativo-cremam-quadrix-2025" and .quantidade_questoes == 50)] | length' data/release/catalogo.json)" = 1
          grep -q 'catalogo.json?release=3048-2971-69-r2' assets/app-v4.js
          grep -q 'app-v4.js?v=10' index.html
          grep -q 'sedes-questoes-v2-13-0-r2' service-worker.js
      - name: Versionar e remover o mecanismo temporário
        run: |
          rm -f .github/workflows/hotfix-cremam-cache-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app-v4.js index.html service-worker.js .github/workflows/hotfix-cremam-cache-once.yml
          git commit -m 'Corrigir cache para exibir as duas provas Quadrix'
          git push origin HEAD:agent/hotfix-cremam-cache-20260805
