name: Disparar reconciliação do painel

on:
  push:
    branches: [main]
    paths:
      - 'data/operations/refresh-banco-mestre-dispatch-trigger.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: dispatch-dashboard-reconciliation
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Disparar Pages e registrar execução
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --ref main

          RUN_ID=''
          HEAD_SHA=''
          STATUS=''
          CONCLUSION=''
          CREATED_AT=''
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=main&per_page=50" > /tmp/runs.json
            RUN_ID=$(jq -r --arg since "${DISPATCHED_AT}" '
              .workflow_runs[]
              | select(.name == "Validar e publicar GitHub Pages")
              | select(.event == "workflow_dispatch")
              | select(.created_at >= $since)
              | .id
            ' /tmp/runs.json | head -n1)
            if [ -n "${RUN_ID}" ]; then
              HEAD_SHA=$(jq -r --argjson id "${RUN_ID}" '.workflow_runs[] | select(.id == $id) | .head_sha' /tmp/runs.json)
              STATUS=$(jq -r --argjson id "${RUN_ID}" '.workflow_runs[] | select(.id == $id) | .status' /tmp/runs.json)
              CONCLUSION=$(jq -r --argjson id "${RUN_ID}" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")' /tmp/runs.json)
              CREATED_AT=$(jq -r --argjson id "${RUN_ID}" '.workflow_runs[] | select(.id == $id) | .created_at' /tmp/runs.json)
              break
            fi
            sleep 5
          done

          if [ -z "${RUN_ID}" ]; then
            echo 'A execução de Pages não foi criada.'
            exit 1
          fi

          mkdir -p data/editorial
          jq -n \
            --arg operation 'REFRESH-BANCO-MESTRE-DASHBOARD-20260804-R4' \
            --arg dispatched_at "${DISPATCHED_AT}" \
            --argjson run_id "${RUN_ID}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg status "${STATUS}" \
            --arg conclusion "${CONCLUSION}" \
            --arg created_at "${CREATED_AT}" \
            --arg expected_banco_mestre '2946' \
            --arg expected_questions '2871' \
            --arg expected_awaiting_audit '75' \
            '{
              operation: $operation,
              dispatched_at: $dispatched_at,
              pages_run_id: $run_id,
              pages_head_sha: $head_sha,
              pages_status_at_registration: $status,
              pages_conclusion_at_registration: $conclusion,
              pages_created_at: $created_at,
              expected: {
                banco_mestre: ($expected_banco_mestre | tonumber),
                questions: ($expected_questions | tonumber),
                awaiting_audit: ($expected_awaiting_audit | tonumber)
              }
            }' > data/editorial/dashboard-reconciliation-dispatch-receipt.json

          git config user.name 'sedes-df-dashboard-dispatch[bot]'
          git config user.email 'sedes-df-dashboard-dispatch[bot]@users.noreply.github.com'
          git add data/editorial/dashboard-reconciliation-dispatch-receipt.json
          git commit -m 'Registrar execução da reconciliação do painel [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "✓ Pages disparado no run ${RUN_ID}, commit ${HEAD_SHA}."
