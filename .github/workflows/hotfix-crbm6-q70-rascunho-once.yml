name: Hotfix CRBM-6 — remover RASCUNHO da questão 70

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-crbm6-q70-rascunho-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hotfix-crbm6-q70-rascunho-20260807
  cancel-in-progress: false

env:
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes/
  MATERIAL_PATH: data/release/materials/notion-advogado-crbm-6-quadrix-2026.json
  TARGET_CODE: PROVA-QDX-CRBM6-2026-ADVOGADO-400-070

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Congelar baseline pública
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const catalogBytes = fs.readFileSync('data/release/catalogo.json');
          const catalog = JSON.parse(catalogBytes);
          const manifest = JSON.parse(fs.readFileSync('data/release/manifest.json','utf8'));
          const ids = Object.keys(catalog.question_index || {}).sort();
          if (ids.length !== 3210 || (catalog.materials || []).length !== 73) throw new Error(`Baseline divergente: ${ids.length}/${(catalog.materials||[]).length}.`);
          if (Number(catalog.summary?.banco_mestre) !== 3212 || Number(catalog.summary?.aguardando_auditoria) !== 0 || Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error(`Resumo divergente: ${JSON.stringify(catalog.summary)}`);
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          if (manifest.catalog_sha256 !== sha(catalogBytes)) throw new Error('Hash do catálogo diverge do manifesto antes do hotfix.');
          fs.writeFileSync('/tmp/crbm6-q70-base-ids.json', JSON.stringify(ids));
          console.log('✓ Baseline congelada: 3210 questões, 73 materiais, 0 pendências.');
          NODE

      - name: Corrigir somente o artefato gráfico e atualizar manifesto
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const materialPath = process.env.MATERIAL_PATH;
          const targetCode = process.env.TARGET_CODE;
          const cleanPrompt = 'A Lei nº 13.709/2018 exclui a aplicação de outros direitos e de outras garantias previstos no ordenamento jurídico que sejam relacionados à proteção da privacidade e da personalidade.';
          const contaminatedPrompt = `${cleanPrompt} RASCUNHO`;
          const material = JSON.parse(fs.readFileSync(materialPath,'utf8'));
          if ((material.questoes || []).length !== 120) throw new Error(`Material Advogado CRBM-6 tem ${(material.questoes||[]).length} questões; esperado 120.`);
          const q = (material.questoes || []).find(item => String(item.codigo || '').trim() === targetCode);
          if (!q) throw new Error('Questão canônica 070 não encontrada.');
          if (String(q.enunciado || '').trim() !== contaminatedPrompt) throw new Error(`Enunciado atual não corresponde ao artefato esperado: ${q.enunciado}`);
          if (String(q.gabarito || '').trim() !== 'Errado') throw new Error(`Gabarito da questão 070 divergiu: ${q.gabarito}.`);
          q.enunciado = cleanPrompt;
          const materialBytes = Buffer.from(`${JSON.stringify(material)}\n`,'utf8');
          fs.writeFileSync(materialPath, materialBytes);

          const manifestPath = 'data/release/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const entry = (manifest.materials || []).find(item => item.id === 'notion-advogado-crbm-6-quadrix-2026');
          if (!entry) throw new Error('Entrada do material ausente no manifesto.');
          entry.bytes = materialBytes.length;
          entry.sha256 = crypto.createHash('sha256').update(materialBytes).digest('hex');
          manifest.generated_at = new Date().toISOString();
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`✓ q70 limpa; gabarito preservado; novo hash ${entry.sha256}.`);
          NODE

      - name: Validar escopo e integridade antes do commit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const catalogBytes = fs.readFileSync('data/release/catalogo.json');
          const catalog = JSON.parse(catalogBytes);
          const manifest = JSON.parse(fs.readFileSync('data/release/manifest.json','utf8'));
          const baseIds = JSON.parse(fs.readFileSync('/tmp/crbm6-q70-base-ids.json','utf8'));
          const ids = Object.keys(catalog.question_index || {}).sort();
          if (JSON.stringify(ids) !== JSON.stringify(baseIds)) throw new Error('Índices públicos mudaram durante o hotfix.');
          if (ids.length !== 3210 || (catalog.materials||[]).length !== 73) throw new Error('Contagens públicas mudaram durante o hotfix.');
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          if (manifest.catalog_sha256 !== sha(catalogBytes)) throw new Error('Hash do catálogo mudou indevidamente.');
          for (const entry of manifest.materials || []) {
            const file = String(entry.file).replace(/^\.\//,'');
            const bytes = fs.readFileSync(file);
            if (entry.sha256 !== sha(bytes) || Number(entry.bytes) !== bytes.length) throw new Error(`Manifesto divergente em ${entry.id}.`);
          }
          const material = JSON.parse(fs.readFileSync(process.env.MATERIAL_PATH,'utf8'));
          const q = (material.questoes||[]).find(item => String(item.codigo||'').trim() === process.env.TARGET_CODE);
          if (!q || String(q.enunciado||'').includes('RASCUNHO') || String(q.gabarito||'').trim() !== 'Errado') throw new Error('Questão 070 não ficou limpa e estável.');
          console.log('✓ Hotfix fonte validado sem delta de IDs, materiais, questões ou gabaritos.');
          NODE

      - name: Criar commit local da release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-crbm6-q70-rascunho-once.yml
          git add "$MATERIAL_PATH" data/release/manifest.json
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          const changed = execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const allowed = new Set([
            '.github/workflows/hotfix-crbm6-q70-rascunho-once.yml',
            'data/release/materials/notion-advogado-crbm-6-quadrix-2026.json',
            'data/release/manifest.json',
          ]);
          const invalid = changed.filter(file => !allowed.has(file));
          if (invalid.length || changed.length !== 3) throw new Error(`Escopo do commit divergente: ${changed.join(', ')}`);
          console.log(`✓ Commit restrito a ${changed.join(', ')}.`);
          NODE
          git commit -m 'Remover artefato RASCUNHO da questão CRBM-6 070 [skip ci]'
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "✓ Commit candidato ${SHA}; ainda não enviado à main."

      - name: Gerar e validar dist para o SHA candidato
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          GITHUB_SHA="$RELEASE_SHA" node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          node scripts/validate-runtime-catalog.mjs
          node scripts/validate-public-metadata-consistency.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const build = JSON.parse(fs.readFileSync('dist/data/release/build-info.json','utf8'));
          const catalog = JSON.parse(fs.readFileSync('dist/data/release/catalogo.json','utf8'));
          const material = JSON.parse(fs.readFileSync(`dist/${process.env.MATERIAL_PATH}`,'utf8'));
          if (String(build.source_sha||'') !== process.env.RELEASE_SHA || Number(build.questions) !== 3210 || Number(build.materials) !== 73) throw new Error(`Build divergente: ${build.source_sha}/${build.questions}/${build.materials}.`);
          if (Number(catalog.summary?.questoes) !== 3210 || Number(catalog.summary?.materiais) !== 73 || Number(catalog.summary?.aguardando_auditoria) !== 0) throw new Error('Resumo do dist divergente.');
          const q = (material.questoes||[]).find(item => String(item.codigo||'').trim() === process.env.TARGET_CODE);
          if (!q || String(q.enunciado||'').includes('RASCUNHO') || String(q.gabarito||'').trim() !== 'Errado') throw new Error('q70 divergente no dist.');
          console.log('✓ Dist candidato validado: 3210/73 e q70 limpa.');
          NODE

      - name: Enviar release validada à main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'A main avançou; abortando hotfix.'; exit 1; }
          git push origin HEAD:main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Empacotar artefato validado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar hotfix
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirmar hotfix no endereço público
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve,ms));
          let last = '';
          for (let attempt=1; attempt<=30; attempt++) {
            try {
              const stamp = `${Date.now()}-${attempt}`;
              const [build,catalog] = await Promise.all([
                fetch(`${process.env.PUBLIC_BASE_URL}data/release/build-info.json?hotfix=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`build ${r.status}`);return r.json();}),
                fetch(`${process.env.PUBLIC_BASE_URL}data/release/catalogo.json?hotfix=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`catalog ${r.status}`);return r.json();}),
              ]);
              if (String(build.source_sha||'') !== process.env.RELEASE_SHA || Number(build.questions)!==3210 || Number(catalog.summary?.questoes)!==3210 || Number(catalog.summary?.materiais)!==73 || Number(catalog.summary?.aguardando_auditoria)!==0) throw new Error(`metadados ${build.source_sha}/${build.questions}`);
              const meta=(catalog.materials||[]).find(item=>item.id==='notion-advogado-crbm-6-quadrix-2026');
              if(!meta)throw new Error('material canônico ausente');
              const url=new URL(String(meta.file).replace(/^\.\//,''),process.env.PUBLIC_BASE_URL); url.searchParams.set('hotfix',stamp);
              const material=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`material ${r.status}`);return r.json();});
              const q=(material.questoes||[]).find(item=>String(item.codigo||'').trim()===process.env.TARGET_CODE);
              if(!q || String(q.enunciado||'').includes('RASCUNHO') || String(q.gabarito||'').trim()!=='Errado')throw new Error('q70 ainda divergente');
              console.log('✓ Site público confirmado: 3210/73, q70 sem RASCUNHO, gabarito Errado preservado.');
              process.exit(0);
            } catch (error) { last=error.message; await sleep(10000); }
          }
          throw new Error(`Validação pública falhou: ${last}`);
          NODE

      - name: Registrar recibo durável do hotfix
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operations
          MATERIAL_SHA=$(sha256sum "$MATERIAL_PATH" | awk '{print $1}')
          jq -n --arg release "$RELEASE_SHA" --arg material_sha "$MATERIAL_SHA" --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{schema_version:"1.0",operation_id:"CRBM6-AGENTE-RECONCILIATION-Q70-HOTFIX-20260807",status:"success",release_sha:$release,public_url:"https://rodrigorosadantas.github.io/sedes-df-questoes/",confirmed_at:$confirmed_at,change:{canonical_code:"PROVA-QDX-CRBM6-2026-ADVOGADO-400-070",removed_page_artifact:"RASCUNHO",answer_preserved:"Errado",material_sha256:$material_sha},reconciliation:{agent_items_1_70:"common_duplicates_canonical_advogado",agent_items_71_120:"already_public",new_master_rows:0,new_public_questions:0},totals:{public_questions:3210,public_materials:73,master_bank:3212,awaiting_audit:0,discursive_display_items:2},notion_publication_receipt_preserved:true,permanent_automations_restored:false,public_validation:true}' > data/operations/crbm6-agent-reconciliation-q70-hotfix-receipt.json
          git add data/operations/crbm6-agent-reconciliation-q70-hotfix-receipt.json
          git commit -m 'Registrar hotfix da questão CRBM-6 070 [skip ci]'
          git push origin HEAD:main
