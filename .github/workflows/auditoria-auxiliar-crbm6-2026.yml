name: Reconciliar órfãos Auxiliar CRBM-6 2026

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/reconciliar-orfaos-auxiliar-crbm6-2026.mjs'
      - '.github/workflows/auditoria-auxiliar-crbm6-2026.yml'

permissions:
  contents: read

concurrency:
  group: reconciliar-orfaos-auxiliar-crbm6-20260801
  cancel-in-progress: false

jobs:
  reconciliar:
    if: github.head_ref == 'agent/auditoria-auxiliar-crbm6-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validar sintaxe
        run: node --check scripts/reconciliar-orfaos-auxiliar-crbm6-2026.mjs

      - name: Reconciliar códigos globais e linhas órfãs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/reconciliar-orfaos-auxiliar-crbm6-2026.mjs

      - name: Preservar relatório antes e depois
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliacao-orfaos-auxiliar-crbm6-20260801
          path: artifacts/reconciliacao-orfaos-auxiliar-crbm6-20260801.json
          if-no-files-found: error
          retention-days: 90
