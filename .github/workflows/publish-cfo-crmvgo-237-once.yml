name: Publicar CFO e CRMV-GO — 237 questões

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-cfo-crmvgo-237-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-cfo-crmvgo-237-20260807
  cancel-in-progress: false

env:
  OPERATION_ID: CFO-CRMVGO-TECADM-237-PUBLICATION-20260807
  CFO_LOT: CFO-2025-TECNICO-ADMINISTRATIVO-201-118-20260807
  CRMV_LOT: CRMVGO-2025-TECNICO-ADMINISTRATIVO-200-119-20260807
  SNAPSHOT_PATH: data/notion/publication-additions/cfo-crmvgo-tecnico-administrativo-237.json
  PLAN_COPY_PATH: data/notion/publication-additions/cfo-crmvgo-tecnico-administrativo-237-plan.json
  PREP_RECEIPT: data/operations/cfo-crmvgo-237-preparation-receipt.json
  DEPLOY_RECEIPT: data/operations/cfo-crmvgo-237-deployment-receipt.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Preservar fechador e congelar baseline pública
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/close-cfo-crmvgo-237.mjs /tmp/close-cfo-crmvgo-237.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const clean = value => String(value ?? '').trim();
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json','utf8'));
          const ids = Object.keys(catalog.question_index || {}).sort();
          if (ids.length !== 3210 || (catalog.materials || []).length !== 73) throw new Error(`Baseline pública não é 3210/73: ${ids.length}/${(catalog.materials||[]).length}.`);
          if (Number(catalog.summary?.questoes) !== 3210 || Number(catalog.summary?.materiais) !== 73 || Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error(`Resumo público divergente: ${JSON.stringify(catalog.summary)}`);
          for (const name of ['Técnico Administrativo — CFO — Quadrix 2025','Técnico Administrativo — CRMV-GO — Quadrix 2025']) {
            if ((catalog.materials || []).some(item => clean(item.nome) === name)) throw new Error(`${name}: material já existe no catálogo.`);
          }
          fs.writeFileSync('/tmp/cfo-crmvgo-base-ids.json', JSON.stringify(ids));
          console.log('✓ Baseline congelada: 3210 questões, 73 materiais, 2 discursivas de consulta.');
          NODE
      - name: Liberar e lotear exatamente 237 registros no Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/release-cfo-crmvgo-237.mjs
      - name: Exportar fonte editorial viva e isolar escopo autorizado
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/export-notion-snapshot.mjs
          node scripts/filter-cfo-crmvgo-237-snapshot.mjs
          node scripts/validate-notion-snapshot.mjs
          node scripts/create-publication-plan.mjs
          node scripts/validate-publication-plan.mjs
          test "$(jq -r '.schema_version' data/notion/published.json)" = '1.3'
          test "$(jq -r '.scope_mode' data/notion/published.json)" = 'additions'
          test "$(jq '.records | length' data/notion/published.json)" = '237'
          test "$(jq '.total_records' data/notion/publication-plan.json)" = '237'
          test "$(jq '.lots | length' data/notion/publication-plan.json)" = '2'
          test "$(jq --arg lot "$CFO_LOT" '[.lots[] | select(.lot==$lot) | .expected_count][0]' data/notion/publication-plan.json)" = '118'
          test "$(jq --arg lot "$CRMV_LOT" '[.lots[] | select(.lot==$lot) | .expected_count][0]' data/notion/publication-plan.json)" = '119'
      - name: Congelar snapshot, plano e recibo de preparação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/notion/publication-additions data/operations
          cp data/notion/published.json "$SNAPSHOT_PATH"
          cp data/notion/publication-plan.json "$PLAN_COPY_PATH"
          cmp --silent data/notion/published.json "$SNAPSHOT_PATH"
          cmp --silent data/notion/publication-plan.json "$PLAN_COPY_PATH"
          SNAP=$(sha256sum "$SNAPSHOT_PATH" | awk '{print $1}')
          PLAN=$(sha256sum "$PLAN_COPY_PATH" | awk '{print $1}')
          CODES=$(jq -r '.publication_scope.codes[]' "$SNAPSHOT_PATH" | sort | sha256sum | awk '{print $1}')
          jq -n --arg operation "$OPERATION_ID" --arg snapshot "$SNAP" --arg plan "$PLAN" --arg codes "$CODES" --arg prepared_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{schema_version:"1.0",operation_id:$operation,status:"prepared_not_published",prepared_at:$prepared_at,baseline_questions:3210,baseline_materials:73,master_bank:3449,expected_additions:237,target_questions:3447,target_materials:75,cfo_records:118,crmvgo_records:119,excluded:{cfo:[45,104],crmvgo:[94]},snapshot_sha256:$snapshot,plan_sha256:$plan,codes_sha256:$codes,publication_started:false,notion_traceability_closed:false}' > "$PREP_RECEIPT"
      - name: Aplicar pacote imutável sobre catálogo cumulativo
        run: |
          set -euo pipefail
          node scripts/apply-notion-snapshot.mjs
          node scripts/apply-discursive-display.mjs
          node scripts/build-study-index.mjs
          GITHUB_SHA="${GITHUB_SHA}" node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          rm -rf data/release
          cp -a dist/data/release data/release
      - name: Validar delta 3210 → 3447 e os dois materiais
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const clean = value => String(value ?? '').trim();
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/release/manifest.json','utf8'));
          const snapshot = JSON.parse(fs.readFileSync(process.env.SNAPSHOT_PATH,'utf8'));
          const base = JSON.parse(fs.readFileSync('/tmp/cfo-crmvgo-base-ids.json','utf8'));
          const finalIds = new Set(Object.keys(catalog.question_index || {}));
          const missing = base.filter(id => !finalIds.has(id));
          if (missing.length) throw new Error(`IDs anteriores perdidos: ${missing.slice(0,5).join(',')}`);
          if (base.length !== 3210 || finalIds.size !== 3447 || finalIds.size - base.length !== 237) throw new Error(`Delta divergente ${base.length}→${finalIds.size}.`);
          if ((catalog.materials || []).length !== 75) throw new Error(`Materiais ${(catalog.materials||[]).length}; esperado 75.`);
          if (Number(catalog.summary?.questoes) !== 3447 || Number(catalog.summary?.materiais) !== 75 || Number(catalog.summary?.banco_mestre) !== 3449 || Number(catalog.summary?.aguardando_auditoria) !== 0 || Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error(`Resumo divergente: ${JSON.stringify(catalog.summary)}`);
          const specs = [
            {name:'Técnico Administrativo — CFO — Quadrix 2025', count:118, excluded:[45,104], checks:[[8,'Errado']]},
            {name:'Técnico Administrativo — CRMV-GO — Quadrix 2025', count:119, excluded:[94], checks:[[73,'Errado'],[83,'Errado'],[98,'Errado'],[104,'Certo']]},
          ];
          for (const spec of specs) {
            const meta = (catalog.materials || []).find(item => clean(item.nome) === spec.name);
            if (!meta || Number(meta.quantidade_questoes) !== spec.count) throw new Error(`${spec.name}: material ausente/incompleto.`);
            const material = JSON.parse(fs.readFileSync(String(meta.file).replace(/^\.\//,''),'utf8'));
            const questions = material.questoes || [];
            const expected = Array.from({length:120},(_,i)=>i+1).filter(n=>!spec.excluded.includes(n));
            const numbers = questions.map(q=>Number(q.numero_original ?? q.numero));
            if (JSON.stringify(numbers) !== JSON.stringify(expected)) throw new Error(`${spec.name}: sequência divergente.`);
            for (const excluded of spec.excluded) if (numbers.includes(excluded)) throw new Error(`${spec.name}: questão excluída ${excluded} entrou.`);
            for (const [number, answer] of spec.checks) {
              const q = questions.find(item => Number(item.numero_original ?? item.numero) === number);
              if (clean(q?.gabarito) !== answer) throw new Error(`${spec.name} q${number}: gabarito ${clean(q?.gabarito)}; esperado ${answer}.`);
            }
            const byCode = new Map(questions.map(q => [clean(q.codigo), q]));
            for (const record of (snapshot.records || []).filter(item => clean(item.material_name) === spec.name)) {
              const q = byCode.get(clean(record.code));
              if (!q || clean(q.gabarito) !== clean(record.answer) || clean(q.enunciado) !== clean(record.prompt)) throw new Error(`${record.code}: publicação divergiu do snapshot.`);
            }
          }
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          const catalogBytes = fs.readFileSync('data/release/catalogo.json');
          if (manifest.catalog_sha256 !== sha(catalogBytes)) throw new Error('Hash do catálogo divergente.');
          for (const entry of manifest.materials || []) {
            const bytes = fs.readFileSync(String(entry.file).replace(/^\.\//,''));
            if (entry.sha256 !== sha(bytes) || Number(entry.bytes) !== bytes.length) throw new Error(`Manifesto divergente: ${entry.id}`);
          }
          console.log('✓ 3210 IDs preservados + 237 = 3447; 75 materiais; 0 pendências; exclusões preservadas.');
          NODE
      - name: Criar commit local da release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-cfo-crmvgo-237-once.yml scripts/release-cfo-crmvgo-237.mjs scripts/filter-cfo-crmvgo-237-snapshot.mjs scripts/close-cfo-crmvgo-237.mjs
          git add data/notion/published.json data/notion/publication-plan.json "$SNAPSHOT_PATH" "$PLAN_COPY_PATH" data/release "$PREP_RECEIPT"
          git commit -m 'Publicar 237 questões de CFO e CRMV-GO [skip ci]'
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Regerar e validar dist para o SHA da release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          GITHUB_SHA="$RELEASE_SHA" node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs
          node scripts/validate-runtime-catalog.mjs
          node scripts/validate-public-metadata-consistency.mjs
          test "$(jq '.questions' dist/data/release/build-info.json)" = '3447'
          test "$(jq -r '.source_sha' dist/data/release/build-info.json)" = "$RELEASE_SHA"
          test "$(jq '.summary.questoes' dist/data/release/catalogo.json)" = '3447'
          test "$(jq '.summary.materiais' dist/data/release/catalogo.json)" = '75'
          test "$(jq '.summary.banco_mestre' dist/data/release/catalogo.json)" = '3449'
          test "$(jq '.summary.aguardando_auditoria' dist/data/release/catalogo.json)" = '0'
          test "$(jq '.summary.discursivas_consulta' dist/data/release/catalogo.json)" = '2'
      - name: Enviar release validada à main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'A main avançou durante a publicação; abortando antes do push.'; exit 1; }
          git push origin HEAD:main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Validar endereço público e materiais publicados
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-deployment.mjs "$PUBLIC_URL" "$RELEASE_SHA"
          node --input-type=module - <<'NODE'
          const base = new URL(process.env.PUBLIC_URL.endsWith('/') ? process.env.PUBLIC_URL : `${process.env.PUBLIC_URL}/`);
          const clean = value => String(value ?? '').trim();
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const specs = [
            {name:'Técnico Administrativo — CFO — Quadrix 2025', count:118, excluded:[45,104]},
            {name:'Técnico Administrativo — CRMV-GO — Quadrix 2025', count:119, excluded:[94]},
          ];
          let success = false, last = '';
          for (let attempt=1; attempt<=30; attempt+=1) {
            try {
              const stamp = `${Date.now()}-${attempt}`;
              const [build,catalog] = await Promise.all([
                fetch(new URL(`data/release/build-info.json?x=${stamp}`,base),{cache:'no-store'}).then(r=>r.json()),
                fetch(new URL(`data/release/catalogo.json?x=${stamp}`,base),{cache:'no-store'}).then(r=>r.json()),
              ]);
              if (clean(build.source_sha) !== process.env.RELEASE_SHA || Number(build.questions) !== 3447 || Number(catalog.summary?.questoes) !== 3447 || Number(catalog.summary?.materiais) !== 75 || Number(catalog.summary?.banco_mestre) !== 3449 || Number(catalog.summary?.aguardando_auditoria) !== 0) throw new Error(`metadados ${build.source_sha}/${build.questions}/${catalog.summary?.questoes}/${catalog.summary?.materiais}`);
              for (const spec of specs) {
                const meta = (catalog.materials || []).find(item => clean(item.nome) === spec.name);
                if (!meta || Number(meta.quantidade_questoes) !== spec.count) throw new Error(`${spec.name}: material ausente.`);
                const u = new URL(String(meta.file).replace(/^\.\//,''),base); u.searchParams.set('x',stamp);
                const material = await fetch(u,{cache:'no-store'}).then(r=>r.json());
                const nums = (material.questoes || []).map(q=>Number(q.numero_original ?? q.numero));
                if (nums.length !== spec.count || spec.excluded.some(n=>nums.includes(n))) throw new Error(`${spec.name}: sequência pública inválida.`);
              }
              success = true;
              break;
            } catch (error) { last = error.message; await sleep(10000); }
          }
          if (!success) throw new Error(`Validação pública falhou: ${last}`);
          console.log('✓ Site público confirmado em 3447/75 com CFO 118/118 e CRMV-GO 119/119.');
          NODE
      - name: Fechar 237/237 no Notion sem reavaliar fórmula viva
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: ${{ steps.release.outputs.sha }}
          NOTION_SNAPSHOT_PATH: ${{ env.SNAPSHOT_PATH }}
          PUBLICATION_PLAN_PATH: ${{ env.PLAN_COPY_PATH }}
        run: node /tmp/close-cfo-crmvgo-237.mjs
      - name: Gravar recibo final e fechar operação
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          SNAP=$(sha256sum "$SNAPSHOT_PATH" | awk '{print $1}')
          PLAN=$(sha256sum "$PLAN_COPY_PATH" | awk '{print $1}')
          VERSION=$(node -p "require('./package.json').version")
          jq -n --arg operation "$OPERATION_ID" --arg release "$RELEASE_SHA" --arg version "$VERSION" --arg url "$PUBLIC_URL" --arg snapshot "$SNAP" --arg plan "$PLAN" --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{schema_version:"1.0",operation_id:$operation,status:"success",release_sha:$release,release_code:("release-"+$version+":"+$release),public_url:$url,confirmed_at:$confirmed_at,baseline_questions:3210,published_records:237,cfo_records:118,crmvgo_records:119,public_questions:3447,public_materials:75,master_bank:3449,awaiting_audit:0,discursive_display_items:2,excluded:{cfo:[45,104],crmvgo:[94]},snapshot_sha256:$snapshot,plan_sha256:$plan,notion_closed:true,public_validation:true,live_publish_formula_rechecked_after_deploy:false,permanent_automations_restored:false}' > "$DEPLOY_RECEIPT"
          git add "$DEPLOY_RECEIPT"
          git commit -m 'Registrar publicação confirmada de CFO e CRMV-GO 237/237 [skip ci]'
          git push origin HEAD:main
