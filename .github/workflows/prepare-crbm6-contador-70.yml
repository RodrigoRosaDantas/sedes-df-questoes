name: Preparar lote CRBM-6 Contador — 70 itens

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-crbm6-contador-70.yml
      - data/operations/prepare-crbm6-contador-70.json
      - scripts/filter-crbm6-contador-70-snapshot.mjs
      - scripts/validate-crbm6-contador-70-operation.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-crbm6-contador-70
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Consultar a fonte editorial viva
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs

      - name: Isolar somente as 70 questões de Contador
        run: node scripts/filter-crbm6-contador-70-snapshot.mjs

      - name: Gerar e validar o plano restrito
        run: |
          node scripts/create-publication-plan.mjs
          node scripts/validate-notion-snapshot.mjs
          node scripts/validate-publication-plan.mjs
          node scripts/validate-crbm6-contador-70-operation.mjs

      - name: Criar cópia imutável da adição
        run: |
          mkdir -p data/notion/publication-additions
          cp data/notion/published.json data/notion/publication-additions/crbm6-contador-70.json
          cp data/notion/publication-plan.json data/notion/publication-additions/crbm6-contador-70-plan.json

      - name: Versionar somente o pacote validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-crbm6-contador-70.yml
          git rm scripts/filter-crbm6-contador-70-snapshot.mjs
          git rm scripts/validate-crbm6-contador-70-operation.mjs
          git rm data/operations/prepare-crbm6-contador-70.json
          git add data/notion/published.json data/notion/publication-plan.json
          git add data/notion/publication-additions/crbm6-contador-70.json
          git add data/notion/publication-additions/crbm6-contador-70-plan.json
          git commit -m 'Preparar publicação de 70 questões de Contador do CRBM-6 [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main
