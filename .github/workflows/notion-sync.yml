name: Sincronizar Banco Mestre do Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3,9,15,21 * * *'

permissions:
  contents: write

concurrency:
  group: sedes-df-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar autoria da sincronização
        run: |
          git config user.name 'sedes-df-notion-sync[bot]'
          git config user.email 'sedes-df-notion-sync[bot]@users.noreply.github.com'

      - name: Consultar o Banco Mestre
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs

      - name: Construir e validar a plataforma com o snapshot
        run: npm run check

      - name: Publicar mudança semântica no branch principal
        shell: bash
        run: |
          set -euo pipefail
          git add data/notion/published.json
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança semântica no Banco Mestre.'
            exit 0
          fi
          git commit -m 'Sincronizar questões publicáveis do Banco Mestre'
          git push origin HEAD:main
