name: Fechar deploy manual e suspender automações integralmente

on:
  push:
    branches: [main]
    paths:
      - 'data/operations/finalize-dashboard-deploy-and-suspension.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-dashboard-deploy-and-suspension
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Confirmar evidência do deploy já aprovado
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.status' data/operations/finalize-dashboard-deploy-and-suspension.json)" = 'authorized'
          test "$(jq -r '.source_sha' data/operations/finalize-dashboard-deploy-and-suspension.json)" = '5d106a50b2316cecaec1325809ad58d80e869770'
          test "$(jq -r '.workflow_run_id' data/operations/finalize-dashboard-deploy-and-suspension.json)" = '31002745526'
          test "$(head -n 1 .github/workflows/pages.yml)" = 'name: Validar e publicar GitHub Pages — SUSPENSO'
          echo '✓ Deploy aprovado e Pages principal ainda suspenso.'

      - name: Converter todos os workflows remanescentes para acionamento manual
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          helper = Path('.github/workflows/finalize-dashboard-deploy-and-suspension.yml')
          changed = []
          inspected = []

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              if path == helper:
                  continue
              inspected.append(str(path))
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              start = next((i for i, line in enumerate(lines) if re.match(r'^on\s*:', line)), None)
              if start is None:
                  raise SystemExit(f'Workflow sem bloco on: {path}')

              line = lines[start]
              after = line.split(':', 1)[1].strip()
              if after:
                  end = start + 1
              else:
                  end = start + 1
                  while end < len(lines):
                      current = lines[end]
                      if current.strip() == '' or current.lstrip().startswith('#') or current.startswith((' ', '\t')):
                          end += 1
                          continue
                      break

              replacement = ['on:\n', '  workflow_dispatch:\n', '\n']
              updated = ''.join(lines[:start] + replacement + lines[end:])
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          receipt = {
              'schema_version': '1.1',
              'operation': 'SUSPEND-SITE-AUTOMATIONS',
              'mode': 'manual_only',
              'automatic_triggers_removed': ['push', 'pull_request', 'schedule'],
              'workflows_inspected': inspected,
              'workflows_changed': changed,
              'site_content_changed': False,
              'site_progress_data_changed': False,
              'reversible_from_git_history': True,
          }
          Path('data/operations/site-automations-suspended.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY

      - name: Remover mecanismos temporários e registrar recibos finais
        shell: bash
        run: |
          set -euo pipefail
          CONFIRMED_AT='2026-08-05T11:48:18Z'
          mkdir -p data/operations

          jq -n \
            --arg operation 'MANUAL-DASHBOARD-CARD-DEPLOY-20260805' \
            --arg status 'success' \
            --arg confirmed_at "${CONFIRMED_AT}" \
            --arg public_url 'https://rodrigorosadantas.github.io/sedes-df-questoes/' \
            --arg source_sha '5d106a50b2316cecaec1325809ad58d80e869770' \
            --argjson workflow_run_id '31002745526' \
            '{schema_version:"1.0",operation:$operation,status:$status,confirmed_at:$confirmed_at,public_url:$public_url,source_sha:$source_sha,workflow_run_id:$workflow_run_id,dashboard:{banco_mestre:2946,available_on_site:2871,awaiting_editorial_audit:75,materials:67},verification:{build_and_checks:"success",immutable_packages:"success",static_deployment:"success",public_browser_suite:"success",public_dashboard_card:"success",release_meta:"success"},controls:{notion_write:false,catalog_content_changed:false,main_pages_remained_suspended:true,all_automatic_workflows_now_suspended:true,temporary_workflows_removed:true,temporary_markers_removed:true}}' \
            > data/operations/manual-dashboard-card-deploy-receipt.json

          jq \
            --arg confirmed_at "${CONFIRMED_AT}" \
            --arg public_url 'https://rodrigorosadantas.github.io/sedes-df-questoes' \
            --arg source_sha '5d106a50b2316cecaec1325809ad58d80e869770' \
            '.schema_version="1.2" | .confirmed_at=$confirmed_at | .public_url=$public_url | .source_sha=$source_sha | .questions=2871 | .materials=67 | .dashboard={banco_mestre:2946,available_on_site:2871,awaiting_editorial_audit:75} | .verification.static_files="success" | .verification.public_browser="success" | .verification.public_dashboard_card="success" | .verification.public_metadata_refetched="success" | .automation_mode="manual_only_suspended"' \
            data/operations/latest-deployment.json > /tmp/latest.json
          mv /tmp/latest.json data/operations/latest-deployment.json

          rm -f .github/workflows/manual-dashboard-card-main-once.yml
          rm -f data/operations/manual-dashboard-card-main-once-trigger.json
          rm -f .github/workflows/manual-dashboard-card-deploy-once-20260805.yml
          rm -f data/operations/manual-dashboard-card-deploy-once-20260805.json
          rm -f data/operations/manual-dashboard-card-deploy-run-status.json
          rm -f data/operations/manual-dashboard-card-main-run-status.json
          rm -f .github/workflows/finalize-dashboard-deploy-and-suspension.yml
          rm -f data/operations/finalize-dashboard-deploy-and-suspension.json

      - name: Verificar suspensão integral
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          violations = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              start = next((i for i, line in enumerate(lines) if re.match(r'^on\s*:', line)), None)
              if start is None:
                  violations.append(f'{path}: bloco on ausente')
                  continue
              end = start + 1
              while end < len(lines):
                  line = lines[end]
                  if line.strip() == '' or line.lstrip().startswith('#') or line.startswith((' ', '\t')):
                      end += 1
                      continue
                  break
              block = '\n'.join(lines[start:end])
              for forbidden in ('push:', 'pull_request:', 'schedule:'):
                  if re.search(rf'^\s+{re.escape(forbidden)}', block, re.MULTILINE):
                      violations.append(f'{path}: {forbidden}')
              if 'workflow_dispatch:' not in block:
                  violations.append(f'{path}: workflow_dispatch ausente')

          if violations:
              raise SystemExit('Suspensão incompleta:\n' + '\n'.join(violations))
          print('✓ Todos os workflows ficaram exclusivamente sob acionamento manual.')
          PY

      - name: Versionar fechamento
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-finalizer[bot]'
          git config user.email 'sedes-df-finalizer[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Registrar deploy manual e suspender automações integralmente [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin --delete manual-dashboard-card-deploy-final >/dev/null 2>&1 || true
          echo '✓ Fechamento concluído e branch temporária removida.'
