name: Preparar lote SEEDF Biologia 97 a 120

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-seedf-bio-24.yml
      - data/operations/prepare-seedf-bio-24.json
      - scripts/filter-seedf-bio-24-snapshot.mjs
      - scripts/validate-seedf-bio-24-operation.mjs

permissions:
  contents: write

concurrency:
  group: prepare-seedf-bio-24
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar main autorizada
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Preservar snapshot anterior
        run: cp data/notion/published.json /tmp/published-before.json

      - name: Consultar a fonte editorial viva
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs

      - name: Isolar somente o lote de Biologia
        run: node scripts/filter-seedf-bio-24-snapshot.mjs

      - name: Gerar plano explícito de publicação
        run: node scripts/create-publication-plan.mjs

      - name: Validar snapshot, plano e preservação
        env:
          SNAPSHOT_BEFORE: /tmp/published-before.json
        run: |
          node scripts/validate-notion-snapshot.mjs
          node scripts/validate-publication-plan.mjs
          node scripts/validate-seedf-bio-24-operation.mjs

      - name: Criar cópia imutável da adição
        run: |
          mkdir -p data/notion/publication-additions
          cp data/notion/published.json data/notion/publication-additions/seedf-bio-24.json
          cp data/notion/publication-plan.json data/notion/publication-additions/seedf-bio-24-plan.json

      - name: Versionar somente o pacote validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'

          git rm .github/workflows/prepare-seedf-bio-24.yml
          git rm scripts/filter-seedf-bio-24-snapshot.mjs
          git rm scripts/validate-seedf-bio-24-operation.mjs
          git rm data/operations/prepare-seedf-bio-24.json
          git add data/notion/published.json data/notion/publication-plan.json
          git add data/notion/publication-additions/seedf-bio-24.json
          git add data/notion/publication-additions/seedf-bio-24-plan.json

          git commit -m 'Preparar publicação de 24 questões de Biologia da SEEDF [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main

          echo '✓ Snapshot e plano de Biologia versionados; arquivos temporários removidos da main.'
