name: Fechar rastreabilidade SEEDF Biomedicina 71 a 120

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-seedf-biomed-traceability.yml

permissions:
  contents: read

concurrency:
  group: close-seedf-biomed-traceability
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Restaurar a base pública estável
        run: |
          git fetch origin c060ed9a6d4c46c637a5215b3a2738b28a8d405e --depth=1
          git show c060ed9a6d4c46c637a5215b3a2738b28a8d405e:data/notion/published.json > data/notion/published.json
          git show c060ed9a6d4c46c637a5215b3a2738b28a8d405e:data/notion/publication-plan.json > data/notion/publication-plan.json
      - name: Reconstruir o catálogo público confirmado
        run: |
          npm run build
          node scripts/apply-publication-additions.mjs
          node scripts/apply-seedf-bio-24-addition.mjs
          node scripts/apply-seedf-biomed-50-addition.mjs
      - name: Confirmar total e fechar somente Biomedicina no Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RELEASE_COMMIT: a2dea79aa3bcb1ab6f66192d7ff793966075138a
          NOTION_SNAPSHOT_PATH: data/notion/publication-additions/seedf-biomed-50.json
          PUBLICATION_PLAN_PATH: data/notion/publication-additions/seedf-biomed-50-plan.json
        run: node scripts/mark-notion-published.mjs
