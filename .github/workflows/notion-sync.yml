name: Sincronizar Banco Mestre do Notion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/editorial/refresh-banco-mestre-dashboard-trigger.json'
  schedule:
    - cron: '20 3,9,15,21 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sedes-df-notion-sync
  cancel-in-progress: false

env:
  PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes
  PUBLICATION_PLAN_PATH: data/notion/publication-plan.json
  CONTADOR_MARKER_PATH: data/operations/prepare-crbm6-contador-70.json
  CONTADOR_SNAPSHOT_PATH: data/notion/publication-additions/crbm6-contador-70.json
  CONTADOR_PLAN_PATH: data/notion/publication-additions/crbm6-contador-70-plan.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Preparar autoria da sincronização
        run: |
          git config user.name 'sedes-df-notion-sync[bot]'
          git config user.email 'sedes-df-notion-sync[bot]@users.noreply.github.com'

      - name: Consultar o Banco Mestre
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs

      - name: Isolar somente a operação autorizada de Contador
        id: contador_operation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${CONTADOR_MARKER_PATH}" ]; then
            node scripts/filter-crbm6-contador-70-snapshot.mjs
            echo 'active=true' >> "$GITHUB_OUTPUT"
            echo '✓ Operação CRBM6 detectada; o snapshot foi limitado às questões 001–070.'
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhuma operação especial de Contador está ativa.'
          fi

      - name: Gerar plano explícito de lotes, contagens e códigos
        run: node scripts/create-publication-plan.mjs

      - name: Validar snapshot e plano sem reconstruir a plataforma
        run: |
          node scripts/validate-notion-snapshot.mjs
          node scripts/validate-publication-plan.mjs

      - name: Validar e preservar o pacote imutável de Contador
        if: steps.contador_operation.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-crbm6-contador-70-operation.mjs
          mkdir -p data/notion/publication-additions
          cp data/notion/published.json "${CONTADOR_SNAPSHOT_PATH}"
          cp "${PUBLICATION_PLAN_PATH}" "${CONTADOR_PLAN_PATH}"
          cmp --silent data/notion/published.json "${CONTADOR_SNAPSHOT_PATH}"
          cmp --silent "${PUBLICATION_PLAN_PATH}" "${CONTADOR_PLAN_PATH}"
          echo '✓ Pacote imutável de Contador preservado sem divergência de bytes.'

      - name: Versionar snapshot e plano no branch principal
        id: publish_snapshot
        env:
          CONTADOR_ACTIVE: ${{ steps.contador_operation.outputs.active }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=false
          git add data/notion/published.json "${PUBLICATION_PLAN_PATH}"

          if [ "${CONTADOR_ACTIVE}" = 'true' ]; then
            git add "${CONTADOR_SNAPSHOT_PATH}" "${CONTADOR_PLAN_PATH}"
            git rm --ignore-unmatch .github/workflows/prepare-crbm6-contador-70.yml
            git rm --ignore-unmatch scripts/filter-crbm6-contador-70-snapshot.mjs
            git rm --ignore-unmatch scripts/validate-crbm6-contador-70-operation.mjs
            git rm --ignore-unmatch "${CONTADOR_MARKER_PATH}"
            git rm --ignore-unmatch data/operations/crbm6-contador-70-prepare.log
          fi

          if git diff --cached --quiet; then
            echo 'Nenhuma mudança semântica no Banco Mestre ou no plano de publicação.'
          else
            git commit -m 'Sincronizar questões publicáveis do Banco Mestre'
            CHANGED=true
          fi

          git reset --hard HEAD
          git clean -fd
          if [ -n "$(git status --porcelain)" ]; then
            echo 'O diretório permaneceu sujo após a limpeza dos arquivos temporários.'
            git status --short
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          if [ "${CHANGED}" = 'true' ]; then
            git push origin HEAD:main
          fi

          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comparar branch principal com a produção
        id: deployment_needed
        env:
          SOURCE_SHA: ${{ steps.publish_snapshot.outputs.source_sha }}
          SNAPSHOT_CHANGED: ${{ steps.publish_snapshot.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_SHA=$(curl -fsS -H 'cache-control: no-cache, no-store' \
            "${PUBLIC_BASE_URL}/data/release/build-info.json?sync=${GITHUB_RUN_ID}" \
            | jq -r '.source_sha // empty' || true)
          echo "Commit do main: ${SOURCE_SHA}; commit público: ${PUBLIC_SHA:-indisponível}."
          if [ "${SNAPSHOT_CHANGED}" = 'true' ] || [ "${PUBLIC_SHA}" != "${SOURCE_SHA}" ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo '✓ Produção já corresponde ao branch principal.'
          fi

      - name: Acionar e acompanhar a publicação do commit sincronizado
        if: steps.deployment_needed.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.publish_snapshot.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --ref main -f source_sha="${SOURCE_SHA}" -f close_notion=true

          RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=main&per_page=50" > /tmp/pages-runs.json
            RUN_ID=$(jq -r --arg sha "${SOURCE_SHA}" --arg since "${DISPATCHED_AT}" '
              .workflow_runs[]
              | select(.head_sha == $sha)
              | select(.name == "Validar e publicar GitHub Pages")
              | select(.event == "workflow_dispatch")
              | select(.created_at >= $since)
              | .id
            ' /tmp/pages-runs.json | head -n1)
            if [ -n "${RUN_ID}" ]; then break; fi
            echo "Aguardando criação da execução de Pages para ${SOURCE_SHA} (${attempt}/60)."
            sleep 5
          done

          if [ -z "${RUN_ID}" ]; then
            echo 'A execução de publicação não foi criada dentro da janela de segurança.'
            exit 1
          fi

          echo "Execução de Pages criada: ${RUN_ID}."
          gh run watch "${RUN_ID}" --exit-status --interval 10
          echo "✓ Sincronização e publicação concluídas para ${SOURCE_SHA}."
