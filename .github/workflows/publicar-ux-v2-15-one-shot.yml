name: Publicar UX v2.15 — one-shot observável

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-ux-v2-15-one-shot
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Congelar release editorial atual
        run: |
          sha256sum data/release/catalogo.json > /tmp/catalog.sha256
          find data/release/materials -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > /tmp/materials.sha256

      - name: Gerar pacote público sem reconstruir o banco
        run: |
          node scripts/build-question-search-index.mjs
          node scripts/build-public.mjs
          node scripts/reconcile-discursive-release-meta.mjs
          node scripts/reconcile-public-metadata.mjs

      - name: Confirmar integridade editorial
        run: |
          sha256sum -c /tmp/catalog.sha256
          sha256sum -c /tmp/materials.sha256
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('dist/data/release/catalogo.json','utf8'));
          const ids = Object.keys(catalog.question_index || {});
          if (ids.length !== 3447) throw new Error(`Quantidade inesperada de questões: ${ids.length}`);
          if ((catalog.materials || []).length !== 75) throw new Error(`Quantidade inesperada de materiais: ${(catalog.materials || []).length}`);
          console.log('Integridade editorial confirmada: 3447 questões e 75 materiais.');
          NODE

      - name: Validar contratos estáticos
        run: |
          node --check assets/navigation-v2-15.js
          node --check assets/navigation-v2-15-polish.js
          node --check assets/ux-v2-14.js
          node --check assets/ux-v2-14-guardrails.js
          node scripts/validate-runtime-catalog.mjs
          node scripts/validate-study-navigation-v2-6.mjs
          node scripts/validate-intelligence-v2-9.mjs
          node scripts/validate-material-downloads.mjs
          node scripts/validate-platform-v2-13.mjs
          node scripts/validate-ux-v2-14.mjs
          node scripts/validate-navigation-v2-15.mjs
          node scripts/validate-discursive-display.mjs
          node scripts/validate-dist-v2-10.mjs
          node scripts/validate-build-v2-11.mjs
          node scripts/validate-public-metadata-consistency.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Subir dist local
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sedes-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sedes-http.log
          exit 1

      - name: Playwright local
        run: npx playwright test --config=playwright.config.js

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-and-verify:
    needs: validate-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout para teste público
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Testar site público
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test --config=playwright.public.config.js
