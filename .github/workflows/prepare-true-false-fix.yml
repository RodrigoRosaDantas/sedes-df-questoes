name: Preparar correção das alternativas Certo e Errado

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/fix-true-false-duplicate-labels'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar branch da correção
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Corrigir renderização e criar regressão visual
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_exact(path, old, new, expected):
              file = root / path
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: esperado {expected} ocorrência(s), encontrado {count}.')
              file.write_text(text.replace(old, new), encoding='utf-8')

          duplicated = '''<span class="letter">${letter}</span><span>${esc(text)}</span>'''
          deduplicated = '''<span class="letter">${letter}</span>${letter === text && (letter === "Certo" || letter === "Errado") ? "" : `<span>${esc(text)}</span>`}'''
          replace_exact('assets/app-v4.js', duplicated, deduplicated, 2)
          replace_exact(
              'assets/app-v4.js',
              '''return `<li class="${classes.join(" ")}"><span class="letter">''',
              '''return `<li class="${classes.join(" ")}" data-answer="${esc(letter)}"><span class="letter">''',
              1,
          )

          (root / 'assets/true-false.css').write_text('''/* Release 2.4 — suporte nativo a itens Certo/Errado */
          .option .letter {
            min-width: 2.25rem;
            width: auto;
            padding-inline: .55rem;
            white-space: nowrap;
          }

          .options:has(input[value="Certo"]) {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }

          .options:has(input[value="Certo"]) .option {
            grid-template-columns: minmax(0, 1fr);
            min-height: 4rem;
            align-items: center;
            justify-items: center;
          }

          .options:has(input[value="Certo"]) .letter {
            min-width: 4.75rem;
            width: 100%;
            height: auto;
            min-height: 2.75rem;
            padding: .65rem 1rem;
            text-align: center;
          }

          /* Proteção para clientes que ainda estejam executando o JS anterior. */
          .options:has(input[value="Certo"]) .option > span:not(.letter) {
            display: none;
          }

          .result-options .result-option[data-answer="Certo"],
          .result-options .result-option[data-answer="Errado"] {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            justify-items: center;
            text-align: center;
            list-style: none;
          }

          .result-options .result-option[data-answer="Certo"] .letter,
          .result-options .result-option[data-answer="Errado"] .letter {
            width: 100%;
            height: auto;
            min-height: 2.75rem;
            padding: .65rem 1rem;
          }

          @media (max-width: 640px) {
            .options:has(input[value="Certo"]) {
              grid-template-columns: 1fr;
            }
          }
          ''', encoding='utf-8')

          for file in root.rglob('*'):
              if not file.is_file() or '.git' in file.parts:
                  continue
              try:
                  text = file.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('app-v4.js?v=7', 'app-v4.js?v=8').replace('true-false.css?v=1', 'true-false.css?v=2')
              if updated != text:
                  file.write_text(updated, encoding='utf-8')

          test_path = root / 'tests-public/deployment.spec.js'
          test_text = test_path.read_text(encoding='utf-8')
          helper_anchor = '''  return codes;\n}\n\ntest("GitHub Pages serve a release completa e executável", async ({page, request}) => {'''
          helper = '''  return codes;\n}\n\nasync function findTrueFalseCase(request, catalog) {\n  for (const metadata of catalog.materials || []) {\n    const relative = clean(metadata.file).replace(/^\\.\\//, "");\n    const material = await fetchEventually(request, relative, "json", value => Array.isArray(value?.questoes));\n    const questionIndex = (material.questoes || []).findIndex(question => {\n      const entries = Object.entries(question.alternativas || {});\n      return entries.length === 2\n        && entries.every(([letter, text]) => ["Certo", "Errado"].includes(clean(letter)) && clean(text) === clean(letter));\n    });\n    if (questionIndex >= 0) {\n      return {\n        material,\n        questionIndex,\n        expectedLabels: Object.keys(material.questoes[questionIndex].alternativas),\n      };\n    }\n  }\n  throw new Error("Nenhuma questão Certo/Errado com rótulos equivalentes foi encontrada no pacote público.");\n}\n\ntest("GitHub Pages serve a release completa e executável", async ({page, request}) => {'''
          if test_text.count(helper_anchor) != 1:
              raise SystemExit('Âncora do helper de teste não encontrada uma única vez.')
          test_text = test_text.replace(helper_anchor, helper)

          target_anchor = '''  ).toEqual([]);\n\n  const homeURL = resourceURL("");'''
          target_replacement = '''  ).toEqual([]);\n  const trueFalseCase = await findTrueFalseCase(request, catalog);\n  expect(trueFalseCase.expectedLabels).toEqual(["Certo", "Errado"]);\n\n  const homeURL = resourceURL("");'''
          if test_text.count(target_anchor) != 1:
              raise SystemExit('Âncora do lote público não encontrada uma única vez.')
          test_text = test_text.replace(target_anchor, target_replacement)

          ui_anchor = '''  const performanceURL = resourceURL("");'''
          ui_test = '''  const trueFalseURL = resourceURL("");\n  trueFalseURL.hash = "/estudar";\n  await page.goto(trueFalseURL.href, {waitUntil: "domcontentloaded"});\n  const trueFalseCard = page.locator(".material-card").filter({hasText: clean(trueFalseCase.material.nome)}).first();\n  await expect(trueFalseCard).toBeVisible({timeout: 30000});\n  await trueFalseCard.locator("[data-open-material]").click();\n  await page.locator('[data-start="treino"]').click();\n  if (trueFalseCase.questionIndex > 0) {\n    await page.locator(`[data-jump="${trueFalseCase.questionIndex}"]`).click();\n  }\n  const trueFalseOptions = page.locator(".options .option");\n  await expect(trueFalseOptions).toHaveCount(2);\n  expect((await trueFalseOptions.allTextContents()).map(clean)).toEqual(trueFalseCase.expectedLabels);\n  await expect(page.locator(".options .option > span:visible")).toHaveCount(2);\n\n  const performanceURL = resourceURL("");'''
          if test_text.count(ui_anchor) != 1:
              raise SystemExit('Âncora da auditoria de desempenho não encontrada uma única vez.')
          test_path.write_text(test_text.replace(ui_anchor, ui_test), encoding='utf-8')
          PY

      - name: Validar build e regras estruturais
        run: npm run check

      - name: Versionar a correção na branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-true-false-fix.yml
          git config user.name 'sedes-df-fix[bot]'
          git config user.email 'sedes-df-fix[bot]@users.noreply.github.com'
          git add assets/app-v4.js assets/true-false.css index.html service-worker.js scripts tests-public .github/workflows/prepare-true-false-fix.yml
          git commit -m 'Corrigir rótulos duplicados em Certo e Errado'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
