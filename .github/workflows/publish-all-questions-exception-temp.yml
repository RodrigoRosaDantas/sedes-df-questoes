name: Publicar integralmente o Banco Mestre — exceção

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-all-questions-exception
  cancel-in-progress: false

jobs:
  export:
    if: github.head_ref == 'agent/publish-all-questions-exception'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar branch excepcional
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configurar autoria
        run: |
          git config user.name 'sedes-df-publish-all[bot]'
          git config user.email 'sedes-df-publish-all[bot]@users.noreply.github.com'

      - name: Compatibilizar publicação integral
        run: |
          python3 - <<'PY'
          from pathlib import Path

          export_file = Path('scripts/export-all-notion-snapshot-temp.mjs')
          export_text = export_file.read_text()
          export_text = export_text.replace(
              "const shortId = value => clean(value).replace(/-/g, '').slice(0, 12) || Math.random().toString(16).slice(2, 14);",
              "const stableId = value => clean(value).replace(/-/g, '') || Math.random().toString(16).slice(2);\nconst shortId = value => stableId(value).slice(-16);",
          )
          export_text = export_text.replace(
              "github_id: clean(row['Código GitHub']) || `notion-${shortId(row.notion_id)}` ,".replace('` ,', '`,'),
              "github_id: `notion-${stableId(row.notion_id)}` ,".replace('` ,', '`,'),
          )
          export_text = export_text.replace(
              "  if (!clean(row['Comentário geral'])) notices.push('Comentário editorial não cadastrado.');",
              "  if (!clean(row['Comentário geral'])) notices.push('Comentário editorial não cadastrado.');\n  if (Boolean(row['Possui imagem'])) notices.push('Imagem indicada no Banco Mestre sem arquivo público disponível; questão publicada sem recurso visual.');",
          )
          export_text = export_text.replace(
              "    has_image: Boolean(row['Possui imagem']),",
              "    has_image: false,",
          )
          required_export = [
              "const stableId",
              "github_id: `notion-${stableId(row.notion_id)}`",
              "has_image: false",
              "questão publicada sem recurso visual",
          ]
          if any(marker not in export_text for marker in required_export):
              raise SystemExit('Não foi possível compatibilizar IDs ou imagens da exportação integral.')
          export_file.write_text(export_text)

          apply_file = Path('scripts/apply-notion-snapshot.mjs')
          apply_text = apply_file.read_text()
          direct = "function matchRecord(record) {\n  const direct = byCode.get(key(editorialCode(record)));\n  if (direct) return direct;\n"
          exception_gate = "  if (record.publication_exception) return null;\n"
          if exception_gate not in apply_text:
              if direct not in apply_text:
                  raise SystemExit('Não foi possível localizar o ponto de compatibilidade do snapshot.')
              apply_text = apply_text.replace(direct, direct + exception_gate, 1)
          apply_text = apply_text.replace(
              "    possui_imagem: Boolean(record.has_image),",
              "    possui_imagem: Boolean(record.has_image) || Boolean(current?.imagem),",
          )
          if "Boolean(record.has_image) || Boolean(current?.imagem)" not in apply_text:
              raise SystemExit('Não foi possível preservar imagens já existentes.')
          apply_file.write_text(apply_text)
          PY

      - name: Exportar integralmente o Banco Mestre
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-all-notion-snapshot-temp.mjs

      - name: Gerar plano técnico
        run: node scripts/create-publication-plan.mjs

      - name: Validar pacote integral
        run: npm run check

      - name: Versionar snapshot integral
        shell: bash
        run: |
          set -euo pipefail
          git add data/notion/published.json data/notion/publication-plan.json scripts/export-all-notion-snapshot-temp.mjs scripts/apply-notion-snapshot.mjs
          if git diff --cached --quiet; then
            echo 'Snapshot integral já está atualizado.'
          else
            git commit -m 'Publicar integralmente todas as questões do Banco Mestre'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
