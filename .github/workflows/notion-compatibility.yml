name: Validar integração do Banco Mestre

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compare:
    if: github.event.pull_request.head.ref == 'integration/notion-bank-master-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/notion-bank-master-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar release pública atual
        run: npm run build
      - name: Comparar Banco Mestre com a release
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/compare-notion-release.mjs
      - name: Gerar snapshot autorizado do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs
      - name: Validar plataforma completa com o snapshot
        run: npm run check
      - name: Consolidar snapshot na branch isolada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-notion-sync[bot]'
          git config user.email 'sedes-df-notion-sync[bot]@users.noreply.github.com'
          git add data/notion/published.json
          if git diff --cached --quiet; then
            echo 'Snapshot já está atualizado.'
            exit 0
          fi
          git commit -m 'Atualizar snapshot público do Banco Mestre'
          git push origin HEAD:integration/notion-bank-master-v2
      - name: Guardar relatório comparativo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-release-comparison
          path: /tmp/notion-release-comparison.json
          retention-days: 7
