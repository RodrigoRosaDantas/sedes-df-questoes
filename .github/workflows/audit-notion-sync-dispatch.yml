name: Auditar dispatch encadeado do Notion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Acionar o sincronismo real com o token do workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run notion-sync.yml --ref main

          RUN_ID=''
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=main&per_page=50" > /tmp/sync-runs.json
            RUN_ID=$(jq -r --arg since "${DISPATCHED_AT}" '
              .workflow_runs[]
              | select(.name == "Sincronizar Banco Mestre do Notion")
              | select(.event == "workflow_dispatch")
              | select(.created_at >= $since)
              | .id
            ' /tmp/sync-runs.json | head -n1)
            if [ -n "${RUN_ID}" ]; then break; fi
            echo "Aguardando criação do sincronismo (${attempt}/60)."
            sleep 5
          done

          if [ -z "${RUN_ID}" ]; then
            echo 'O workflow do Notion não foi criado pelo GITHUB_TOKEN.'
            exit 1
          fi

          echo "Sincronismo criado: ${RUN_ID}."
          gh run watch "${RUN_ID}" --exit-status --interval 10
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            | jq -r '.jobs[] | "JOB \(.name): \(.conclusion // .status)\n" + ((.steps // []) | map("  \(.number). \(.name): \(.conclusion // .status)") | join("\n"))'

      - name: Confirmar que produção e main terminaram alinhados
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_BASE_URL: https://rodrigorosadantas.github.io/sedes-df-questoes
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          for attempt in $(seq 1 60); do
            PUBLIC_SHA=$(curl -fsS -H 'cache-control: no-cache, no-store' \
              "${PUBLIC_BASE_URL}/data/release/build-info.json?audit=${GITHUB_RUN_ID}-${attempt}" \
              | jq -r '.source_sha // empty' || true)
            if [ "${PUBLIC_SHA}" = "${MAIN_SHA}" ]; then
              echo "✓ Produção e main alinhados em ${MAIN_SHA}."
              exit 0
            fi
            echo "Aguardando produção: main ${MAIN_SHA}; público ${PUBLIC_SHA:-indisponível} (${attempt}/60)."
            sleep 5
          done
          echo 'Produção não terminou alinhada ao branch main.'
          exit 1
