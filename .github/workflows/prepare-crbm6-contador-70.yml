name: Preparar lote CRBM-6 Contador — 70 itens

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-crbm6-contador-70.yml
      - data/operations/prepare-crbm6-contador-70.json
      - scripts/filter-crbm6-contador-70-snapshot.mjs
      - scripts/validate-crbm6-contador-70-operation.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-crbm6-contador-70-v3
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Executar preparação com interrupção obrigatória
        id: prepare
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set +e
          mkdir -p data/operations data/notion/publication-additions
          (
            set -euo pipefail
            echo '== Remover qualquer resíduo local anterior =='
            rm -f data/notion/publication-additions/crbm6-contador-70.json
            rm -f data/notion/publication-additions/crbm6-contador-70-plan.json

            echo '== Consultar a fonte editorial viva =='
            node scripts/export-notion-snapshot.mjs

            echo '== Isolar somente as 70 questões de Contador =='
            node scripts/filter-crbm6-contador-70-snapshot.mjs

            echo '== Gerar e validar o plano restrito =='
            node scripts/create-publication-plan.mjs
            node scripts/validate-notion-snapshot.mjs
            node scripts/validate-publication-plan.mjs
            node scripts/validate-crbm6-contador-70-operation.mjs

            echo '== Criar e reverificar as cópias imutáveis =='
            cp data/notion/published.json data/notion/publication-additions/crbm6-contador-70.json
            cp data/notion/publication-plan.json data/notion/publication-additions/crbm6-contador-70-plan.json
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const operation = 'CRBM6-2026-CONTADOR-402-001-070-20260803';
            const prefix = 'PROVA-QDX-CRBM6-2026-CONTADOR-402-';
            const plan = JSON.parse(fs.readFileSync('data/notion/publication-additions/crbm6-contador-70-plan.json', 'utf8'));
            const snapshot = JSON.parse(fs.readFileSync('data/notion/publication-additions/crbm6-contador-70.json', 'utf8'));
            const expected = Array.from({length: 70}, (_, index) => `${prefix}${String(index + 1).padStart(3, '0')}`);
            const lot = plan.lots?.[0];
            if (plan.total_records !== 70 || plan.lots?.length !== 1 || lot?.lot !== operation || lot?.expected_count !== 70) {
              throw new Error('A cópia imutável do plano não representa o lote de 70 questões de Contador.');
            }
            if (JSON.stringify(lot.codes) !== JSON.stringify(expected)) throw new Error('Os códigos da cópia imutável não correspondem à sequência 1–70.');
            const pending = (snapshot.records || []).filter(record => !String(record.github_id || '').trim());
            if (pending.length !== 70 || pending.some(record => record.publication_lot !== operation || !expected.includes(record.code))) {
              throw new Error('A cópia imutável do snapshot contém registros pendentes fora do lote de Contador.');
            }
            console.log('✓ Cópias imutáveis confirmadas: lote de Contador, 70 códigos, sequência 1–70.');
            NODE
          ) > >(tee data/operations/crbm6-contador-70-prepare.log) 2>&1
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Registrar diagnóstico quando houver falha
        if: steps.prepare.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git add data/operations/crbm6-contador-70-prepare.log
          if git diff --cached --quiet; then
            echo 'O diagnóstico não mudou; nenhuma gravação necessária.'
            exit 0
          fi
          git commit -m 'Registrar falha da preparação corrigida de Contador [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main

      - name: Versionar somente o pacote comprovadamente correto
        if: steps.prepare.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-crbm6-contador-70.yml
          git rm scripts/filter-crbm6-contador-70-snapshot.mjs
          git rm scripts/validate-crbm6-contador-70-operation.mjs
          git rm data/operations/prepare-crbm6-contador-70.json
          git rm -f data/operations/crbm6-contador-70-prepare.log || true
          git add data/notion/published.json data/notion/publication-plan.json
          git add data/notion/publication-additions/crbm6-contador-70.json
          git add data/notion/publication-additions/crbm6-contador-70-plan.json
          git commit -m 'Regenerar pacote correto de 70 questões de Contador [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main

      - name: Encerrar com falha após registrar o diagnóstico
        if: steps.prepare.outputs.exit_code != '0'
        run: exit 1
