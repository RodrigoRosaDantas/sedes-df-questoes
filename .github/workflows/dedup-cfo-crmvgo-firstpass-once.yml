name: Deduplicar CFO e CRMV-GO — primeira passagem

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dedup-cfo-crmvgo-firstpass-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dedup-cfo-crmvgo-firstpass-20260807
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar parser HTML
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Extrair 240 itens e comparar com o catálogo público
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, unicodedata, hashlib, math
          from collections import Counter, defaultdict
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          ROOT = Path('.')
          OUT = ROOT / 'data' / 'operations' / 'cfo-crmvgo-firstpass-dedup-20260807.json'
          OUT.parent.mkdir(parents=True, exist_ok=True)

          EXAMS = [
              {
                  'id': 'CFO-2025-TECNICO-ADMINISTRATIVO-201',
                  'name': 'Técnico Administrativo — CFO — Quadrix 2025',
                  'base': 'https://www.qconcursos.com/questoes-de-concursos/provas/quadrix-2025-cfo-tecnico-administrativo/questoes',
                  'known_duplicates': [72, 75, 94],
                  'annulled': [],
                  'definitive_changes': {'8': {'from': 'Certo', 'to': 'Errado'}},
              },
              {
                  'id': 'CRMVGO-2025-TECNICO-ADMINISTRATIVO-200',
                  'name': 'Técnico Administrativo — CRMV-GO — Quadrix 2025',
                  'base': 'https://www.qconcursos.com/questoes-de-concursos/provas/quadrix-2025-crmv-go-tecnico-administrativo/questoes',
                  'known_duplicates': [],
                  'annulled': [94],
                  'definitive_changes': {
                      '73': {'from': 'Certo', 'to': 'Errado'},
                      '83': {'from': 'Certo', 'to': 'Errado'},
                      '94': {'from': 'Errado', 'to': 'Anulada'},
                      '98': {'from': 'Certo', 'to': 'Errado'},
                      '104': {'from': 'Errado', 'to': 'Certo'},
                  },
              },
          ]

          def clean_space(s):
              return re.sub(r'\s+', ' ', str(s or '')).strip()

          def norm(s):
              s = unicodedata.normalize('NFKD', clean_space(s)).encode('ascii', 'ignore').decode('ascii').lower()
              s = re.sub(r'[^a-z0-9]+', ' ', s)
              return clean_space(s)

          STOP = {
              'acerca','assim','com','como','considerando','conforme','de','da','das','do','dos','e','em','entre','esse','essa','este','esta',
              'julgue','item','itens','na','nas','no','nos','o','os','a','as','para','por','que','quanto','seguinte','seguintes','sobre','uma','um',
              'publica','administracao','lei','brasil','brasileiro','brasileira'
          }
          def tokens(s):
              return {t for t in norm(s).split() if len(t) >= 5 and t not in STOP}

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'pt-BR,pt;q=0.9,en;q=0.7',
          })

          def extract_page(url):
              r = session.get(url, timeout=30)
              r.raise_for_status()
              if 'Qconcursos' not in r.text and 'qconcursos' not in r.text.lower():
                  raise RuntimeError(f'HTML inesperado em {url}: {len(r.text)} bytes')
              soup = BeautifulSoup(r.text, 'lxml')
              lines = [clean_space(x) for x in soup.get_text('\n', strip=True).splitlines()]
              lines = [x for x in lines if x]
              pos = []
              for i, line in enumerate(lines):
                  m = re.match(r'^(Q\d{6,9})(?:\s+.*)?$', line)
                  if m:
                      pos.append((i, m.group(1)))
              order = []
              first = {}
              for i, qid in pos:
                  if qid not in first:
                      first[qid] = i
                      order.append(qid)
              if len(order) < 18:
                  raise RuntimeError(f'Página {url} trouxe apenas {len(order)} IDs únicos: {order[:5]}')
              items = []
              for j, qid in enumerate(order[:20]):
                  start = first[qid]
                  end = first[order[j+1]] if j+1 < len(order) else len(lines)
                  seg = lines[start:end]
                  same = [k for k, line in enumerate(seg) if re.match(rf'^{re.escape(qid)}(?:\s+.*)?$', line)]
                  anchor = same[-1] if same else 0
                  alt = next((k for k in range(anchor+1, len(seg)) if seg[k].lower().startswith('alternativas')), len(seg))
                  body = seg[anchor+1:alt]
                  # Remove metadados/UI antes do corpo real.
                  body = [x for x in body if not x.startswith('Ano: ') and not x.startswith('Banca: ') and not x.startswith('Órgão: ') and not x.startswith('Prova: ') and not x.startswith('Provas: ')]
                  if body and len(body[0]) <= 55 and not re.search(r'[.!?]$', body[0]):
                      body = body[1:]  # disciplina
                  body = [x for x in body if x != 'Texto associado']
                  raw = clean_space(' '.join(body))
                  if len(raw) < 40:
                      raise RuntimeError(f'{url} {qid}: corpo muito curto: {raw!r}')
                  items.append({'qid': qid, 'raw_text': raw})
              return items

          extracted = {}
          for exam in EXAMS:
              items = []
              for page in range(1, 7):
                  url = exam['base'] + ('' if page == 1 else f'?page={page}')
                  page_items = extract_page(url)
                  if len(page_items) != 20:
                      raise RuntimeError(f'{exam["id"]} pág. {page}: {len(page_items)} itens, esperado 20')
                  for local_idx, item in enumerate(page_items, start=1):
                      item['number'] = (page - 1) * 20 + local_idx
                      item['page'] = page
                      item['source_url'] = url
                  items.extend(page_items)
              if len(items) != 120 or [x['number'] for x in items] != list(range(1,121)):
                  raise RuntimeError(f'{exam["id"]}: extração não fechou 120/120')
              extracted[exam['id']] = items

          catalog = json.loads((ROOT/'data/release/catalogo.json').read_text())
          if len(catalog.get('question_index', {})) != 3210 or len(catalog.get('materials', [])) != 73:
              raise RuntimeError(f'Baseline pública divergente: {len(catalog.get("question_index",{}))}/{len(catalog.get("materials",[]))}')

          public = []
          for meta in catalog['materials']:
              path = ROOT / str(meta['file']).replace('./','')
              material = json.loads(path.read_text())
              for q in material.get('questoes', []):
                  prompt = clean_space(q.get('enunciado'))
                  text_base = clean_space(q.get('texto_base'))
                  public.append({
                      'code': clean_space(q.get('codigo')),
                      'material': clean_space(material.get('nome')),
                      'number': q.get('numero_original', q.get('numero')),
                      'prompt': prompt,
                      'text_base': text_base,
                      'prompt_norm': norm(prompt),
                      'combined_norm': norm((text_base + ' ' + prompt).strip()),
                      'tokens': tokens((text_base + ' ' + prompt).strip()),
                  })
          if len(public) != 3210:
              raise RuntimeError(f'Leitura dos materiais produziu {len(public)} questões, esperado 3210')

          inv = defaultdict(set)
          for idx, q in enumerate(public):
              for tok in q['tokens']:
                  inv[tok].add(idx)

          def compare(source_raw):
              sn = norm(source_raw)
              st = tokens(source_raw)
              exact = []
              for q in public:
                  pn = q['prompt_norm']
                  if len(pn) >= 45 and pn in sn:
                      exact.append(q)
              counts = Counter()
              for tok in st:
                  for idx in inv.get(tok, ()):
                      counts[idx] += 1
              fuzzy = []
              for idx, shared in counts.most_common(40):
                  q = public[idx]
                  union = len(st | q['tokens'])
                  jac = shared / union if union else 0.0
                  containment = shared / min(len(st), len(q['tokens'])) if min(len(st), len(q['tokens'])) else 0.0
                  if jac >= 0.62 or containment >= 0.86:
                      fuzzy.append((q, round(jac,4), round(containment,4), shared))
              fuzzy.sort(key=lambda x: (x[2], x[1], x[3]), reverse=True)
              return exact, fuzzy[:5]

          report_materials = []
          for exam in EXAMS:
              rows = []
              exact_numbers = []
              fuzzy_numbers = []
              for item in extracted[exam['id']]:
                  exact, fuzzy = compare(item['raw_text'])
                  if exact:
                      exact_numbers.append(item['number'])
                  elif fuzzy:
                      fuzzy_numbers.append(item['number'])
                  rows.append({
                      'number': item['number'],
                      'qconcursos_id': item['qid'],
                      'source_url': item['source_url'],
                      'raw_sha256': hashlib.sha256(item['raw_text'].encode()).hexdigest(),
                      'raw_excerpt': item['raw_text'][:220],
                      'exact_public_matches': [
                          {'code': q['code'], 'material': q['material'], 'number': q['number']}
                          for q in exact[:10]
                      ],
                      'fuzzy_public_candidates': [
                          {'code': q['code'], 'material': q['material'], 'number': q['number'], 'jaccard': jac, 'containment': cont, 'shared_tokens': shared}
                          for q, jac, cont, shared in fuzzy
                      ],
                      'official_annulled': item['number'] in exam['annulled'],
                      'historically_known_duplicate': item['number'] in exam['known_duplicates'],
                  })
              report_materials.append({
                  'id': exam['id'],
                  'name': exam['name'],
                  'extracted': len(rows),
                  'exact_match_numbers': exact_numbers,
                  'exact_match_count': len(exact_numbers),
                  'fuzzy_candidate_numbers_without_exact': fuzzy_numbers,
                  'fuzzy_candidate_count_without_exact': len(fuzzy_numbers),
                  'known_historical_duplicates': exam['known_duplicates'],
                  'official_annulments': exam['annulled'],
                  'definitive_changes': exam['definitive_changes'],
                  'records': rows,
              })

          cfo_report = next(x for x in report_materials if x['id'].startswith('CFO-'))
          missed_known = [n for n in [72,75,94] if n not in cfo_report['exact_match_numbers'] and n not in cfo_report['fuzzy_candidate_numbers_without_exact']]

          result = {
              'schema_version': '1.0',
              'operation_id': 'CFO-CRMVGO-FIRSTPASS-DEDUP-20260807',
              'status': 'first_pass_complete',
              'method': {
                  'source': 'Qconcursos public proof pages, cross-checked against user-uploaded exam identities',
                  'pages_per_exam': 6,
                  'expected_items_per_exam': 120,
                  'exact_rule': 'normalized public enunciado (>=45 chars) contained in normalized source question block',
                  'fuzzy_rule': 'token Jaccard >=0.62 OR token containment >=0.86 among inverted-index candidates',
                  'note': 'Fuzzy candidates require manual confirmation; this report does not authorize Master writes.'
              },
              'baseline': {'public_questions': 3210, 'public_materials': 73, 'master_bank': 3212, 'awaiting_audit': 0},
              'materials': report_materials,
              'sanity_check': {
                  'cfo_known_duplicates_expected': [72,75,94],
                  'cfo_known_duplicates_not_rediscovered': missed_known,
              },
              'master_writes': 0,
              'public_writes': 0,
          }
          OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({
              x['id']: {
                  'exact': x['exact_match_count'],
                  'fuzzy_without_exact': x['fuzzy_candidate_count_without_exact'],
                  'known_duplicates': x['known_historical_duplicates'],
                  'annulments': x['official_annulments'],
              } for x in report_materials
          }, ensure_ascii=False, indent=2))
          print('CFO known duplicates not rediscovered:', missed_known)
          print('✓ Primeira passagem gerada sem escrever no Banco Mestre ou catálogo.')
          PY

      - name: Auto-remover workflow e persistir apenas o relatório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-audit[bot]'
          git config user.email 'sedes-df-audit[bot]@users.noreply.github.com'
          git rm .github/workflows/dedup-cfo-crmvgo-firstpass-once.yml
          git add data/operations/cfo-crmvgo-firstpass-dedup-20260807.json
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          const changed = execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const allowed = new Set(['.github/workflows/dedup-cfo-crmvgo-firstpass-once.yml','data/operations/cfo-crmvgo-firstpass-dedup-20260807.json']);
          const invalid = changed.filter(x=>!allowed.has(x));
          if(invalid.length || changed.length!==2) throw new Error(`Escopo divergente: ${changed.join(', ')}`);
          NODE
          git commit -m 'Registrar primeira deduplicação CFO e CRMV-GO [skip ci]'
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'A main avançou; relatório não será enviado.'; exit 1; }
          git push origin HEAD:main
