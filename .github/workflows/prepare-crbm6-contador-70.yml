name: Mover registros classificados para a lixeira do Notion

on:
  push:
    branches:
      - main
      - agent/notion-trash-classified-20260804
    paths:
      - data/editorial/notion-trash-classified-20260804-trigger.json

permissions:
  contents: write

concurrency:
  group: notion-trash-classified-20260804-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar branch operacional
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validar scripts e gatilho
        run: |
          set -euo pipefail
          node --check data/editorial/reconcile-public-snapshot-notion-ids.mjs
          node --check data/editorial/notion-trash-classified-records.mjs
          node --check data/editorial/refine-notion-trash-targets.mjs
          jq -e '.operation_id == "NOTION-TRASH-CLASSIFIED-20260804" and (.mode == "dry-run" or .mode == "execute")' \
            data/editorial/notion-trash-classified-20260804-trigger.json >/dev/null

      - name: Reconciliar identidades públicas somente no workspace
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node data/editorial/reconcile-public-snapshot-notion-ids.mjs

      - name: Executar classificação ou envio à lixeira
        id: operation
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node data/editorial/notion-trash-classified-records.mjs

      - name: Refinar as linhas excedentes contra os 2.871 IDs canônicos
        id: refinement
        if: steps.operation.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(jq -r '.mode' data/editorial/notion-trash-classified-20260804-trigger.json)" = 'dry-run' ]; then
            node data/editorial/refine-notion-trash-targets.mjs
          else
            echo 'Execução real: alvos refinados do dry-run foram usados sem alteração.'
          fi

      - name: Persistir alvos e recibos no branch operacional
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore data/notion/published.json
          git config user.name 'sedes-df-notion-cleanup[bot]'
          git config user.email 'sedes-df-notion-cleanup[bot]@users.noreply.github.com'
          git add data/editorial/notion-trash-classified-20260804-*.json
          if ! git diff --cached --quiet; then
            MODE=$(jq -r '.mode' data/editorial/notion-trash-classified-20260804-trigger.json)
            git commit -m "Registrar ${MODE} da limpeza classificada do Notion [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git merge-base --is-ancestor "origin/${GITHUB_REF_NAME}" HEAD; then
              git rebase "origin/${GITHUB_REF_NAME}"
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Reprovar operação não concluída
        if: steps.operation.outcome != 'success' || steps.refinement.outcome == 'failure'
        run: |
          echo 'A operação foi interrompida. Consulte o recibo persistido no branch operacional.'
          exit 1
