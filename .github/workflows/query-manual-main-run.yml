name: Consultar publicador manual da main

on:
  push:
    branches: [main]
    paths:
      - 'data/operations/query-manual-main-run.json'

permissions:
  contents: write
  actions: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - name: Consultar execução
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" > /tmp/runs.json
          RUN=$(jq -c '[.workflow_runs[] | select(.name == "Publicar correção do cartão Banco Mestre — manual único")] | sort_by(.created_at) | reverse | .[0] // {}' /tmp/runs.json)
          jq -n --arg queried_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson run "${RUN}" '{queried_at:$queried_at,run:{id:($run.id // null),status:($run.status // null),conclusion:($run.conclusion // null),head_sha:($run.head_sha // null),created_at:($run.created_at // null),updated_at:($run.updated_at // null),html_url:($run.html_url // null)}}' > data/operations/manual-dashboard-card-main-run-status.json
          rm -f .github/workflows/query-manual-main-run.yml data/operations/query-manual-main-run.json
          git config user.name 'sedes-run-query[bot]'
          git config user.email 'sedes-run-query[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Registrar status do publicador manual [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
