name: Preparar pacote imutável de Orientador Social

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/prepare-alto-paraiso-orientador-37.yml
      - scripts/export-alto-paraiso-orientador-37.mjs

permissions:
  contents: write

concurrency:
  group: prepare-alto-paraiso-orientador-37
  cancel-in-progress: false

jobs:
  prepare:
    if: github.head_ref == 'agent/publish-alto-paraiso-orientador-37-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/publish-alto-paraiso-orientador-37-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Consultar o Banco Mestre e gerar snapshot restrito
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-alto-paraiso-orientador-37.mjs
      - name: Validar snapshot e plano imutáveis
        shell: bash
        run: |
          set -euo pipefail
          cp data/notion/published.json /tmp/current-published.json
          cp data/notion/publication-plan.json /tmp/current-plan.json
          cp data/notion/publication-additions/alto-paraiso-orientador-37.json data/notion/published.json
          cp data/notion/publication-additions/alto-paraiso-orientador-37-plan.json data/notion/publication-plan.json
          node scripts/validate-notion-snapshot.mjs
          node scripts/validate-publication-plan.mjs
          cp /tmp/current-published.json data/notion/published.json
          cp /tmp/current-plan.json data/notion/publication-plan.json
      - name: Versionar somente o pacote validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-alto-paraiso-orientador-37.yml
          git rm scripts/export-alto-paraiso-orientador-37.mjs
          git add data/notion/publication-additions/alto-paraiso-orientador-37.json
          git add data/notion/publication-additions/alto-paraiso-orientador-37-plan.json
          git commit -m 'Preparar publicação de 37 questões de Orientador Social [skip ci]'
          git push origin HEAD:agent/publish-alto-paraiso-orientador-37-20260803
