name: Auditar e limpar registros classificados do Notion

on:
  push:
    branches:
      - main
    paths:
      - data/editorial/notion-trash-classified-20260804-trigger.json

permissions:
  contents: write

concurrency:
  group: notion-trash-classified-20260804
  cancel-in-progress: false

env:
  BASE_SNAPSHOT_COMMIT: c060ed9a6d4c46c637a5215b3a2738b28a8d405e
  DIAGNOSTIC_PATH: data/editorial/notion-trash-classified-20260804-diagnostic.json
  RECONSTRUCTION_DIAGNOSTIC_PATH: data/editorial/notion-trash-classified-20260804-reconstruction-diagnostic.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar branch principal
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validar scripts e gatilho
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --check data/editorial/reconcile-public-snapshot-notion-ids.mjs
          node --check data/editorial/notion-trash-classified-records.mjs
          node --check data/editorial/refine-notion-trash-targets.mjs
          jq -e '.operation_id == "NOTION-TRASH-CLASSIFIED-20260804" and (.mode == "dry-run" or .mode == "execute")' data/editorial/notion-trash-classified-20260804-trigger.json >/dev/null

      - name: Reconstruir o catálogo público somente no workspace
        id: reconstruction
        if: steps.validation.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -Eeuo pipefail
          CURRENT_STAGE='initialization'
          trap 'STATUS=$?; jq -n --arg operation_id "NOTION-TRASH-CLASSIFIED-20260804" --arg status "failure" --arg stage "${CURRENT_STAGE}" --arg command "${BASH_COMMAND}" --arg source_sha "${GITHUB_SHA}" --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson exit_code "${STATUS}" "{schema_version:\"1.0\",operation_id:\$operation_id,status:\$status,stage:\$stage,command:\$command,exit_code:\$exit_code,source_sha:\$source_sha,created_at:\$created_at}" > "${RECONSTRUCTION_DIAGNOSTIC_PATH}"; exit ${STATUS}' ERR

          CURRENT_STAGE='export_editorial_platform_sync'
          node scripts/export-editorial-platform-sync.mjs
          CURRENT_STAGE='export_pedagogia_editorial_sync'
          node scripts/export-pedagogia-editorial-sync.mjs

          CURRENT_STAGE='backup_current_snapshot'
          cp data/notion/published.json /tmp/current-snapshot.json
          cp data/notion/publication-plan.json /tmp/current-plan.json

          CURRENT_STAGE='validate_base_commit'
          git cat-file -e "${BASE_SNAPSHOT_COMMIT}^{commit}"

          CURRENT_STAGE='restore_base_snapshot'
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/published.json" > data/notion/published.json
          git show "${BASE_SNAPSHOT_COMMIT}:data/notion/publication-plan.json" > data/notion/publication-plan.json

          CURRENT_STAGE='build_base_catalog'
          npm run build

          CURRENT_STAGE='restore_current_snapshot'
          cp /tmp/current-snapshot.json data/notion/published.json
          cp /tmp/current-plan.json data/notion/publication-plan.json

          CURRENT_STAGE='apply_publication_additions'
          node scripts/apply-publication-additions.mjs
          CURRENT_STAGE='apply_seedf_bio_24'
          node scripts/apply-seedf-bio-24-addition.mjs
          CURRENT_STAGE='apply_seedf_biomed_50'
          node scripts/apply-seedf-biomed-50-addition.mjs
          CURRENT_STAGE='apply_seedf_eletrot_43'
          node scripts/apply-seedf-eletrot-43-addition.mjs
          CURRENT_STAGE='apply_alto_paraiso_37'
          node scripts/apply-alto-paraiso-orientador-37-addition.mjs
          CURRENT_STAGE='apply_crefito17_62'
          node scripts/apply-crefito17-agentefiscal-62-addition.mjs
          CURRENT_STAGE='apply_crbm6_contador_70'
          node scripts/apply-crbm6-contador-70-addition.mjs

          CURRENT_STAGE='verify_2871'
          jq -e '.summary.questoes == 2871' data/release/catalogo.json >/dev/null

          trap - ERR
          jq -n \
            --arg operation_id 'NOTION-TRASH-CLASSIFIED-20260804' \
            --arg status 'success' \
            --arg stage 'complete' \
            --arg source_sha "${GITHUB_SHA}" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:"1.0",operation_id:$operation_id,status:$status,stage:$stage,source_sha:$source_sha,created_at:$created_at}' \
            > "${RECONSTRUCTION_DIAGNOSTIC_PATH}"

      - name: Extrair os códigos públicos
        id: extraction
        if: steps.reconstruction.outcome == 'success'
        continue-on-error: true
        run: node data/editorial/reconcile-public-snapshot-notion-ids.mjs

      - name: Executar classificação ou envio à lixeira
        id: operation
        if: steps.extraction.outcome == 'success'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node data/editorial/notion-trash-classified-records.mjs

      - name: Refinar os alvos contra o catálogo público
        id: refinement
        if: steps.operation.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(jq -r '.mode' data/editorial/notion-trash-classified-20260804-trigger.json)" = 'dry-run' ]; then
            node data/editorial/refine-notion-trash-targets.mjs
          else
            echo 'Execução real utiliza o conjunto imutável aprovado no dry-run.'
          fi

      - name: Registrar estágio alcançado
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          RECONSTRUCTION_OUTCOME: ${{ steps.reconstruction.outcome }}
          EXTRACTION_OUTCOME: ${{ steps.extraction.outcome }}
          OPERATION_OUTCOME: ${{ steps.operation.outcome }}
          REFINEMENT_OUTCOME: ${{ steps.refinement.outcome }}
        run: |
          set -euo pipefail
          MODE=$(jq -r '.mode' data/editorial/notion-trash-classified-20260804-trigger.json)
          jq -n \
            --arg operation_id 'NOTION-TRASH-CLASSIFIED-20260804' \
            --arg mode "${MODE}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg validation "${VALIDATION_OUTCOME:-unknown}" \
            --arg reconstruction "${RECONSTRUCTION_OUTCOME:-unknown}" \
            --arg extraction "${EXTRACTION_OUTCOME:-unknown}" \
            --arg operation "${OPERATION_OUTCOME:-unknown}" \
            --arg refinement "${REFINEMENT_OUTCOME:-unknown}" \
            '{schema_version:"1.0",operation_id:$operation_id,mode:$mode,source_sha:$source_sha,created_at:$created_at,stages:{validation:$validation,reconstruction:$reconstruction,extraction:$extraction,operation:$operation,refinement:$refinement}}' \
            > "${DIAGNOSTIC_PATH}"

      - name: Persistir recibos e diagnóstico
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sedes-df-notion-cleanup[bot]'
          git config user.email 'sedes-df-notion-cleanup[bot]@users.noreply.github.com'
          git add data/editorial/notion-trash-classified-20260804-*.json
          if ! git diff --cached --quiet; then
            MODE=$(jq -r '.mode' data/editorial/notion-trash-classified-20260804-trigger.json)
            git commit -m "Registrar ${MODE} da limpeza classificada do Notion [skip ci]"
            git push origin HEAD:main
          fi

      - name: Reprovar estágio incompleto
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          RECONSTRUCTION_OUTCOME: ${{ steps.reconstruction.outcome }}
          EXTRACTION_OUTCOME: ${{ steps.extraction.outcome }}
          OPERATION_OUTCOME: ${{ steps.operation.outcome }}
          REFINEMENT_OUTCOME: ${{ steps.refinement.outcome }}
        run: |
          set -euo pipefail
          MODE=$(jq -r '.mode' data/editorial/notion-trash-classified-20260804-trigger.json)
          test "${VALIDATION_OUTCOME}" = 'success'
          test "${RECONSTRUCTION_OUTCOME}" = 'success'
          test "${EXTRACTION_OUTCOME}" = 'success'
          test "${OPERATION_OUTCOME}" = 'success'
          if [ "${MODE}" = 'dry-run' ]; then test "${REFINEMENT_OUTCOME}" = 'success'; fi
