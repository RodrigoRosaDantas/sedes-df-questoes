name: Sincronizar correções CRF-DF Assistente I

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-crf-assistente-i-corrections
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'agent/sync-crf-assistente-i-corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar branch de sincronização
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Configurar autoria
        run: |
          git config user.name 'sedes-df-sync[bot]'
          git config user.email 'sedes-df-sync[bot]@users.noreply.github.com'
      - name: Sincronizar exatamente 14 correções do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-crf-assistente-i-corrections.mjs
      - name: Atualizar plano explícito de publicação
        run: node scripts/create-publication-plan.mjs
      - name: Validar plataforma integralmente
        run: npm run check
      - name: Versionar somente snapshot e plano
        shell: bash
        run: |
          set -euo pipefail
          git add data/notion/published.json data/notion/publication-plan.json
          if git diff --cached --quiet; then
            echo 'Snapshot já contém as 14 correções.'
          else
            git commit -m 'Sincronizar 14 correções do CRF-DF Assistente I'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Publicar relatório de sincronização
        uses: actions/upload-artifact@v5
        with:
          name: sync-crf-assistente-i-corrections-report
          path: artifacts/sync-crf-assistente-i-corrections.json
          if-no-files-found: error
          retention-days: 7
