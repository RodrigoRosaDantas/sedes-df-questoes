name: Saneamento Agente Fiscal CREFITO-17 2026

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/auditar-agente-fiscal-crefito17-2026.mjs'
      - '.github/workflows/auditoria-agente-fiscal-crefito17-2026.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: saneamento-agente-fiscal-crefito17-20260801
  cancel-in-progress: false

jobs:
  sanear:
    if: github.head_ref == 'agent/auditoria-agente-fiscal-crefito17-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Preparar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils unzip jq

      - name: Baixar e extrair caderno, gabarito e recursos oficiais
        shell: bash
        run: |
          set -euo pipefail
          BASE='artifacts/auditoria-agente-fiscal-crefito17-2026/oficial'
          mkdir -p "$BASE/extraido"
          ZIP='https://anexos.cdn.selecao.net.br/uploads/861/concursos/3041/anexos/fc75420c-9413-4962-94be-4d800eac2df8.zip'
          KEY='https://anexos.cdn.selecao.net.br/uploads/861/concursos/3041/anexos/56b57efd-7a95-4e53-aac2-c47d87fbb19a.pdf'
          APPEALS='https://anexos.cdn.selecao.net.br/uploads/861/concursos/3041/anexos/5d2448af-596f-4902-960a-548bdd19fadb.pdf'
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$ZIP" -o "$BASE/provas-aplicadas.zip"
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$KEY" -o "$BASE/gabarito-definitivo.pdf"
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$APPEALS" -o "$BASE/analise-recursos.pdf"
          unzip -q "$BASE/provas-aplicadas.zip" -d "$BASE/extraido"
          PDF="$(find "$BASE/extraido" -type f -iname '*Agente*Fiscal*.pdf' | head -n 1)"
          test -n "$PDF"
          cp "$PDF" "$BASE/401_Agente-Fiscal_CREFITO-17_2026.pdf"
          pdftotext -layout "$PDF" "$BASE/401_Agente-Fiscal_CREFITO-17_2026.txt"
          pdftotext -raw "$PDF" "$BASE/401_Agente-Fiscal_CREFITO-17_2026.raw.txt"
          pdftotext -layout "$BASE/gabarito-definitivo.pdf" "$BASE/gabarito-definitivo.txt"
          pdftotext -layout "$BASE/analise-recursos.pdf" "$BASE/analise-recursos.txt"
          sha256sum "$BASE/provas-aplicadas.zip" "$BASE/401_Agente-Fiscal_CREFITO-17_2026.pdf" "$BASE/gabarito-definitivo.pdf" "$BASE/analise-recursos.pdf" > "$BASE/sha256.txt"

      - name: Reconstruir rotina temporária de saneamento
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          COMMENTS="$RUNNER_TEMP/comments.json"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/issues/61/comments?per_page=100' \
            -o "$COMMENTS"
          python3 - "$COMMENTS" scripts/sanear-agente-fiscal-crefito17-2026.runtime.mjs <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          comments_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          comments = json.loads(comments_path.read_text(encoding='utf-8'))

          prefixes = {
              'integral': 'SANITIZER_AGENTEFISCAL:',
              'fragmento_1': 'SANITIZER_AGENTEFISCAL_1:',
              'fragmento_2': 'SANITIZER_AGENTEFISCAL_2:',
          }
          payloads = {}
          for name, prefix in prefixes.items():
              matches = [item.get('body', '')[len(prefix):] for item in comments if item.get('body', '').startswith(prefix)]
              if matches:
                  payloads[name] = ''.join(matches[-1].split())

          if not payloads:
              raise SystemExit('Nenhum pacote temporário foi encontrado nos comentários do PR.')

          alphabet = re.compile(r'^[A-Za-z0-9+/=]*$')
          for name, payload in payloads.items():
              print(f'PAYLOAD_{name.upper()}_LENGTH={len(payload)}')
              print(f'PAYLOAD_{name.upper()}_VALID_ALPHABET={bool(alphabet.fullmatch(payload))}')
              print(f'PAYLOAD_{name.upper()}_MOD4={len(payload) % 4}')
              print(f'PAYLOAD_{name.upper()}_SHA256={hashlib.sha256(payload.encode()).hexdigest()}')

          def decode_raw(name, payload):
              candidate = payload + ('=' * (-len(payload) % 4))
              try:
                  raw = base64.b64decode(candidate, validate=True)
                  print(f'RAW_{name.upper()}_BYTES={len(raw)}')
                  print(f'RAW_{name.upper()}_SHA256={hashlib.sha256(raw).hexdigest()}')
                  return raw
              except Exception as exc:
                  print(f'RAW_{name.upper()}_ERROR={type(exc).__name__}:{exc}')
                  return None

          def decompress(name, raw):
              if not raw:
                  return None
              try:
                  data = gzip.decompress(raw)
                  print(f'DECOMPRESS_{name.upper()}_BYTES={len(data)}')
                  print(f'DECOMPRESS_{name.upper()}_SHA256={hashlib.sha256(data).hexdigest()}')
                  return data
              except Exception as exc:
                  print(f'DECOMPRESS_{name.upper()}_ERROR={type(exc).__name__}:{exc}')
                  return None

          raw = {name: decode_raw(name, payload) for name, payload in payloads.items()}
          result = decompress('integral', raw.get('integral'))
          route = 'integral' if result else None

          if not result and raw.get('fragmento_1') and raw.get('fragmento_2'):
              result = decompress('bytes_fragmentados', raw['fragmento_1'] + raw['fragmento_2'])
              route = 'bytes_fragmentados' if result else None

          if not result and raw.get('integral') and raw.get('fragmento_2'):
              result = decompress('integral_mais_fragmento_2', raw['integral'] + raw['fragmento_2'])
              route = 'integral_mais_fragmento_2' if result else None

          if not result and payloads.get('fragmento_1') and payloads.get('fragmento_2'):
              combined_payload = payloads['fragmento_1'].rstrip('=') + payloads['fragmento_2']
              result = decompress('base64_recomposto', decode_raw('base64_recomposto', combined_payload))
              route = 'base64_recomposto' if result else None

          if not result:
              raise SystemExit('Nenhuma rota de reconstrução produziu um gzip íntegro.')

          output_path.write_bytes(result)
          print(f'SANITIZER_ROUTE={route}')
          print(f'SANITIZER_BYTES={len(result)}')
          print(f'SANITIZER_SHA256={hashlib.sha256(result).hexdigest()}')
          PY
          node --check scripts/auditar-agente-fiscal-crefito17-2026.mjs
          node --check scripts/sanear-agente-fiscal-crefito17-2026.runtime.mjs

      - name: Registrar diagnóstico inicial
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/auditar-agente-fiscal-crefito17-2026.mjs

      - name: Reconstruir e sanear os 120 itens
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sanear-agente-fiscal-crefito17-2026.runtime.mjs

      - name: Auditar estado final
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/auditar-agente-fiscal-crefito17-2026.mjs

      - name: Preservar relatório e fontes oficiais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saneamento-agente-fiscal-crefito17-20260801
          path: |
            artifacts/auditoria-agente-fiscal-crefito17-2026
            artifacts/saneamento-agente-fiscal-crefito17-20260801.json
          if-no-files-found: error
          retention-days: 90
