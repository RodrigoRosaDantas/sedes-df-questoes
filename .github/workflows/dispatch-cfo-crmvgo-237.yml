name: Fechar publicação CFO e CRMV-GO 237
# disparo de recuperação autorizado em 2026-08-07

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dispatch-cfo-crmvgo-237.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: close-cfo-crmvgo-237-20260807
  cancel-in-progress: false

env:
  RELEASE_SHA: c10f6b2d8e341e2b1c5be549ca95541baf1b80b6
  RELEASE_CODE: release-2.13.0:c10f6b2d8e341e2b1c5be549ca95541baf1b80b6
  PUBLIC_URL: https://rodrigorosadantas.github.io/sedes-df-questoes/
  SNAPSHOT_PATH: data/notion/publication-additions/cfo-crmvgo-tecnico-administrativo-237.json
  PLAN_PATH: data/notion/publication-additions/cfo-crmvgo-tecnico-administrativo-237-plan.json
  RECEIPT_PATH: data/operations/cfo-crmvgo-237-deployment-receipt.json

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validar release imutável na main
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const snapshot = JSON.parse(fs.readFileSync(process.env.SNAPSHOT_PATH,'utf8'));
          const plan = JSON.parse(fs.readFileSync(process.env.PLAN_PATH,'utf8'));
          const catalog = JSON.parse(fs.readFileSync('data/release/catalogo.json','utf8'));
          if (snapshot.schema_version !== '1.3' || snapshot.scope_mode !== 'additions' || snapshot.records?.length !== 237) throw new Error('Snapshot imutável 237 inválido.');
          if (new Set(snapshot.publication_scope?.codes || []).size !== 237) throw new Error('Snapshot não possui 237 códigos únicos.');
          if (plan.total_records !== 237 || plan.lots?.length !== 2) throw new Error('Plano imutável 237 inválido.');
          if (Number(catalog.summary?.questoes) !== 3447 || Number(catalog.summary?.materiais) !== 75 || Number(catalog.summary?.banco_mestre) !== 3449 || Number(catalog.summary?.aguardando_auditoria) !== 0 || Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error(`Catálogo da main divergente: ${JSON.stringify(catalog.summary)}`);
          for (const code of ['PROVA-QDX-CFO-2025-TECNICO-ADMINISTRATIVO-201-045','PROVA-QDX-CFO-2025-TECNICO-ADMINISTRATIVO-201-104','PROVA-QDX-CRMVGO-2025-TECNICO-ADMINISTRATIVO-200-094']) if (snapshot.publication_scope.codes.includes(code)) throw new Error(`Código excluído presente: ${code}`);
          console.log('✓ Release fonte confirmada: snapshot 237, plano 2 lotes, catálogo 3447/75/3449/0.');
          NODE

      - name: Validar GitHub Pages real com cache canônico r5
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const base = new URL(process.env.PUBLIC_URL.endsWith('/') ? process.env.PUBLIC_URL : `${process.env.PUBLIC_URL}/`);
          const snapshot = JSON.parse(fs.readFileSync(process.env.SNAPSHOT_PATH,'utf8'));
          const clean = value => String(value ?? '').trim();
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const fetchJSON = async (relative, stamp) => {
            const url = new URL(relative.replace(/^\.\//,''), base);
            url.searchParams.set('verify', stamp);
            const response = await fetch(url, {cache:'no-store'});
            if (!response.ok) throw new Error(`${relative}: HTTP ${response.status}`);
            return response.json();
          };
          const specs = [
            {name:'Técnico Administrativo — CFO — Quadrix 2025', count:118, excluded:[45,104], checks:[[8,'Errado']]},
            {name:'Técnico Administrativo — CRMV-GO — Quadrix 2025', count:119, excluded:[94], checks:[[73,'Errado'],[83,'Errado'],[98,'Errado'],[104,'Certo']]},
          ];
          let last = '';
          for (let attempt=1; attempt<=30; attempt+=1) {
            try {
              const stamp = `${Date.now()}-${attempt}`;
              const [build, release, catalog] = await Promise.all([
                fetchJSON('data/release/build-info.json',stamp),
                fetchJSON('data/release/release-meta.json',stamp),
                fetchJSON('data/release/catalogo.json',stamp),
              ]);
              for (const doc of [build, release]) {
                if (clean(doc.source_sha) !== process.env.RELEASE_SHA) throw new Error(`SHA público ${doc.source_sha}; esperado ${process.env.RELEASE_SHA}.`);
                if (clean(doc.cache_version) !== 'sedes-questoes-v2-13-0-r5') throw new Error(`Cache público ${doc.cache_version}.`);
                if (Number(doc.questions) !== 3447 || Number(doc.materials) !== 75) throw new Error(`Totais build/release ${doc.questions}/${doc.materials}.`);
              }
              if (Number(catalog.summary?.questoes) !== 3447 || Number(catalog.summary?.materiais) !== 75 || Number(catalog.summary?.banco_mestre) !== 3449 || Number(catalog.summary?.aguardando_auditoria) !== 0 || Number(catalog.summary?.discursivas_consulta) !== 2) throw new Error(`Resumo público ${JSON.stringify(catalog.summary)}.`);
              const publicByCode = new Map();
              for (const spec of specs) {
                const meta = (catalog.materials || []).find(item => clean(item.nome) === spec.name);
                if (!meta || Number(meta.quantidade_questoes) !== spec.count) throw new Error(`${spec.name}: material ausente/incompleto.`);
                const material = await fetchJSON(String(meta.file), stamp);
                const questions = material.questoes || [];
                const numbers = questions.map(q => Number(q.numero_original ?? q.numero));
                const expected = Array.from({length:120},(_,i)=>i+1).filter(n=>!spec.excluded.includes(n));
                if (JSON.stringify(numbers) !== JSON.stringify(expected)) throw new Error(`${spec.name}: sequência pública divergente.`);
                for (const [number, answer] of spec.checks) {
                  const q = questions.find(item => Number(item.numero_original ?? item.numero) === number);
                  if (clean(q?.gabarito) !== answer) throw new Error(`${spec.name} q${number}: ${clean(q?.gabarito)}; esperado ${answer}.`);
                }
                for (const q of questions) publicByCode.set(clean(q.codigo), q);
              }
              for (const record of snapshot.records) {
                const q = publicByCode.get(clean(record.code));
                if (!q || clean(q.gabarito) !== clean(record.answer) || clean(q.enunciado) !== clean(record.prompt)) throw new Error(`${record.code}: público diverge do snapshot imutável.`);
              }
              console.log('✓ Pages confirmado: SHA c10f6b2, cache r5, 3447 questões, 75 materiais, CFO 118/118 e CRMV-GO 119/119.');
              process.exit(0);
            } catch (error) {
              last = error.message;
              console.log(`Tentativa ${attempt}/30: ${last}`);
              if (attempt < 30) await sleep(5000);
            }
          }
          throw new Error(`Validação pública falhou: ${last}`);
          NODE

      - name: Fechar rastreabilidade 237/237 no Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const snapshot = JSON.parse(fs.readFileSync(process.env.SNAPSHOT_PATH,'utf8'));
          const TOKEN = process.env.NOTION_TOKEN;
          const API = 'https://api.notion.com/v1';
          const VERSION = '2026-03-11';
          const DATE = '2026-08-07';
          const clean = value => String(value ?? '').trim();
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          if (!TOKEN) throw new Error('NOTION_TOKEN ausente.');
          async function request(endpoint, options={}, attempt=1) {
            const response = await fetch(`${API}${endpoint}`, { ...options, headers:{Authorization:`Bearer ${TOKEN}`,'Notion-Version':VERSION,'Content-Type':'application/json',...(options.headers||{})} });
            if (response.ok) return response.status === 204 ? {} : response.json();
            const body = await response.text();
            if ((response.status===429 || response.status>=500) && attempt<9) { await sleep(Math.max(Number(response.headers.get('retry-after')||0)*1000,400*2**(attempt-1))); return request(endpoint,options,attempt+1); }
            throw new Error(`Notion ${response.status}: ${body.slice(0,500)}`);
          }
          const rich = items => (items||[]).map(item=>item.plain_text ?? item.text?.content ?? '').join('').trim();
          const textValue = prop => prop?.type==='title' ? rich(prop.title) : prop?.type==='rich_text' ? rich(prop.rich_text) : '';
          let changed=0, already=0;
          for (const record of snapshot.records) {
            const current = await request(`/pages/${record.notion_id}`);
            const props = current.properties || {};
            const code = clean(textValue(props['Código']));
            const lot = clean(textValue(props['Lote de publicação']));
            const github = clean(textValue(props['Código GitHub']));
            const date = props['Data da publicação']?.date?.start || '';
            const released = props['Liberada para exportação']?.checkbox === true;
            if (code !== clean(record.code)) throw new Error(`${record.code}: identidade divergente.`);
            if (lot !== clean(record.publication_lot) || !released) throw new Error(`${record.code}: lote/liberação divergente.`);
            if (github && github !== process.env.RELEASE_CODE) throw new Error(`${record.code}: Código GitHub conflitante ${github}.`);
            if (date && date !== DATE) throw new Error(`${record.code}: data conflitante ${date}.`);
            if (github === process.env.RELEASE_CODE && date === DATE) { already+=1; continue; }
            await request(`/pages/${record.notion_id}`, {method:'PATCH', body:JSON.stringify({properties:{'Código GitHub':{rich_text:[{type:'text',text:{content:process.env.RELEASE_CODE}}]},'Data da publicação':{date:{start:DATE}}}})});
            changed+=1;
            if ((changed+already)%25===0) console.log(`${changed+already}/237 fechados.`);
          }
          let verified=0;
          for (const record of snapshot.records) {
            const current = await request(`/pages/${record.notion_id}`);
            const props = current.properties || {};
            if (clean(textValue(props['Código GitHub'])) !== process.env.RELEASE_CODE || props['Data da publicação']?.date?.start !== DATE) throw new Error(`${record.code}: fechamento não persistiu.`);
            verified+=1;
          }
          if (verified!==237) throw new Error(`Fechamento ${verified}/237.`);
          console.log(`✓ Notion fechado 237/237; ${changed} atualizados e ${already} já conciliados.`);
          NODE

      - name: Gravar recibo final, remover automação temporária e fechar PRs
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/operations
          SNAP=$(sha256sum "$SNAPSHOT_PATH" | awk '{print $1}')
          PLAN=$(sha256sum "$PLAN_PATH" | awk '{print $1}')
          jq -n \
            --arg release "$RELEASE_SHA" \
            --arg code "$RELEASE_CODE" \
            --arg url "$PUBLIC_URL" \
            --arg snapshot "$SNAP" \
            --arg plan "$PLAN" \
            --arg confirmed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:"1.0",operation_id:"CFO-CRMVGO-TECADM-237-PUBLICATION-20260807",status:"success",release_sha:$release,release_code:$code,public_url:$url,confirmed_at:$confirmed_at,baseline_questions:3210,published_records:237,cfo_records:118,crmvgo_records:119,public_questions:3447,public_materials:75,master_bank:3449,awaiting_audit:0,discursive_display_items:2,excluded:{cfo:[45,104],crmvgo:[94]},snapshot_sha256:$snapshot,plan_sha256:$plan,public_cache_version:"sedes-questoes-v2-13-0-r5",public_validation:true,notion_closed:true,recovery:{reason:"legacy verify-deployment expected cache without -r5",original_target_run:31204687134},permanent_automations_restored:false}' > "$RECEIPT_PATH"
          git config user.name 'sedes-df-publish[bot]'
          git config user.email 'sedes-df-publish[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-cfo-crmvgo-237.yml
          git add "$RECEIPT_PATH"
          git commit -m 'Fechar publicação CFO e CRMV-GO 237/237 [skip ci]'
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo 'A main avançou durante o fechamento.'; exit 1; }
          git push origin HEAD:main
          gh pr close "$TRIGGER_PR" --repo "$GITHUB_REPOSITORY" --comment 'Fechamento 237/237 concluído; PR de disparo não deve ser mesclado.' || true
          gh pr close 169 --repo "$GITHUB_REPOSITORY" --comment 'Substituído pelo fechamento de recuperação; não mesclar.' || true
