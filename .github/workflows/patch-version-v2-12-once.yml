name: Ajustar validações da versão 2.12 uma vez

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/notion-sync-ce-v2-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Alinhar testes e validação ao snapshot dinâmico
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/reports-v2-10.spec.js')
          test = test_path.read_text()
          old_version = 'expect(build.version).toBe("2.11.1");'
          new_version = 'expect(build.version).toBe("2.12.0");'
          if old_version in test:
              test = test.replace(old_version, new_version)
          elif new_version not in test:
              raise SystemExit('Marcador da versão não localizado no teste')
          test_path.write_text(test)

          validator_path = Path('scripts/validate-release-v2-4.mjs')
          validator = validator_path.read_text()
          old_block = '''const activeQuestions = activeEntries.reduce((sum, item) => sum + Number(item.expected_questions || 0), 0);
          const expectedQuestions = Number(config.expected_questions) + activeQuestions;
          const expectedMaterials = Number(config.expected_materials) + activeEntries.length;
          const expectedBank = Number(config.banco_mestre);
          const expectedPending = Number(config.aguardando_auditoria) - activeQuestions;'''.replace('          ', '')
          new_block = '''const activeQuestions = activeEntries.reduce((sum, item) => sum + Number(item.expected_questions || 0), 0);
          const snapshotPath = resolve("data/notion/published.json");
          const snapshotInstalled = fs.existsSync(snapshotPath) && read("data/notion/published.json").trim();
          const snapshot = snapshotInstalled ? readJSON("data/notion/published.json") : null;
          const expectedQuestions = snapshot ? Number(snapshot.totals.published) : Number(config.expected_questions) + activeQuestions;
          const expectedMaterials = snapshot ? Number(snapshot.totals.materials) : Number(config.expected_materials) + activeEntries.length;
          const expectedBank = snapshot ? Number(snapshot.totals.all) : Number(config.banco_mestre);
          const expectedPending = snapshot ? Number(snapshot.totals.pending) : Number(config.aguardando_auditoria) - activeQuestions;
          const expectedTrueFalse = snapshot
            ? snapshot.records.filter(record => record.format === "Certo / Errado").length
            : activeQuestions;'''.replace('          ', '')
          if old_block in validator:
              validator = validator.replace(old_block, new_block)
          elif 'const expectedTrueFalse = snapshot' not in validator:
              raise SystemExit('Bloco de totais não localizado no validador')
          old_tf = 'if (trueFalseQuestions !== activeQuestions) fail(`Total C/E ativo divergente: esperado ${activeQuestions}, encontrado ${trueFalseQuestions}.`);'
          new_tf = 'if (trueFalseQuestions !== expectedTrueFalse) fail(`Total C/E ativo divergente: esperado ${expectedTrueFalse}, encontrado ${trueFalseQuestions}.`);'
          if old_tf in validator:
              validator = validator.replace(old_tf, new_tf)
          elif new_tf not in validator:
              raise SystemExit('Validação do total C/E não localizada')
          validator_path.write_text(validator)
          PY
      - name: Registrar ajustes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/reports-v2-10.spec.js scripts/validate-release-v2-4.mjs
          if git diff --cached --quiet; then
            echo 'Validações já alinhadas.'
          else
            git commit -m 'Alinha testes e validação ao snapshot dinâmico 2.12'
            git push origin HEAD:${{ github.head_ref }}
          fi
