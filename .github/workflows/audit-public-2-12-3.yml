name: Diagnosticar deploy GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-public-2-12-3.yml'

permissions:
  contents: read
  actions: read
  pages: read

concurrency:
  group: diagnose-pages-main
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/audit-public-2-12-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Listar execuções recentes do workflow de Pages no main
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=15" > /tmp/runs.json
          jq -r '.workflow_runs[] | [.id,.run_number,.event,.status,(.conclusion // "-"),.head_sha,.created_at,.html_url] | @tsv' /tmp/runs.json

      - name: Exibir jobs e etapas das execuções recentes
        shell: bash
        run: |
          set -euo pipefail
          for run_id in $(jq -r '.workflow_runs[0:8][].id' /tmp/runs.json); do
            echo "===== RUN ${run_id} ====="
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "/tmp/jobs-${run_id}.json"
            jq -r '.jobs[] | "JOB\t\(.id)\t\(.name)\t\(.status)\t\(.conclusion // "-")\n" + ((.steps // []) | map("STEP\t\(.number)\t\(.name)\t\(.status)\t\(.conclusion // "-")") | join("\n"))' "/tmp/jobs-${run_id}.json"
          done

      - name: Consultar configuração do GitHub Pages
        shell: bash
        run: |
          set +e
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pages" 2>&1 | jq . || true
