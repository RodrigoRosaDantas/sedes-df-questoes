name: Preparar sincronização controlada do Banco Mestre do Notion

on:
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sedes-df-notion-sync-controlled
  cancel-in-progress: false

jobs:
  prepare-sync-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       github.event.issue.title == '[sync-notion]' &&
       github.actor == github.repository_owner &&
       github.event.issue.body == 'prepare_sync=true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Confirmar autorização explícita quando acionado por issue
        if: github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail
          test "${ISSUE_TITLE}" = '[sync-notion]'
          test "${ISSUE_BODY}" = 'prepare_sync=true'
          test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          echo '✓ Sincronização autorizada explicitamente pelo proprietário.'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Baixar a main vigente
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configurar autoria da sincronização
        run: |
          git config user.name 'sedes-df-notion-sync[bot]'
          git config user.email 'sedes-df-notion-sync[bot]@users.noreply.github.com'

      - name: Ler o Banco Mestre do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/export-notion-snapshot.mjs

      - name: Gerar o plano de publicação
        run: node scripts/create-publication-plan.mjs

      - name: Materializar e auditar o snapshot sobre a release vigente
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_QUESTIONS="$(node -e "const x=require('./data/release/catalogo.json'); console.log(Object.keys(x.question_index || {}).length)")"
          BEFORE_MATERIALS="$(node -e "const x=require('./data/release/catalogo.json'); console.log((x.materials || []).length)")"
          echo "Release vigente antes do Notion: ${BEFORE_QUESTIONS} questões em ${BEFORE_MATERIALS} materiais."

          BEFORE_RELEASE="${RUNNER_TEMP}/release-before-notion"
          rm -rf "${BEFORE_RELEASE}"
          cp -R data/release "${BEFORE_RELEASE}"

          # A sincronização incremental parte da release pública já rastreada.
          # Não executamos `npm run build` aqui porque esse comando recompõe
          # operações editoriais históricas que dependiam de arquivos temporários
          # de agosto e não fazem parte do contrato atual Notion -> release.
          node --import=./scripts/fixed-build-time.mjs scripts/apply-notion-snapshot.mjs
          node scripts/reconcile-notion-snapshot-provenance.mjs
          node --import=./scripts/fixed-build-time.mjs scripts/build-study-index.mjs
          node scripts/build-question-search-index.mjs
          node scripts/audit-notion-release-delta.mjs "${BEFORE_RELEASE}" data/release

          AFTER_QUESTIONS="$(node -e "const x=require('./data/release/catalogo.json'); console.log(Object.keys(x.question_index || {}).length)")"
          AFTER_MATERIALS="$(node -e "const x=require('./data/release/catalogo.json'); console.log((x.materials || []).length)")"
          echo "Release candidata após o Notion: ${AFTER_QUESTIONS} questões em ${AFTER_MATERIALS} materiais."

          if [ "${AFTER_QUESTIONS}" -lt "${BEFORE_QUESTIONS}" ]; then
            echo "Regressão bloqueada: questões ${BEFORE_QUESTIONS} -> ${AFTER_QUESTIONS}."
            exit 1
          fi
          if [ "${AFTER_MATERIALS}" -lt "${BEFORE_MATERIALS}" ]; then
            echo "Regressão bloqueada: materiais ${BEFORE_MATERIALS} -> ${AFTER_MATERIALS}."
            exit 1
          fi

      - name: Validar snapshot, plano e crescimento da release
        run: |
          node scripts/validate-notion-snapshot.mjs
          node scripts/validate-publication-plan.mjs
          npm run check

      - name: Restringir alterações ao contrato de dados
        shell: bash
        run: |
          set -euo pipefail
          UNEXPECTED="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(data/notion/(published|publication-plan)\.json|data/release/)' || true)"
          if [ -n "${UNEXPECTED}" ]; then
            echo 'A sincronização tentou alterar arquivos fora do contrato permitido:'
            echo "${UNEXPECTED}"
            exit 1
          fi

      - name: Criar PR somente quando houver mudança semântica
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add data/notion/published.json data/notion/publication-plan.json data/release
          if git diff --cached --quiet; then
            echo '✓ Banco Mestre sem mudança semântica publicável; nenhum PR necessário.'
            exit 0
          fi

          BRANCH="notion-sync/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          QUESTIONS="$(node -e "const x=require('./data/notion/published.json'); console.log(x.totals?.published ?? 0)")"
          MATERIALS="$(node -e "const x=require('./data/notion/published.json'); console.log(x.totals?.materials ?? 0)")"
          PENDING="$(node -e "const x=require('./data/notion/published.json'); console.log(x.totals?.pending ?? 0)")"
          PUBLIC_QUESTIONS="$(node -e "const x=require('./data/release/catalogo.json'); console.log(Object.keys(x.question_index || {}).length)")"
          PUBLIC_MATERIALS="$(node -e "const x=require('./data/release/catalogo.json'); console.log((x.materials || []).length)")"

          git switch -c "${BRANCH}"
          git commit -m "Sincronizar Banco Mestre do Notion"
          git push origin "HEAD:${BRANCH}"

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "[notion-sync] Atualizar Banco Mestre" \
            --body "Sincronização controlada preparada a partir do Banco Mestre do Notion.\n\n- questões publicáveis no snapshot: ${QUESTIONS}\n- materiais no snapshot: ${MATERIALS}\n- registros fora do site: ${PENDING}\n- questões preservadas/materializadas na release candidata: ${PUBLIC_QUESTIONS}\n- materiais preservados/materializados na release candidata: ${PUBLIC_MATERIALS}\n\nO workflow apenas lê o Notion e prepara este PR. Não publica o GitHub Pages e não escreve no Notion. A release pública vigente é a base da mesclagem e qualquer redução de questões ou materiais é bloqueada. Após revisão e merge, a publicação continua exigindo autorização explícita por SHA no workflow de Pages."
