name: Inspecionar correção do cartão Banco Mestre

on:
  push:
    branches: [main]
    paths:
      - 'data/editorial/inspect-dashboard-card-fix-trigger.json'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Localizar execução e registrar diagnóstico
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[] | select(.path == ".github/workflows/fix-dashboard-card-source.yml") | .id' | head -n1)
          if [ -z "${WORKFLOW_ID}" ]; then
            echo 'Workflow da correção não localizado.'
            exit 1
          fi
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?branch=main&per_page=10" --jq '.workflow_runs[0].id')
          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
            echo 'Nenhuma execução localizada.'
            exit 1
          fi

          for attempt in $(seq 1 120); do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')
            if [ "${STATUS}" = 'completed' ]; then break; fi
            sleep 5
          done

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/run.json
          STATUS=$(jq -r '.status' /tmp/run.json)
          CONCLUSION=$(jq -r '.conclusion // ""' /tmp/run.json)
          HEAD_SHA=$(jq -r '.head_sha' /tmp/run.json)
          CREATED_AT=$(jq -r '.created_at' /tmp/run.json)
          UPDATED_AT=$(jq -r '.updated_at' /tmp/run.json)
          HTML_URL=$(jq -r '.html_url' /tmp/run.json)
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > /tmp/jobs.json

          mkdir -p data/editorial
          jq -n \
            --arg operation 'INSPECT-DASHBOARD-CARD-FIX-20260805' \
            --argjson workflow_id "${WORKFLOW_ID}" \
            --argjson run_id "${RUN_ID}" \
            --arg status "${STATUS}" \
            --arg conclusion "${CONCLUSION}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg created_at "${CREATED_AT}" \
            --arg updated_at "${UPDATED_AT}" \
            --arg html_url "${HTML_URL}" \
            --slurpfile jobs /tmp/jobs.json \
            '{operation:$operation,workflow_id:$workflow_id,run_id:$run_id,status:$status,conclusion:$conclusion,head_sha:$head_sha,created_at:$created_at,updated_at:$updated_at,html_url:$html_url,jobs:[$jobs[0].jobs[]|{id,name,status,conclusion,steps:[.steps[]?|{name,status,conclusion,number}]}]}' \
            > data/editorial/dashboard-card-fix-inspection.json

          if [ "${CONCLUSION}" != 'success' ]; then
            gh run view "${RUN_ID}" --log-failed > data/editorial/dashboard-card-fix-failed.log 2>&1 || true
          else
            printf 'Execução concluída com sucesso.\n' > data/editorial/dashboard-card-fix-failed.log
          fi

          git config user.name 'sedes-df-dashboard-inspect[bot]'
          git config user.email 'sedes-df-dashboard-inspect[bot]@users.noreply.github.com'
          git add data/editorial/dashboard-card-fix-inspection.json data/editorial/dashboard-card-fix-failed.log
          git commit -m 'Registrar diagnóstico da correção do cartão [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "✓ Diagnóstico do run ${RUN_ID}: ${STATUS}/${CONCLUSION}."
