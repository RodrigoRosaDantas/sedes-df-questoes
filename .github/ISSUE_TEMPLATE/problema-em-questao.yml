name: Problema em questão
description: Relate possível erro editorial, de gabarito, classificação, imagem ou interface.
title: "[Questão] "
labels: []
body:
  - type: input
    id: question
    attributes:
      label: Questão ou código
      placeholder: Ex.: PROVA-QDX-...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Tipo de problema
      options:
        - Possível erro de gabarito
        - Erro de transcrição
        - Comentário ou fundamento incompleto
        - Classificação incorreta
        - Imagem ausente ou ilegível
        - Problema visual ou de navegação
        - Outro
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release/commit
      placeholder: Ex.: 2.13.0 / abc1234
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Explique o problema e, quando possível, indique a fonte ou o comportamento esperado.
    validations:
      required: true
